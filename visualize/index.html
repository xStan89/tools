         { label: '3 over 4',                    spec: { type: 'rows',  rows: [3, 4] } }],
    8:  [{ label: '4 across x 2 rows',           spec: { type: 'rows',  rows: [4, 4] } }],
    9:  [{ label: '3 x 3',                       spec: { type: 'rows',  rows: [3, 3, 3] } }],
    10: [{ label: '8 squares + 2 centre rings',  spec: { type: 'squaresWithRings' } }]
  };

  function cellOptionsFor(count) { return CELL_CONFIGS[count] || CELL_CONFIGS[1]; }

  // The whole feature is dormant at a count of 1: the chart behaves exactly
  // as it did before cells existed (physics everywhere, no hiding, no chrome).
  function cellsActive() { return (Number(formattingSettings.cellCount) || 1) > 1; }

  function buildCells(spec) {
    const H = CELL_GRID_HALF, cells = [];
    if (spec.type === 'rows') {
      // Equal-size cells; a row holding fewer than the widest row is centred.
      const rows = spec.rows, maxCols = Math.max.apply(null, rows);
      const cw = (2 * H) / maxCols, chh = (2 * H) / rows.length;
      rows.forEach((k, ri) => {
        const y1 = H - ri * chh, y0 = y1 - chh, xStart = -(k * cw) / 2;
        for (let ci = 0; ci < k; ci++) {
          cells.push({ kind: 'rect', x0: xStart + ci * cw, x1: xStart + (ci + 1) * cw, y0: y0, y1: y1 });
        }
      });
    } else if (spec.type === 'rings') {
      // Concentric bands of equal radial thickness, inscribed in the grid.
      const t = H / spec.n;
      for (let i = 0; i < spec.n; i++) cells.push({ kind: 'ring', rInner: i * t, rOuter: (i + 1) * t });
    } else if (spec.type === 'squaresWithRings') {
      // 3x3 of squares; the centre square is replaced by two concentric rings.
      const cw = (2 * H) / 3;
      for (let ri = 0; ri < 3; ri++) {
        for (let ci = 0; ci < 3; ci++) {
          const x0 = -H + ci * cw, y1 = H - ri * cw;
          if (ri === 1 && ci === 1) {
            cells.push({ kind: 'ring', rInner: 0, rOuter: cw / 4 });
            cells.push({ kind: 'ring', rInner: cw / 4, rOuter: cw / 2 });
          } else {
            cells.push({ kind: 'rect', x0: x0, x1: x0 + cw, y0: y1 - cw, y1: y1 });
          }
        }
      }
    }
    return cells;
  }

  let _cellsCache = null, _cellsCacheKey = '';
  function currentCells() {
    const key = formattingSettings.cellCount + '|' + formattingSettings.cellOption;
    if (_cellsCache && _cellsCacheKey === key) return _cellsCache;
    const opts = cellOptionsFor(Number(formattingSettings.cellCount) || 1);
    const oi = Math.min(Math.max(0, (Number(formattingSettings.cellOption) || 1) - 1), opts.length - 1);
    _cellsCache = buildCells(opts[oi].spec);
    _cellsCacheKey = key;
    return _cellsCache;
  }
  function invalidateCells() { _cellsCache = null; _cellsCacheKey = ''; }

  function ensureCellTitles() {
    if (!Array.isArray(formattingSettings.cellTitles)) formattingSettings.cellTitles = [];
    while (formattingSettings.cellTitles.length < 10) formattingSettings.cellTitles.push('');
  }
  function normalizeCellSettings() {
    const fs = formattingSettings;
    let c = Math.round(Number(fs.cellCount));
    if (!isFinite(c) || c < 1) c = 1; if (c > 10) c = 10;
    fs.cellCount = c;
    const opts = cellOptionsFor(c);
    let o = Math.round(Number(fs.cellOption));
    if (!isFinite(o) || o < 1 || o > opts.length) o = 1;
    fs.cellOption = o;
    if (!isFinite(Number(fs.cellTitleSize))) fs.cellTitleSize = 16;
    ensureCellTitles();
    invalidateCells();
  }

  function cellTitle(i) {
    const t = formattingSettings.cellTitles;
    return (Array.isArray(t) && t[i]) ? String(t[i]).trim() : '';
  }
  // Vertical space (grid units) a rect cell reserves at its top for a title.
  function cellTitlePadGrid(i) {
    if (!gridScale) return 0;
    const cells = currentCells();
    if (!cells[i] || cells[i].kind !== 'rect' || !cellTitle(i)) return 0;
    return ((Number(formattingSettings.cellTitleSize) || 16) + 16) / gridScale;
  }

  // Push a grid point inside a cell, keeping the whole node circle within it.
  function clampToCell(cell, gx, gy, rGrid, titlePad) {
    if (!cell) return { gx: gx, gy: gy };
    if (cell.kind === 'rect') {
      const lox = cell.x0 + rGrid, hix = cell.x1 - rGrid;
      const loy = cell.y0 + rGrid, hiy = cell.y1 - titlePad - rGrid;
      return {
        gx: (lox > hix) ? (cell.x0 + cell.x1) / 2 : Math.min(hix, Math.max(lox, gx)),
        gy: (loy > hiy) ? (cell.y0 + cell.y1 - titlePad) / 2 : Math.min(hiy, Math.max(loy, gy))
      };
    }
    // Ring: the angle is free, the radius is clamped to the band.
    const mid = (cell.rInner + cell.rOuter) / 2;
    const lo = (cell.rInner === 0) ? 0 : cell.rInner + rGrid;
    const hi = cell.rOuter - rGrid;
    let d = Math.hypot(gx, gy);
    if (lo > hi) {
      if (cell.rInner === 0) return { gx: 0, gy: 0 };
      return (d < 1e-6) ? { gx: 0, gy: mid } : { gx: gx / d * mid, gy: gy / d * mid };
    }
    if (d < 1e-6) return (lo <= 0) ? { gx: 0, gy: 0 } : { gx: 0, gy: lo };
    const nd = Math.min(hi, Math.max(lo, d));
    return { gx: gx / d * nd, gy: gy / d * nd };
  }

  // Evenly spaced slots for n nodes inside one cell, in grid units.
  function cellSlots(cell, n, titlePad, rGrid) {
    const out = [];
    if (!cell || n <= 0) return out;

    if (cell.kind === 'ring') {
      // One node in the centre disc sits dead centre; otherwise nodes are
      // spread evenly around the band's mid-radius, packing tighter as the
      // count grows.
      if (cell.rInner === 0 && n === 1) return [{ gx: 0, gy: 0 }];
      const mid = (cell.rInner + cell.rOuter) / 2;
      for (let i = 0; i < n; i++) {
        const a = (2 * Math.PI * i) / n;               // 0 = top, clockwise
        out.push({ gx: mid * Math.sin(a), gy: mid * Math.cos(a) });
      }
      return out;
    }

    const x0 = cell.x0 + rGrid, x1 = cell.x1 - rGrid;
    const y0 = cell.y0 + rGrid, y1 = cell.y1 - titlePad - rGrid;
    const cx = (cell.x0 + cell.x1) / 2, cy = (cell.y0 + cell.y1 - titlePad) / 2;
    const w = x1 - x0, h = y1 - y0;
    if (w <= 0 || h <= 0) { for (let i = 0; i < n; i++) out.push({ gx: cx, gy: cy }); return out; }

    // Pick the rows x cols split that gives each node the most room, which
    // automatically follows the cell's aspect ratio.
    let best = null;
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const sz = Math.min(w / cols, h / rows);
      if (!best || sz > best.sz + 1e-9) best = { cols: cols, rows: rows, sz: sz };
    }
    const cw = w / best.cols, chh = h / best.rows;
    let placed = 0;
    for (let r = 0; r < best.rows; r++) {
      const k = Math.min(best.cols, n - placed);
      const rowStart = cx - (k * cw) / 2;             // a short last row centres
      for (let c = 0; c < k; c++) out.push({ gx: rowStart + (c + 0.5) * cw, gy: y1 - (r + 0.5) * chh });
      placed += k;
    }
    return out;
  }

  // Re-read the "Cell" column into node state. Blank, invalid and
  // out-of-range values all leave the node on physics.
  function updateCellAssignments() {
    invalidateCells();
    const active = cellsActive();
    const cells = active ? currentCells() : [];
    nodes.forEach(n => {
      const prev = n.cellIdx;
      let idx = null;
      if (active && n.cellValue != null && n.cellValue >= 1 && n.cellValue <= cells.length) {
        idx = n.cellValue - 1;
      }
      n.cellIdx = idx;
      n.manualInCell = (idx != null) && savedPositions.has(n.name);
      if (n.manualInCell) {
        const sp = savedPositions.get(n.name);
        n.gridX = sp.x; n.gridY = sp.y;
      }
      // Node just left the cell system — hand it back to physics.
      if (prev != null && idx == null && !savedPositions.has(n.name)) {
        n.hasGridCoords = false; n.fx = null; n.fy = null;
      }
    });
  }

  // Position every cell-assigned node. Manually placed nodes keep their spot
  // and claim the nearest slot; the rest fill the remaining slots in sheet
  // order. Hidden nodes still consume a slot.
  function applyCellLayout() {
    if (!cellsActive() || !nodes.length || !gridScale) return;
    const cells = currentCells();
    const buckets = cells.map(() => []);
    nodes.forEach(n => { if (n.cellIdx != null && buckets[n.cellIdx]) buckets[n.cellIdx].push(n); });

    buckets.forEach((list, ci) => {
      if (!list.length) return;
      list.sort((a, b) => (a.order || 0) - (b.order || 0));
      const cell = cells[ci];
      const titlePad = cellTitlePadGrid(ci);
      const rGrid = list.reduce((m, n) => Math.max(m, n.r || 0), 0) / gridScale;
      const slots = cellSlots(cell, list.length, titlePad, rGrid);
      const used = new Array(slots.length).fill(false);
      const autos = [];

      list.forEach(n => {
        if (!n.manualInCell) { autos.push(n); return; }
        const p = clampToCell(cell, n.gridX, n.gridY, rGrid, titlePad);
        n.gridX = p.gx; n.gridY = p.gy;
        let bi = -1, bd = Infinity;
        for (let i = 0; i < slots.length; i++) {
          if (used[i]) continue;
          const dx = slots[i].gx - p.gx, dy = slots[i].gy - p.gy, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; bi = i; }
        }
        if (bi >= 0) used[bi] = true;
      });

      let k = 0;
      autos.forEach(n => {
        while (k < used.length && used[k]) k++;
        const s = slots[k] || slots[slots.length - 1] || { gx: 0, gy: 0 };
        if (k < used.length) used[k] = true;
        n.gridX = s.gx; n.gridY = s.gy;
      });

      list.forEach(n => {
        n.hasGridCoords = true;
        const px = gridToPixel(n.gridX, n.gridY);
        n.x = px.x; n.y = px.y; n.fx = px.x; n.fy = px.y;
      });
    });
  }

  // Light dashed cell boundaries, drawn behind everything else.
  function drawCells() {
    if (!cellsActive() || !gridScale) return;
    const cells = currentCells();
    const origin = gridToPixel(0, 0);

    ctx.save();
    ctx.lineWidth = 1.25 / zoomLevel;
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.setLineDash([7 / zoomLevel, 5 / zoomLevel]);
    cells.forEach(cell => {
      if (cell.kind === 'rect') {
        const a = gridToPixel(cell.x0, cell.y1), b = gridToPixel(cell.x1, cell.y0);
        ctx.strokeRect(a.x, a.y, b.x - a.x, b.y - a.y);
      } else {
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, cell.rOuter * gridScale, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    ctx.setLineDash([]);
    ctx.restore();
  }

  // Cell titles are drawn in a separate pass at the very end of render() so
  // they always sit above nodes, connection lines and every label. They use
  // the same rounded background box as node labels.
  function drawCellTitles() {
    if (!cellsActive() || !gridScale) return;
    const cells = currentCells();
    const titleSize = Number(formattingSettings.cellTitleSize) || 16;

    ctx.save();
    ctx.font = '600 ' + (titleSize / zoomLevel) + 'px Rubik, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const pad = CONFIG.labelBoxPadding / zoomLevel;
    const boxH = (titleSize + 6) / zoomLevel;

    cells.forEach((cell, i) => {
      const t = cellTitle(i);
      if (!t) return;
      const boxW = ctx.measureText(t).width + pad * 2;
      let cx, boxTop;
      if (cell.kind === 'rect') {
        const p = gridToPixel((cell.x0 + cell.x1) / 2, cell.y1);
        cx = p.x; boxTop = p.y + 6 / zoomLevel;          // just inside the top edge
      } else {
        const p = gridToPixel(0, cell.rOuter);
        cx = p.x; boxTop = p.y - 5 / zoomLevel - boxH;   // sits on top of the ring
      }

      ctx.save();
      ctx.globalAlpha = CONFIG.labelBoxOpacity;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      roundRectPath(cx - boxW / 2, boxTop, boxW, boxH, 6 / zoomLevel);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#111827';
      ctx.fillText(t, cx, boxTop + boxH / 2);
    });
    ctx.restore();
  }

  // Small numbered diagram for the options menu.
  function cellPreviewSVG() {
    const cells = currentCells();
    const parts = [];
    cells.forEach((c, i) => {
      if (c.kind === 'rect') {
        parts.push('<rect x="' + c.x0 + '" y="' + (-c.y1) + '" width="' + (c.x1 - c.x0) +
          '" height="' + (c.y1 - c.y0) + '" fill="#FFFFFF" stroke="#6B6A66" stroke-width="0.4" stroke-dasharray="1.8 1.3"/>');
        parts.push('<text x="' + ((c.x0 + c.x1) / 2) + '" y="' + (-(c.y0 + c.y1) / 2) +
          '" font-size="6" text-anchor="middle" dominant-baseline="central" fill="#020202">' + (i + 1) + '</text>');
      } else {
        const band = c.rOuter - c.rInner;
        const fsz = Math.min(6, Math.max(2.6, band * 0.7));
        parts.push('<circle cx="0" cy="0" r="' + c.rOuter + '" fill="none" stroke="#6B6A66" stroke-width="0.4" stroke-dasharray="1.8 1.3"/>');
        parts.push('<text x="0" y="' + (-(c.rInner + c.rOuter) / 2) + '" font-size="' + fsz +
          '" text-anchor="middle" dominant-baseline="central" fill="#020202">' + (i + 1) + '</text>');
      }
    });
    return '<svg viewBox="-31 -31 62 62" font-family="Rubik, Arial, sans-serif" ' +
      'style="width:100%;max-width:208px;display:block;margin:2px auto 0;background:#fff;' +
      'border:1px solid var(--line);border-radius:10px;">' + parts.join('') + '</svg>';
  }

  /************************************************************************
   * PHYSICS: STRUCTURAL CACHE
   * Hop distances and neighbourhood similarity are expensive, so they are
   * derived once per *connection set* and reused by every restart. Moving a
   * strength slider re-runs the simulation against this cache and never
   * recomputes it. The build is time-sliced on the main thread: the
   * force-directed and collision components start immediately, and the
   * stress / similarity components switch on the moment the cache lands.
   ************************************************************************/
  const EMPTY_I32 = new Int32Array(0);
  // The simulation stops once alpha falls below this. Also used to turn the
  // "Physics run time" slider into an alphaDecay value.
  const PHYSICS_ALPHA_MIN = 0.0005;

  // True while the simulation is running; render() drops labels and images
  // on large graphs for as long as it is set.
  let simHot = false;
  let simRenderPending = false;
  let simRenderTick = 0;

  const GRAPH_CACHE = {
    sig: null,          // signature of the connection set this was built from
    ready: false,
    n: 0,
    ids: [],            // cache index -> node id
    ref: [],            // cache index -> live node object
    index: new Map(),   // node id -> cache index
    adj: [],            // cache index -> Int32Array of neighbour indices
    deg: null,          // Int32Array of degrees
    pivots: [],         // cache indices used as stress pivots
    dist: [],           // dist[p][i] = hops from pivots[p] to i (-1 = unreachable)
    simA: null,         // top-K Jaccard pairs, as three parallel typed arrays
    simB: null,
    simW: null,
    token: 0            // guards against two builds overlapping
  };

  // Cheap FNV-1a over the edge list. Two graphs with the same connections
  // produce the same signature, so slider changes reuse the cache and a data
  // refresh that actually altered connections rebuilds it.
  function graphSignature() {
    let h = 2166136261 ^ links.length;
    for (let i = 0; i < links.length; i++) {
      const s = links[i].source.id, t = links[i].target.id;
      for (let k = 0; k < s.length; k++) h = Math.imul(h ^ s.charCodeAt(k), 16777619);
      h = Math.imul(h ^ 124, 16777619);
      for (let k = 0; k < t.length; k++) h = Math.imul(h ^ t.charCodeAt(k), 16777619);
      h = Math.imul(h ^ 59, 16777619);
    }
    return (h >>> 0) + ':' + links.length + ':' + nodes.length;
  }

  // Re-point the cache at the current node objects. Ids survive a data
  // refresh even when the node array itself is rebuilt.
  function bindGraphCache() {
    const C = GRAPH_CACHE;
    if (!C.ready) return;
    for (let i = 0; i < C.n; i++) C.ref[i] = nodeById.get(C.ids[i]) || null;
  }

  function ensureGraphCache() {
    const C = GRAPH_CACHE;
    const sig = graphSignature();
    // Same connections: reuse whatever is cached, or let an in-flight build
    // for this same graph finish. This is the path every slider change takes.
    if (C.sig === sig) { bindGraphCache(); return; }
    C.sig = sig;
    C.ready = false;
    const token = ++C.token;
    runChunked(graphCacheSteps(), token, () => {
      C.ready = true;
      if (simulation) simulation.alpha(Math.max(simulation.alpha(), 0.4)).restart();
    });
  }

  // Drive a generator in ~12ms slices so a 10k-node precompute never blocks
  // the frame for long enough to feel like a freeze. A build whose token has
  // been superseded is abandoned rather than allowed to finish over the top
  // of a newer one.
  function runChunked(gen, token, onDone) {
    const step = () => {
      if (GRAPH_CACHE.token !== token) return;
      const t0 = performance.now();
      let r;
      do { r = gen.next(); } while (!r.done && performance.now() - t0 < 12);
      if (r.done) onDone(); else setTimeout(step, 0);
    };
    step();
  }

  function* graphCacheSteps() {
    const C = GRAPH_CACHE;
    const list = nodes, n = list.length;
    C.n = n;
    C.ids = new Array(n);
    C.ref = new Array(n);
    C.index = new Map();
    for (let i = 0; i < n; i++) { C.ids[i] = list[i].id; C.ref[i] = list[i]; C.index.set(list[i].id, i); }

    /* ---- adjacency (undirected; A->B and B->A collapse to one edge) ---- */
    const sets = new Array(n).fill(null);
    for (let i = 0; i < links.length; i++) {
      const a = C.index.get(links[i].source.id), b = C.index.get(links[i].target.id);
      if (a === undefined || b === undefined || a === b) continue;
      (sets[a] || (sets[a] = new Set())).add(b);
      (sets[b] || (sets[b] = new Set())).add(a);
      if ((i & 4095) === 0) yield;
    }
    C.adj = new Array(n);
    C.deg = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      C.adj[i] = sets[i] ? Int32Array.from(sets[i]) : EMPTY_I32;
      C.deg[i] = C.adj[i].length;
      sets[i] = null;
      if ((i & 2047) === 0) yield;
    }

    /* ---- hop distances from a pivot set (sparse stress) ---- */
    const queue = new Int32Array(n);
    const bfs = (src, out) => {
      out.fill(-1);
      let head = 0, tail = 0;
      out[src] = 0; queue[tail++] = src;
      while (head < tail) {
        const v = queue[head++], d = out[v] + 1, av = C.adj[v];
        for (let k = 0; k < av.length; k++) { const w = av[k]; if (out[w] === -1) { out[w] = d; queue[tail++] = w; } }
      }
    };

    const exact = n <= CONFIG.force.stressExactMax;
    const P = exact ? n : Math.min(n, CONFIG.force.stressPivots);
    C.pivots = new Array(P);
    C.dist = new Array(P);

    if (exact) {
      // Small graphs get true all-pairs shortest paths.
      for (let i = 0; i < n; i++) {
        const d = new Int32Array(n);
        bfs(i, d);
        C.pivots[i] = i; C.dist[i] = d;
        if ((i & 15) === 0) yield;
      }
    } else {
      // Larger graphs use k-centers pivots: seed at the highest-degree node,
      // then repeatedly take whichever node is furthest from every pivot so
      // far. Unreachable counts as maximally far, which spreads pivots
      // across disconnected components on its own.
      let seed = 0;
      for (let i = 1; i < n; i++) if (C.deg[i] > C.deg[seed]) seed = i;
      const mind = new Int32Array(n).fill(0x7fffffff);
      for (let p = 0; p < P; p++) {
        const d = new Int32Array(n);
        bfs(seed, d);
        C.pivots[p] = seed; C.dist[p] = d;
        let best = -1, bestv = -1;
        for (let i = 0; i < n; i++) {
          const di = d[i] < 0 ? 0x7fffffff : d[i];
          if (di < mind[i]) mind[i] = di;
          if (mind[i] !== 0 && mind[i] > bestv) { bestv = mind[i]; best = i; }
        }
        seed = best >= 0 ? best : (seed + 1) % n;
        yield;
      }
    }

    /* ---- top-K Jaccard neighbourhood similarity ----
       Candidates come from 2-hop neighbourhoods, which is the only place a
       non-zero Jaccard score can live. Very high-degree nodes are sampled
       rather than fully enumerated, so one hub can't blow up the pass. */
    const cap = CONFIG.force.simDegreeCap;
    const K = CONFIG.force.simTopK;
    const floor = CONFIG.force.simFloor;
    const counts = new Int32Array(n);
    const touched = new Int32Array(n);
    const pairs = [];
    const seen = new Set();
    const candI = [], candW = [];

    for (let i = 0; i < n; i++) {
      const ai = C.adj[i], di = ai.length;
      if (di === 0) { if ((i & 63) === 0) yield; continue; }
      let nt = 0;
      const stepI = di > cap ? Math.ceil(di / cap) : 1;
      for (let a = 0; a < di; a += stepI) {
        const u = ai[a], au = C.adj[u], du = au.length;
        const stepU = du > cap ? Math.ceil(du / cap) : 1;
        for (let b = 0; b < du; b += stepU) {
          const v = au[b];
          if (v === i) continue;
          if (counts[v] === 0) touched[nt++] = v;
          counts[v]++;
        }
      }
      candI.length = 0; candW.length = 0;
      for (let t = 0; t < nt; t++) {
        const v = touched[t], shared = counts[v];
        counts[v] = 0;
        const union = di + C.deg[v] - shared;
        const j = union > 0 ? shared / union : 0;
        if (j >= floor) { candI.push(v); candW.push(j); }
      }
      if (candI.length) {
        const ord = candI.map((_, k) => k).sort((x, y) => candW[y] - candW[x]);
        const lim = Math.min(K, ord.length);
        for (let k = 0; k < lim; k++) {
          const v = candI[ord[k]], w = candW[ord[k]];
          const lo = i < v ? i : v, hi = i < v ? v : i;
          const key = lo * n + hi;
          if (seen.has(key)) continue;
          seen.add(key);
          pairs.push(lo, hi, w);
        }
      }
      if ((i & 15) === 0) yield;
    }

    const m = pairs.length / 3;
    C.simA = new Int32Array(m);
    C.simB = new Int32Array(m);
    C.simW = new Float32Array(m);
    for (let k = 0; k < m; k++) { C.simA[k] = pairs[3 * k]; C.simB[k] = pairs[3 * k + 1]; C.simW[k] = pairs[3 * k + 2]; }
  }

  /************************************************************************
   * PHYSICS: SHARED TUNING
   ************************************************************************/
  // Sliders are stored 0-100 and normalised to 0-1 here. 0 switches a
  // component off entirely.
  function physStrength(key) {
    const v = Number(formattingSettings[key]);
    return Math.max(0, Math.min(1, (isFinite(v) ? v : 50) / 100));
  }

  function collisionPadding() {
    return 2 + 58 * physStrength('collisionStrength');
  }

  // The padding the slider asks for, reduced only as far as necessary for the
  // nodes to actually fit. A bounded layout has a fixed area to work with, and
  // padding that can't fit produces overlap rather than spacing, so solve for
  // the largest uniform padding whose discs still pack into the space:
  //   sum of pi*(r+p)^2 = usable area   ->   n*p^2 + 2*S1*p + (S2 - A) = 0
  function effectiveCollisionPadding() {
    const want = collisionPadding();
    if (want <= 0 || formattingSettings.boundMode !== 'inside' || !nodes.length) return want;
    const cw = canvas.width / devicePixelRatio, ch = canvas.height / devicePixelRatio;
    const A = Math.max(1, (cw - PADDING * 2) * (ch - PADDING * 2)) * 0.80 / Math.PI; // 0.80 = packing efficiency
    let S1 = 0, S2 = 0;
    for (let i = 0; i < nodes.length; i++) { const r = isFinite(nodes[i].r) ? nodes[i].r : 0; S1 += r; S2 += r * r; }
    if (!(S2 < A)) return 0;                     // no room for any padding at all
    const n = nodes.length;
    const fit = (-S1 + Math.sqrt(S1 * S1 + n * (A - S2))) / n;
    return isFinite(fit) ? Math.max(0, Math.min(want, fit)) : 0;
  }

  // Ideal spacing between adjacent nodes. Never smaller than the nodes
  // themselves need, or the edge and stress springs would pull big nodes
  // into each other faster than collision can push them apart. A bounded
  // layout otherwise fits the default zoom area, so spacing tightens as the
  // graph grows; an unbounded layout holds spacing constant and sprawls.
  function targetEdgeLength(count, avgR, pad) {
    const cw = canvas.width / devicePixelRatio, ch = canvas.height / devicePixelRatio;
    const n = Math.max(1, count);
    let area = Math.max(1, (cw - PADDING * 2) * (ch - PADDING * 2));
    if (formattingSettings.boundMode !== 'inside') area *= Math.max(1, n / 150);
    const byArea = CONFIG.force.spread * Math.sqrt(area / n);
    const bySize = 2.1 * (isFinite(avgR) ? avgR : 0) + (isFinite(pad) ? pad : 0);
    const L = Math.max(24, byArea, bySize);
    return isFinite(L) ? L : 24;
  }

  /************************************************************************
   * PHYSICS: STRESS / GLOBAL DISTANCE PRESERVATION
   * Nodes a few hops apart should sit closer than nodes many hops apart.
   * Cost per tick is (nodes handled) x (pivots), independent of graph size:
   * a rotating cursor walks the node list so every node is visited every
   * few ticks rather than all of them every tick.
   ************************************************************************/
  function forceStress(L) {
    let arr = [], cursor = 0;
    function force(alpha) {
      const C = GRAPH_CACHE;
      if (!C.ready) return;
      const s = physStrength('stressStrength');
      if (s <= 0) return;
      const P = C.pivots.length;
      if (!P) return;
      const N = arr.length;
      const budget = Math.min(N, Math.max(1, Math.floor(60000 / P)));
      const k = s * alpha * 0.8;
      for (let c = 0; c < budget; c++) {
        const node = arr[cursor];
        cursor = (cursor + 1) % N;
        if (!node || node.fx != null) continue;   // pinned nodes act as anchors only
        const i = C.index.get(node.id);
        if (i === undefined) continue;
        let dx = 0, dy = 0, wsum = 0;
        for (let p = 0; p < P; p++) {
          const pi = C.pivots[p];
          if (pi === i) continue;
          const h = C.dist[p][i];
          if (h < 0) continue;                    // other component: excluded
          const pn = C.ref[pi];
          if (!pn) continue;
          const ex = pn.x - node.x, ey = pn.y - node.y;
          const dist = Math.sqrt(ex * ex + ey * ey) || 0.01;
          const target = h * L;
          const w = 1 / (target * target);
          const ratio = (dist - target) / dist;   // >0 too far, <0 too close
          dx += w * ratio * ex;
          dy += w * ratio * ey;
          wsum += w;
        }
        if (wsum > 0) { node.vx += (dx / wsum) * k; node.vy += (dy / wsum) * k; }
      }
    }
    force.initialize = (n) => { arr = n; cursor = 0; };
    return force;
  }

  /************************************************************************
   * PHYSICS: NEIGHBOURHOOD SIMILARITY
   * Weighted springs over the cached top-K Jaccard pairs. Nodes that share
   * many neighbours want to be close even when no edge joins them; weakly
   * similar nodes want to be further apart. Pairs are processed in strides
   * so the per-tick cost stays flat.
   ************************************************************************/
  function forceSimilarity(L) {
    let cursor = 0;
    function force(alpha) {
      const C = GRAPH_CACHE;
      if (!C.ready || !C.simW) return;
      const s = physStrength('similarityStrength');
      if (s <= 0) return;
      const m = C.simW.length;
      if (!m) return;
      const budget = Math.min(m, 20000);
      for (let c = 0; c < budget; c++) {
        const p = cursor;
        cursor = (cursor + 1) % m;
        const a = C.ref[C.simA[p]], b = C.ref[C.simB[p]];
        if (!a || !b) continue;
        const w = C.simW[p];
        const target = L * (2 - 1.5 * w);         // similar -> close, weak -> far
        let ex = b.x - a.x, ey = b.y - a.y;
        let dist = Math.sqrt(ex * ex + ey * ey);
        if (dist < 0.01) { ex = (Math.random() - 0.5); ey = (Math.random() - 0.5); dist = 0.01; }
        const k = ((dist - target) / dist) * s * w * alpha * 0.5;
        const ax = ex * k, ay = ey * k;
        if (a.fx == null) { a.vx += ax; a.vy += ay; }
        if (b.fx == null) { b.vx -= ax; b.vy -= ay; }
      }
    }
    force.initialize = () => { cursor = 0; };
    return force;
  }

  /************************************************************************
   * PHYSICS SIMULATION
   ************************************************************************/
  function updatePhysics() {
    if (simulation) simulation.stop();
    if (physicsStopTimer) { clearTimeout(physicsStopTimer); physicsStopTimer = null; }
    if (!nodes.length) { simHot = false; render(); return; }

    // Structural data is cached against the connection set; this is a no-op
    // on a slider change and only rebuilds when connections actually differ.
    ensureGraphCache();

    const cw = canvas.width / devicePixelRatio;
    const ch = canvas.height / devicePixelRatio;
    const fS = physStrength('forceStrength');
    const cS = physStrength('collisionStrength');
    const stS = physStrength('stressStrength');
    const smS = physStrength('similarityStrength');

    let avgR = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      if (!isFinite(n.x) || !isFinite(n.y)) {
        n.x = cw / 2 + (Math.random() - 0.5) * 50;
        n.y = ch / 2 + (Math.random() - 0.5) * 50;
        n.vx = 0; n.vy = 0;
      }
      if (!isFinite(n.fx)) n.fx = null;
      if (!isFinite(n.fy)) n.fy = null;
      avgR += isFinite(n.r) ? n.r : 0;
    }
    avgR = nodes.length ? avgR / nodes.length : 0;
    const pad = effectiveCollisionPadding();
    const L = targetEdgeLength(nodes.length, avgR, pad);

    simHot = true;
    simulation = d3.forceSimulation(nodes)
      // Gentle centring, independent of the four component sliders.
      .force('x', d3.forceX(cw / 2).strength(0.03))
      .force('y', d3.forceY(ch / 2).strength(0.03))
      .velocityDecay(CONFIG.force.velocityDecay)
      .alphaDecay(physicsAlphaDecayFor(physicsDurationSec))
      .alphaMin(PHYSICS_ALPHA_MIN);

    // 1. Force-directed: attraction along real edges + Barnes-Hut repulsion.
    if (fS > 0) {
      simulation
        .force('link', d3.forceLink(links).id(d => d.id).distance(L).strength(0.9 * fS))
        .force('charge', d3.forceManyBody()
          .strength(-fS * (2.4 * L + 6 * avgR))
          // Barnes-Hut dominates the tick on big graphs, so approximate
          // harder and prune the far field once accuracy stops being free.
          .theta(nodes.length > 2000 ? 1.5 : 0.9)
          .distanceMin(1)
          .distanceMax(L * (nodes.length > 2000 ? 4 : 8)));
    }
    // 2. Stress: preserve graph-hop distances globally.
    if (stS > 0) simulation.force('stress', forceStress(L));
    // 3. Similarity: springs over cached Jaccard neighbourhood overlap.
    if (smS > 0) simulation.force('similarity', forceSimilarity(L));
    // 4. Collision: quadtree-backed, real radius plus configurable padding.
    if (cS > 0) {
      simulation.force('collide', d3.forceCollide()
        .radius(d => d.r + pad)
        .strength(0.5 + 0.5 * cS)
        .iterations(nodes.length > 2000 ? 1 : 3));
    }

    const bounded = formattingSettings.boundMode === 'inside';
    simulation
      .on('tick', () => {
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          // A node can only reach this state through bad arithmetic upstream;
          // drop it back on the canvas rather than let NaN spread through the
          // quadtrees and take the whole layout with it.
          if (!isFinite(n.x) || !isFinite(n.y)) {
            n.x = cw / 2 + (Math.random() - 0.5) * 50;
            n.y = ch / 2 + (Math.random() - 0.5) * 50;
            n.vx = 0; n.vy = 0;
          }
          if (bounded) {
            n.x = Math.max(n.r + PADDING, Math.min(cw - n.r - PADDING, n.x));
            n.y = Math.max(n.r + PADDING, Math.min(ch - n.r - PADDING, n.y));
          }
          if (!n.hasGridCoords) { n.physicsX = n.x; n.physicsY = n.y; }
        }
        scheduleSimRender();
      })
      .on('end', () => {
        simHot = false;
        if (physicsMode === 'freezeAfterInitial') freezeAllNodes();
        render();
      });

    simulation.alpha(1.0).restart();

    // Hard backstop: guarantee the simulation stops after the chosen
    // duration, regardless of frame rate.
    physicsStopTimer = setTimeout(() => {
      physicsStopTimer = null;
      if (simulation) {
        simulation.stop();
        simHot = false;
        if (physicsMode === 'freezeAfterInitial') freezeAllNodes();
        render();
      }
    }, physicsDurationSec * 1000);
  }

  // Cap repaints to the display refresh rate. When physics outruns paint the
  // extra ticks are dropped rather than queued. On large graphs a repaint
  // costs more than a physics tick, so paint every few ticks instead of every
  // one and let the layout converge faster in wall-clock time.
  function scheduleSimRender() {
    if (simRenderPending) return;
    const every = nodes.length > 4000 ? 3 : (nodes.length > 1500 ? 2 : 1);
    if (++simRenderTick % every) return;
    simRenderPending = true;
    requestAnimationFrame(() => { simRenderPending = false; render(); });
  }

  // Map a target run-time (seconds) to a d3 alphaDecay value. The simulation
  // runs until alpha < PHYSICS_ALPHA_MIN; at ~60 ticks/sec that takes about
  // `durationSec` seconds with this decay.
  function physicsAlphaDecayFor(durationSec) {
    const ticks = Math.max(1, durationSec * 60);
    return 1 - Math.pow(PHYSICS_ALPHA_MIN, 1 / ticks);
  }
  
  /************************************************************************
   * RENDERING HELPERS
   ************************************************************************/
  function clearCanvas() {
    const bgColor = formattingSettings.backgroundColor || '#FFFFFF';
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width/(devicePixelRatio), canvas.height/(devicePixelRatio));
    
    // Draw background image if enabled
    if (backgroundImageObj) {
      const cw = canvas.width / devicePixelRatio;
      const ch = canvas.height / devicePixelRatio;
      const img = backgroundImageObj;
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const scale = Math.max(cw / iw, ch / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = (cw - dw) / 2;
      const dy = (ch - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
    }
  }

  function applyTransform() {
    const centerX = (canvas.width/(devicePixelRatio)) / 2;
    const centerY = (canvas.height/(devicePixelRatio)) / 2;
    ctx.translate(centerX + panX, centerY + panY);
    ctx.scale(zoomLevel, zoomLevel);
    ctx.translate(-centerX, -centerY);
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
  }

  // (controlX, controlY) is the curve's control point, passed in from drawLink().
  function drawChevronLabel(x1, y1, x2, y2, controlX, controlY, text, lineColor) {
    if (!text || text.trim() === '') return;
    
    // Text measurements - calculate first to know chevron size
    ctx.save();
    const fontSize = (Number(formattingSettings.connectionLabelSize) || 12) / zoomLevel;
    ctx.font = `${fontSize}px Rubik, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const metrics = ctx.measureText(text);
    const textWidth = metrics.width;
    
    // Chevron dimensions
    const padding = 8 / zoomLevel;
    const chevronWidth = textWidth + padding * 2;
    const chevronHeight = fontSize + padding * 2;
    const chevronPointSize = chevronHeight * 0.4;
    
    // Helper function to get point on quadratic bezier curve
    function getPointOnCurve(t) {
      return {
        x: (1-t)*(1-t)*x1 + 2*(1-t)*t*controlX + t*t*x2,
        y: (1-t)*(1-t)*y1 + 2*(1-t)*t*controlY + t*t*y2
      };
    }
    
    // Helper function to get tangent on quadratic bezier curve
    function getTangentOnCurve(t) {
      const tx = 2*(1-t)*(controlX - x1) + 2*t*(x2 - controlX);
      const ty = 2*(1-t)*(controlY - y1) + 2*t*(y2 - controlY);
      const length = Math.sqrt(tx * tx + ty * ty);
      return { x: tx / length, y: ty / length, length };
    }
    
    // Approximate arc length using numerical integration
    function approximateArcLength(t1, t2, steps = 10) {
      let length = 0;
      for (let i = 0; i < steps; i++) {
        const t = t1 + (t2 - t1) * (i / steps);
        const tangent = getTangentOnCurve(t);
        length += tangent.length * (t2 - t1) / steps;
      }
      return length;
    }
    
    // Find approximate t values for the left and right edges of chevron
    // by calculating what portion of the curve the chevron should occupy
    const totalArcLength = approximateArcLength(0, 1);
    const halfChevronWidth = (chevronWidth + chevronPointSize) / 2;
    
    // Find t values that correspond to the desired arc-length positions
    let tLeft = 0.5, tRight = 0.5;
    
    // Use iterative approach to find t values at specific arc lengths
    if (totalArcLength > 0) {
      // For left edge: find t where arc length from 0 to t equals half curve - half chevron
      const targetLeftLength = totalArcLength / 2 - halfChevronWidth;
      if (targetLeftLength > 0) {
        for (let i = 0; i < 5; i++) { // 5 iterations for reasonable accuracy
          const currentLength = approximateArcLength(0, tLeft);
          const error = currentLength - targetLeftLength;
          if (Math.abs(error) < 1) break;
          tLeft -= error / totalArcLength * 0.5; // Adjust t
          tLeft = Math.max(0.1, Math.min(0.9, tLeft)); // Keep in bounds
        }
      }
      
      // For right edge: find t where arc length from 0 to t equals half curve + half chevron
      const targetRightLength = totalArcLength / 2 + halfChevronWidth;
      if (targetRightLength < totalArcLength) {
        for (let i = 0; i < 5; i++) {
          const currentLength = approximateArcLength(0, tRight);
          const error = currentLength - targetRightLength;
          if (Math.abs(error) < 1) break;
          tRight -= error / totalArcLength * 0.5;
          tRight = Math.max(0.1, Math.min(0.9, tRight));
        }
      }
    }
    
    // Get positions for left and right edges along the curve
    const leftPoint = getPointOnCurve(tLeft);
    const rightPoint = getPointOnCurve(tRight);
    
    // Calculate the geometric center of the chevron (midpoint between left and right)
    const curveX = (leftPoint.x + rightPoint.x) / 2;
    const curveY = (leftPoint.y + rightPoint.y) / 2;
    
    // Get tangent at the geometric center for text orientation
    const tCenter = (tLeft + tRight) / 2;
    const centerTangent = getTangentOnCurve(tCenter);
    const ux = centerTangent.x;
    const uy = centerTangent.y;
    
    // Get tangents at left and right for perpendicular offsets
    const leftTangent = getTangentOnCurve(tLeft);
    const rightTangent = getTangentOnCurve(tRight);
    
    // Perpendicular vectors
    const leftPx = -leftTangent.y;
    const leftPy = leftTangent.x;
    const rightPx = -rightTangent.y;
    const rightPy = rightTangent.x;
    
    const halfHeight = chevronHeight / 2;
    
    // Left side vertices using curve position
    const leftTopX = leftPoint.x + leftPx * halfHeight;
    const leftTopY = leftPoint.y + leftPy * halfHeight;
    const leftBottomX = leftPoint.x - leftPx * halfHeight;
    const leftBottomY = leftPoint.y - leftPy * halfHeight;
    
    // Right side vertices using curve position
    const rightTopX = rightPoint.x + rightPx * halfHeight;
    const rightTopY = rightPoint.y + rightPy * halfHeight;
    const rightBottomX = rightPoint.x - rightPx * halfHeight;
    const rightBottomY = rightPoint.y - rightPy * halfHeight;
    
    // Point extends from right edge
    const rightPointX = rightPoint.x + rightTangent.x * chevronPointSize;
    const rightPointY = rightPoint.y + rightTangent.y * chevronPointSize;
    
    // Draw chevron shape
    ctx.fillStyle = lineColor;
    ctx.beginPath();
    ctx.moveTo(leftTopX, leftTopY);
    ctx.lineTo(rightTopX, rightTopY);
    ctx.lineTo(rightPointX, rightPointY);
    ctx.lineTo(rightBottomX, rightBottomY);
    ctx.lineTo(leftBottomX, leftBottomY);
    ctx.closePath();
    ctx.fill();
    
    // Draw text with rotation
    ctx.save();
    // Calculate angle from tangent at center
    let angle = Math.atan2(uy, ux);
    
    // Keep text readable (flip if upside down)
    if (angle > Math.PI / 2 || angle < -Math.PI / 2) {
      angle += Math.PI;
    }
    
    // Translate to curve position, rotate, then draw text at origin
    ctx.translate(curveX, curveY);
    ctx.rotate(angle);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillText(text, 0, 0);
    ctx.restore();
    
    ctx.restore();
  }

  function drawLink(l, opacity) {
    ctx.save();
    ctx.globalAlpha = opacity;
    
    // Check if either end of the link is hovered
    const isHovered = (hoveredNode && (l.source === hoveredNode || l.target === hoveredNode)) ||
                      (hoveredConnection && 
                       ((l.source.id === hoveredConnection.source && l.target.id === hoveredConnection.target) ||
                        (l.source.id === hoveredConnection.target && l.target.id === hoveredConnection.source)));
    
    // Check if either end is selected OR both ends are connected to the selected node
    const isSelected = selectedNode && (
      l.source === selectedNode || 
      l.target === selectedNode ||
      (adjacency.get(selectedNode.id)?.has(l.source.id) && adjacency.get(selectedNode.id)?.has(l.target.id))
    );
    
    // Check if either end is highlighted in current view (Story Mode)
    let isHighlighted = false;
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const sourceHighlights = entityHighlightsMap.get(l.source.id);
      const targetHighlights = entityHighlightsMap.get(l.target.id);
      isHighlighted = (sourceHighlights && sourceHighlights.has(currentViewId)) || 
                      (targetHighlights && targetHighlights.has(currentViewId));
    }
    
    // Use default formatting (no conditional format)
    const lineColor = isHovered ? formattingSettings.lineHoverColor : formattingSettings.lineColor;
    
    // Determine base line thickness
    let baseLineThickness;
    if (formattingSettings.lineSizeMode === 'connectionValue' && l.connectionValue != null && !isNaN(l.connectionValue)) {
      baseLineThickness = getScaledLineThickness(l.connectionValue);
    } else {
      baseLineThickness = formattingSettings.lineThickness;
    }
    // Hover/selected lines are 1px thicker
    if (isHovered) baseLineThickness += 1;
    
    // Scale line thickness with the UI scale factor
    const lineThickness = baseLineThickness * uiScale;
    
    // Calculate curve control point for subtle curve
    const dx = l.target.x - l.source.x;
    const dy = l.target.y - l.source.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    // Perpendicular offset (15% of distance for subtle curve)
    const offset = dist * 0.15;
    const midX = (l.source.x + l.target.x) / 2;
    const midY = (l.source.y + l.target.y) / 2;
    
    // Control point perpendicular to line
    const controlX = midX - (dy / dist) * offset;
    const controlY = midY + (dx / dist) * offset;
    
    ctx.beginPath();
    // Draw tapered line: 1.5x width at source (A), 0.5x at target (B)
    const halfWidthSrc = (lineThickness / zoomLevel) * 0.75; // 1.5x / 2
    const halfWidthTgt = (lineThickness / zoomLevel) * 0.25; // 0.5x / 2
    
    // Perpendicular at source
    const t0 = { x: 2*(controlX - l.source.x), y: 2*(controlY - l.source.y) };
    const t0Len = Math.sqrt(t0.x*t0.x + t0.y*t0.y) || 1;
    const p0x = -t0.y / t0Len, p0y = t0.x / t0Len;
    
    // Perpendicular at target
    const t1 = { x: 2*(l.target.x - controlX), y: 2*(l.target.y - controlY) };
    const t1Len = Math.sqrt(t1.x*t1.x + t1.y*t1.y) || 1;
    const p1x = -t1.y / t1Len, p1y = t1.x / t1Len;
    
    // Perpendicular at control point (midpoint tangent)
    const tMid = { x: l.target.x - l.source.x, y: l.target.y - l.source.y };
    const tMidLen = Math.sqrt(tMid.x*tMid.x + tMid.y*tMid.y) || 1;
    const pMx = -tMid.y / tMidLen, pMy = tMid.x / tMidLen;
    const halfWidthMid = (halfWidthSrc + halfWidthTgt) / 2;
    
    // Draw filled shape: top edge (source→target), then bottom edge (target→source)
    ctx.moveTo(l.source.x + p0x * halfWidthSrc, l.source.y + p0y * halfWidthSrc);
    ctx.quadraticCurveTo(
      controlX + pMx * halfWidthMid, controlY + pMy * halfWidthMid,
      l.target.x + p1x * halfWidthTgt, l.target.y + p1y * halfWidthTgt
    );
    ctx.lineTo(l.target.x - p1x * halfWidthTgt, l.target.y - p1y * halfWidthTgt);
    ctx.quadraticCurveTo(
      controlX - pMx * halfWidthMid, controlY - pMy * halfWidthMid,
      l.source.x - p0x * halfWidthSrc, l.source.y - p0y * halfWidthSrc
    );
    ctx.closePath();
    ctx.fillStyle = lineColor;
    ctx.fill();
    
    // Draw chevron label based on showConnectionLabels setting
    const shouldShowLabel = formattingSettings.showConnectionLabels === 'always' 
      || (formattingSettings.showConnectionLabels === 'hover' && (isSelected || isHovered || isHighlighted));
    if (shouldShowLabel) {
      // Build chevron text: Note + formatted Value
      let chevronText = l.note || '';
      if (l.connectionValue != null && !isNaN(l.connectionValue)) {
        const fmtVal = formatValue(l.connectionValue, formattingSettings.connectionValuePrefix);
        if (chevronText) {
          chevronText += ' ' + fmtVal;
        } else {
          chevronText = fmtVal;
        }
      }
      if (chevronText) {
        ctx.globalAlpha = 1.0;
        drawChevronLabel(l.source.x, l.source.y, l.target.x, l.target.y, controlX, controlY, chevronText, lineColor);
      }
    }
    
    ctx.restore();
  }

  // Compute min/max connection values for line scaling (cached)
  let _lineSizeRange = null;
  function getLineSizeRange() {
    if (_lineSizeRange) return _lineSizeRange;
    const values = links.filter(l => l.connectionValue != null && !isNaN(l.connectionValue)).map(l => l.connectionValue);
    if (values.length === 0) return { min: 0, max: 1 };
    _lineSizeRange = { min: Math.min(...values), max: Math.max(...values) };
    return _lineSizeRange;
  }

  function getScaledLineThickness(value) {
    const range = getLineSizeRange();
    if (range.max === range.min) return 11; // midpoint
    const normalized = (value - range.min) / (range.max - range.min);
    return 2 + normalized * (20 - 2);
  }

  /************************************************************************
   * CUSTOM NODE COLOR + INNER NODE LABEL
   * Both come from optional Entities columns and only affect the rows that
   * have a value. Either one replaces the node's image. The fill is
   *   hover colour (while hovered) > Custom Node Color > default node colour,
   * and the outline is untouched. Inner label text is white, or black when
   * white would be hard to read on the node's own colour; it never changes
   * for the hover colour.
   ************************************************************************/
  const INNER_LABEL = {
    minPx: 10,          // real screen pixels
    maxPx: 18,
    stepPx: 0.5,
    maxLines: 3,
    lineHeight: 1.15,   // line spacing, as a multiple of font size
    weight: 500,
    family: 'Rubik, Arial, Helvetica, sans-serif'
  };
  // Canvas drawing units per real screen (CSS) pixel. The canvas is drawn at
  // 1.5x, so this is normally 1.5; render() keeps it current.
  let drawUnitsPerCssPx = 1.5;
  let innerFontEpoch = 0;
  let innerFontRequested = false;
  const INNER_MEASURE_PX = 100;
  const innerMeasureCtx = document.createElement('canvas').getContext('2d');
  const innerWidthCache = new Map();

  function nodeOverridesImage(n) { return !!(n && (n.customColor || n.innerLabel)); }

  // Re-measure once the label font has actually loaded (canvas text falls
  // back to Arial until then, which would give the wrong fit).
  function refreshInnerFont() {
    innerFontEpoch++;
    innerWidthCache.clear();
    render();
  }
  if (document.fonts && document.fonts.addEventListener) {
    document.fonts.addEventListener('loadingdone', refreshInnerFont);
  }
  function requestInnerFont() {
    if (innerFontRequested || !document.fonts || !document.fonts.load) return;
    innerFontRequested = true;
    document.fonts.load(INNER_LABEL.weight + ' 16px Rubik').then(refreshInnerFont, () => {});
  }

  // Text width at INNER_MEASURE_PX; widths scale linearly with font size.
  function innerTextW(str, px) {
    let w = innerWidthCache.get(str);
    if (w === undefined) {
      innerMeasureCtx.font = INNER_LABEL.weight + ' ' + INNER_MEASURE_PX + 'px ' + INNER_LABEL.family;
      w = innerMeasureCtx.measureText(str).width;
      if (innerWidthCache.size > 20000) innerWidthCache.clear();
      innerWidthCache.set(str, w);
    }
    return w * px / INNER_MEASURE_PX;
  }

  // Half the width of a node shape at height y below its centre, after
  // insetting every edge by p. Matches drawShapePath() exactly.
  function innerHalfWidth(shape, r, p, y) {
    let w;
    switch (shape) {
      case 'square':
        w = (Math.abs(y) <= r - p) ? r - p : 0;
        break;
      case 'diamond':
        // edges |x|/r + |y|/(1.15r) = 1; 1.3237 = perpendicular-inset factor
        w = r - 1.3237 * p - Math.abs(y) / 1.15;
        break;
      case 'triangle':
        // apex (0,-1.15r), base y = 0.75r, base half-width 1.05r
        if (y > 0.75 * r - p) return 0;
        w = (1.05 * (y + 1.15 * r) - 2.1708 * p) / 1.9;
        break;
      default: {
        const rr = r - p;
        w = (Math.abs(y) < rr) ? Math.sqrt(rr * rr - y * y) : 0;
      }
    }
    return Math.max(0, w);
  }

  // Available width for each line of an n-line block centred at offset c.
  // A line's glyph band must sit entirely inside the shape.
  function innerLineWidths(shape, r, p, n, px, c) {
    const lh = px * INNER_LABEL.lineHeight, half = px * 0.5;
    const out = [];
    for (let i = 0; i < n; i++) {
      const yc = c + (i - (n - 1) / 2) * lh;
      const w = 2 * Math.min(innerHalfWidth(shape, r, p, yc - half), innerHalfWidth(shape, r, p, yc + half));
      if (!(w > 0)) return null;
      out.push(w);
    }
    return out;
  }

  // Largest k such that str.slice(0,k) (+ suffix) fits maxW.
  function innerFitPrefix(str, px, maxW, suffix) {
    let lo = 0, hi = str.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      const t = suffix ? str.slice(0, mid).trimEnd() + suffix : str.slice(0, mid);
      if (innerTextW(t, px) <= maxW) lo = mid; else hi = mid - 1;
    }
    return lo;
  }

  function innerTokens(text) {
    const toks = [];
    text.split('\n').forEach((para, i) => {
      if (i > 0) toks.push('\n');
      para.split(' ').forEach(w => { if (w) toks.push(w); });
    });
    return toks;
  }

  // Greedy wrap at spaces. With allowBreak, a word that can't fit on a line
  // by itself may be split once, into two pieces of 3+ characters each;
  // anything worse fails the wrap so the "..." truncation takes over.
  function innerWrap(tokens, widths, px, allowBreak) {
    const toks = tokens.slice();
    const lines = [];
    let li = 0, cur = '', ti = 0, splitAt = -1;
    while (ti < toks.length && li < widths.length) {
      const tok = toks[ti];
      if (tok === '\n') {
        if (cur) { lines.push(cur); cur = ''; li++; }
        ti++; continue;
      }
      const cand = cur ? cur + ' ' + tok : tok;
      if (innerTextW(cand, px) <= widths[li]) { cur = cand; ti++; continue; }
      if (cur) { lines.push(cur); cur = ''; li++; continue; }
      if (!allowBreak || splitAt === ti) return { ok: false };
      const k = innerFitPrefix(tok, px, widths[li], '');
      if (k < 3 || tok.length - k < 3) return { ok: false };
      lines.push(tok.slice(0, k)); li++;
      toks[ti] = tok.slice(k); splitAt = ti;
    }
    if (cur) lines.push(cur);
    const rest = toks.slice(ti);
    return { ok: true, lines, rest, complete: rest.every(t => t === '\n') };
  }

  // Vertical offsets to try for an n-line block. Triangles are widest near
  // the base, so their text is tried around the incircle centre (0.13r below
  // the node centre) and then progressively further away.
  function innerOffsets(shape, r) {
    if (shape !== 'triangle') return [0];
    const out = [];
    for (let i = -8; i <= 8; i++) out.push(i * 0.08 * r);
    return out.sort((a, b) => Math.abs(a - 0.13 * r) - Math.abs(b - 0.13 * r));
  }

  function innerPlace(lines, px, c) {
    const lh = px * INNER_LABEL.lineHeight;
    return { px, lines: lines.map((t, i) => ({ t, dy: c + (i - (lines.length - 1) / 2) * lh })) };
  }

  // Lay a label out in screen pixels for a node of screen radius r.
  // Returns { px, lines:[{t,dy}] } or null for "no label".
  function computeInnerLayout(text, shape, r, p) {
    const toks = innerTokens(text);
    if (!toks.length) return null;
    const offsets = innerOffsets(shape, r);
    const maxN = INNER_LABEL.maxLines;

    // A complete fit, re-centred on the number of lines it actually used.
    const accept = (lines, px, c) => {
      const ws = innerLineWidths(shape, r, p, lines.length, px, c);
      if (ws && lines.every((t, i) => innerTextW(t, px) <= ws[i])) return innerPlace(lines, px, c);
      return null;
    };
    const tryFull = (px, allowBreak) => {
      for (let n = 1; n <= maxN; n++) {
        for (const c of offsets) {
          const ws = innerLineWidths(shape, r, p, n, px, c);
          if (!ws) continue;
          const res = innerWrap(toks, ws, px, allowBreak);
          if (!res.ok || !res.complete || !res.lines.length) continue;
          return accept(res.lines, px, c) || innerPlace(res.lines.concat(), px, c - ((n - res.lines.length) / 2) * px * INNER_LABEL.lineHeight);
        }
      }
      return null;
    };

    // 1. Largest font size at which the whole label fits without splitting a word.
    for (let px = INNER_LABEL.maxPx; px >= INNER_LABEL.minPx - 1e-9; px -= INNER_LABEL.stepPx) {
      const L = tryFull(px, false);
      if (L) return L;
    }
    const px = INNER_LABEL.minPx;
    // 2. At the minimum size, split a word that can't fit a line by itself.
    const L2 = tryFull(px, true);
    if (L2) return L2;

    // 3. Show what fits, ending in "...". Earlier lines wrap at spaces; the
    //    last line is cut wherever the "..." fits and must keep at least 3
    //    characters in front of it, otherwise there is no label at all.
    {
      let best = null, bestScore = 0;
      for (let n = 1; n <= maxN; n++) {
        for (const c of offsets) {
          const ws = innerLineWidths(shape, r, p, n, px, c);
          if (!ws) continue;
          let lines = [], rest = toks;
          if (n > 1) {
            const res = innerWrap(toks, ws.slice(0, n - 1), px, false);
            if (!res.ok || res.lines.length < n - 1) continue;
            lines = res.lines; rest = res.rest;
          }
          const restStr = rest.filter(t => t !== '\n').join(' ');
          if (!restStr) continue;
          const k = innerFitPrefix(restStr, px, ws[n - 1], '...');
          const head = restStr.slice(0, k).trimEnd().replace(/[\s.,;:\-\u2013\u2014]+$/, '');
          if (head.replace(/\s/g, '').length < 3) continue;
          const score = lines.join('').replace(/\s/g, '').length + head.replace(/\s/g, '').length;
          if (score > bestScore) { bestScore = score; best = innerPlace(lines.concat([head + '...']), px, c); }
          break;   // first workable offset is the best placed one for this n
        }
      }
      return best;
    }
  }

  // WCAG relative luminance of a hex colour (#RGB, #RRGGBB or #RRGGBBAA).
  // Anything unreadable counts as black (0). Shared with the table core.
  function relLuminance(hex) {
    let h = String(hex || '').replace('#', '');
    if (/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c => c + c).join('');
    if (!/^[0-9a-fA-F]{6}([0-9a-fA-F]{2})?$/.test(h)) return 0;
    const ch = [0, 2, 4].map(i => {
      const c = parseInt(h.substr(i, 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
  }
  // White by default; black only when white is hard to read on this colour
  // (contrast under 3:1) and black reads better.
  function innerTextColor(fillHex) {
    const L = relLuminance(parseHexColor(fillHex) || '#000000');
    const onWhite = 1.05 / (L + 0.05), onBlack = (L + 0.05) / 0.05;
    return (onWhite >= 3 || onWhite >= onBlack) ? '#FFFFFF' : '#000000';
  }

  function drawInnerLabel(n, shape, opacity, baseFill) {
    const k = drawUnitsPerCssPx || 1.5;
    const rScreen = Math.round((n.r * zoomLevel / k) * 2) / 2;   // half-pixel steps
    if (rScreen < 5) return;
    requestInnerFont();
    // Padding: half the (hovered) outline that sits inside the edge, plus a
    // little breathing room that grows with the node.
    const outlineIn = ((formattingSettings.outlineThickness || 0) + 1) * uiScale / k / 2;
    const pad = Math.round((outlineIn + Math.max(2, rScreen * 0.1)) * 4) / 4;
    const key = n.innerLabel + '|' + shape + '|' + rScreen + '|' + pad + '|' + innerFontEpoch;
    if (!n._inner || n._inner.key !== key) {
      n._inner = { key, layout: computeInnerLayout(n.innerLabel, shape, rScreen, pad) };
    }
    const L = n._inner.layout;
    if (!L) return;
    const s = k / zoomLevel;          // screen px -> drawing units
    ctx.save();
    ctx.globalAlpha = opacity;
    ctx.font = INNER_LABEL.weight + ' ' + (L.px * s) + 'px ' + INNER_LABEL.family;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = innerTextColor(baseFill);
    L.lines.forEach(line => ctx.fillText(line.t, n.x, n.y + line.dy * s));
    ctx.restore();
  }

  function drawNode(n, opacity, showImage=true, showInner=true) {
    ctx.save();
    const x = n.x, y = n.y;
    
    // No conditional formatting — use defaults only
    const isHovered = (hoveredNode && n === hoveredNode) ||
                      (hoveredConnection && (n.id === hoveredConnection.source || n.id === hoveredConnection.target));
    const isSelected = selectedNode && n === selectedNode;
    
    // Check if this node is connected to the hovered node
    const isConnectedToHovered = hoveredNode && hoveredNode !== n && 
                                  adjacency.get(hoveredNode.id)?.has(n.id);
    
    // Check if this node should be highlighted in the current view (Story Mode)
    let isHighlightedInView = false;
    if (isStoryMode && sortedViewIds.length > 0) {
      const currentViewId = sortedViewIds[currentViewIndex];
      const highlightViews = entityHighlightsMap.get(n.id);
      isHighlightedInView = highlightViews && highlightViews.has(currentViewId);
    }
    
    // Get node shape from Shape Legend Category
    const shape = getNodeShape(n);
    
    // Use default formatting colors, with Color Legend Category on OUTLINE
    const nodeCats = getNodeCategories(n);
    const catColor = nodeCats.length > 0 ? categoryColorMap.get(nodeCats[0]) : null;
    // Custom Node Color (Entities sheet) replaces the default node colour;
    // the hover colour still takes over while the node is hovered.
    const baseNodeColor = n.customColor || formattingSettings.nodeColor;
    const nodeColor = isHovered ? formattingSettings.nodeHoverColor : baseNodeColor;
    const baseOutlineColor = catColor || formattingSettings.outlineColor;
    const outlineColor = (isHovered || isSelected || isConnectedToHovered || isHighlightedInView) ? formattingSettings.outlineHoverColor : baseOutlineColor;
    const baseOutlineThickness = (isHovered || isSelected || isConnectedToHovered || isHighlightedInView) ? (formattingSettings.outlineThickness + 1) : formattingSettings.outlineThickness;
    
    // Scale outline thickness with the UI scale factor
    const outlineThickness = baseOutlineThickness * uiScale;
    
    // Node radius already includes scale factor from computeGridLayout
    const r = n.r;

    if (showImage && n.imageBitmap && !nodeOverridesImage(n)) {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      // Clip to shape
      drawShapePath(ctx, shape, x, y, r);
      ctx.clip();
      const img = n.imageBitmap;
      const iw = img.width || img.naturalWidth || 1;
      const ih = img.height || img.naturalHeight || 1;
      const target = r * 2;
      const scale = Math.max(target / iw, target / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = x - dw / 2;
      const dy = y - dh / 2;
      try {
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, dx, dy, dw, dh);
      } catch (e) {
        drawShapePath(ctx, shape, x, y, r);
        ctx.fillStyle = nodeColor;
        ctx.fill();
      }
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = opacity;
      drawShapePath(ctx, shape, x, y, r);
      ctx.fillStyle = nodeColor;
      ctx.fill();
      ctx.restore();
    }

    // Draw outline with glow if this is the selected node
    ctx.save();
    ctx.globalAlpha = opacity;
    
    // Add pulsing glow for selected node
    if (selectedNode && n === selectedNode) {
      const pulsePhase = Math.sin(animationTime * 0.002) * 0.5 + 0.5; // Oscillates between 0 and 1
      const glowSize = (5 + pulsePhase * 10) * uiScale; // Scale glow with UI
      const glowAlpha = 0.5 + pulsePhase * 0.5; // Varies between 0.5 and 1
      
      // Convert hover outline color to rgba for glow effect
      const hoverColor = formattingSettings.outlineHoverColor;
      const rr = parseInt(hoverColor.slice(1, 3), 16);
      const gg = parseInt(hoverColor.slice(3, 5), 16);
      const bb = parseInt(hoverColor.slice(5, 7), 16);
      
      ctx.shadowColor = `rgba(${rr}, ${gg}, ${bb}, ${glowAlpha})`;
      ctx.shadowBlur = glowSize;
    }
    
    drawShapePath(ctx, shape, x, y, r);
    ctx.lineWidth = outlineThickness / zoomLevel;
    ctx.strokeStyle = outlineColor;
    ctx.stroke();
    ctx.restore();

    // Inner Node Label sits on top of the fill (including the hover colour).
    // Its text colour is chosen against the node's own colour, not the hover.
    if (showInner && n.innerLabel) drawInnerLabel(n, shape, opacity, baseNodeColor);

    ctx.restore();
  }

  function drawLabel(n) {
    const text = n.name || '';
    if (!text) return;
    const labelFontSize = Number(formattingSettings.nodeLabelSize) || CONFIG.labelFontSize;
    ctx.save();
    ctx.font = `${labelFontSize / zoomLevel}px Rubik, Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const metrics = ctx.measureText(text);
    const textW = metrics.width;
    const pad = CONFIG.labelBoxPadding / zoomLevel;
    const boxW = textW + pad * 2;
    const boxH = (labelFontSize + 6) / zoomLevel;
    const x = n.x - boxW / 2;
    const y = n.y + n.r + CONFIG.labelOffsetY / zoomLevel;

    ctx.save();
    ctx.globalAlpha = CONFIG.labelBoxOpacity;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    roundRectPath(x, y, boxW, boxH, 6 / zoomLevel);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#111827';
    ctx.fillText(text, n.x, y + boxH / 2);
    ctx.restore();
  }



  /************************************************************************
   * LEGEND FUNCTIONS
   ************************************************************************/
  // Function to extract unique categories and assign colors
  // Helper: get color legend category for a node (single value, not comma-separated)
  function getNodeCategories(node) {
    if (!node.raw || !node.raw['Color Legend Category']) return [];
    const cat = node.raw['Color Legend Category'].trim();
    return cat ? [cat] : [];
  }

  // Helper: get shape legend category for a node
  function getNodeShapeCategory(node) {
    if (!node.raw || !node.raw['Shape Legend Category']) return '';
    return node.raw['Shape Legend Category'].trim();
  }

  function updateCategoryColors() {
    // Build color map from colorLegendEntries (from Options CSV)
    categoryColorMap.clear();
    const enabledEntries = colorLegendEntries.filter(e => e.enabled && e.label && e.color);
    enabledEntries.forEach(e => {
      categoryColorMap.set(e.label, e.color);
    });
    
    // Collect unique categories from nodes, maintaining CSV legend order
    const categories = new Set();
    nodes.forEach(node => {
      getNodeCategories(node).forEach(cat => categories.add(cat));
    });
    
    // Order categories according to colorLegendEntries order
    const legendLabelOrder = colorLegendEntries.filter(e => e.enabled && e.label).map(e => e.label);
    uniqueCategories = [];
    legendLabelOrder.forEach(label => {
      if (categories.has(label)) uniqueCategories.push(label);
    });
    // Append any categories not in the legend entries at the end
    categories.forEach(cat => {
      if (!uniqueCategories.includes(cat)) uniqueCategories.push(cat);
    });
    
    // Only keep categories that have a color mapping in the legend
    // (nodes without a matching category get default color)

    // Selection bookkeeping. With no filter running, every category counts as
    // active. With one running, keep the user's picks and only drop the ones
    // that no longer exist — re-adding every category here (as this used to
    // do) silently emptied the filter while leaving it switched on, so nodes
    // with no category stayed dimmed with no way to bring them back.
    const currentCategories = new Set(uniqueCategories);
    if (colorFilterActive) {
      Array.from(activeCategories).forEach(cat => {
        if (!currentCategories.has(cat)) activeCategories.delete(cat);
      });
      if (activeCategories.size === 0) resetColorFilter();
    } else {
      resetColorFilter();
    }
    
    // Build shape categories
    const shapeCats = new Set();
    nodes.forEach(node => {
      const sc = getNodeShapeCategory(node);
      if (sc) shapeCats.add(sc);
    });
    uniqueShapeCategories = Array.from(shapeCats);
    // Maintain order from shapeLegendEntries
    const shapeLabelOrder = shapeLegendEntries.filter(e => e.enabled && e.label).map(e => e.label);
    uniqueShapeCategories.sort((a, b) => {
      const ia = shapeLabelOrder.indexOf(a);
      const ib = shapeLabelOrder.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });
    const currentShapeCats = new Set(uniqueShapeCategories);
    if (shapeFilterActive) {
      Array.from(activeShapeCategories).forEach(cat => {
        if (!currentShapeCats.has(cat)) activeShapeCategories.delete(cat);
      });
      if (activeShapeCategories.size === 0) resetShapeFilter();
    } else {
      resetShapeFilter();
    }
  }

  // Legend click behaviour, shared by the colour and shape legends.
  //
  // A click toggles that category. With multi-select on, the selection builds
  // up so several categories can be lit at once; with it off, each click
  // isolates one. Either way, selecting nothing — or selecting every category
  // the legend shows — means no filter at all, so everything comes back,
  // including nodes whose category has no legend entry.

  // The categories the colour legend actually renders (a node category with
  // no enabled, coloured legend entry never appears, so it can never be
  // clicked and must not be counted when deciding whether all are selected).
  function visibleColorCategories() {
    return uniqueCategories.filter(cat => categoryColorMap.has(cat));
  }
  // The labels the shape legend actually renders.
  function visibleShapeLabels() {
    return shapeLegendEntries.filter(e => e.enabled && e.label && e.label.trim()).map(e => e.label);
  }

  function resetColorFilter() {
    activeCategories.clear();
    uniqueCategories.forEach(cat => activeCategories.add(cat));
    colorFilterActive = false;
  }

  function resetShapeFilter() {
    activeShapeCategories.clear();
    uniqueShapeCategories.forEach(cat => activeShapeCategories.add(cat));
    shapeFilterActive = false;
  }

  function toggleColorLegendCategory(category) {
    const multi = formattingSettings.legendMultiSelect !== false;
    if (multi && colorFilterActive) {
      if (activeCategories.has(category)) activeCategories.delete(category);
      else activeCategories.add(category);
    } else if (colorFilterActive && activeCategories.size === 1 && activeCategories.has(category)) {
      activeCategories.clear();          // clicking the only lit category clears it
    } else {
      activeCategories.clear();
      activeCategories.add(category);
      colorFilterActive = true;
    }
    const shown = visibleColorCategories();
    const allPicked = shown.length > 1 && shown.every(cat => activeCategories.has(cat));
    if (activeCategories.size === 0 || allPicked) resetColorFilter();
  }

  function toggleShapeLegendCategory(label) {
    const multi = formattingSettings.legendMultiSelect !== false;
    if (multi && shapeFilterActive) {
      if (activeShapeCategories.has(label)) activeShapeCategories.delete(label);
      else activeShapeCategories.add(label);
    } else if (shapeFilterActive && activeShapeCategories.size === 1 && activeShapeCategories.has(label)) {
      activeShapeCategories.clear();
    } else {
      activeShapeCategories.clear();
      activeShapeCategories.add(label);
      shapeFilterActive = true;
    }
    const shown = visibleShapeLabels();
    const allPicked = shown.length > 1 && shown.every(l => activeShapeCategories.has(l));
    if (activeShapeCategories.size === 0 || allPicked) resetShapeFilter();
  }

  // Function to update legend display
  function updateLegend() {
    if (!legendContainer) return;
    
    // Only show legend if there are enabled color legend entries with matching categories
    const legendCategories = visibleColorCategories();
    
    if (legendCategories.length === 0) {
      legendContainer.style.display = 'none';
      return;
    }
    
    legendContainer.style.display = 'flex';
    legendContainer.innerHTML = '';
    
    legendCategories.forEach(category => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      if (colorFilterActive && !activeCategories.has(category)) {
        item.classList.add('inactive');
      }
      
      const colorBox = document.createElement('div');
      colorBox.className = 'legend-color-box';
      colorBox.style.backgroundColor = categoryColorMap.get(category);
      
      const label = document.createElement('span');
      label.textContent = category;
      
      item.appendChild(colorBox);
      item.appendChild(label);
      
      item.addEventListener('click', () => {
        toggleColorLegendCategory(category);
        updateLegend();
        render();
      });
      
      legendContainer.appendChild(item);
    });
  }

  /************************************************************************
   * SHAPE DRAWING HELPERS
   ************************************************************************/
  function drawShapePath(ctx, shape, x, y, r) {
    switch (shape) {
      case 'square':
        ctx.beginPath();
        ctx.rect(x - r, y - r, r * 2, r * 2);
        break;
      case 'triangle':
        ctx.beginPath();
        ctx.moveTo(x, y - r * 1.15);
        ctx.lineTo(x + r * 1.05, y + r * 0.75);
        ctx.lineTo(x - r * 1.05, y + r * 0.75);
        ctx.closePath();
        break;
      case 'diamond':
        ctx.beginPath();
        ctx.moveTo(x, y - r * 1.15);
        ctx.lineTo(x + r * 1.0, y);
        ctx.lineTo(x, y + r * 1.15);
        ctx.lineTo(x - r * 1.0, y);
        ctx.closePath();
        break;
      case 'circle':
      default:
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        break;
    }
  }

  function getNodeShape(node) {
    // Check Shape Legend Category
    const shapeCat = getNodeShapeCategory(node);
    if (shapeCat && shapeCategoryMap.has(shapeCat)) {
      return shapeCategoryMap.get(shapeCat);
    }
    return formattingSettings.nodeShape || 'circle';
  }

  /************************************************************************
   * SHAPE LEGEND
   ************************************************************************/
  const SHAPE_ICONS = { circle: '〇', square: '▢', triangle: '△', diamond: '◇' };

  function updateShapeLegend() {
    if (!shapeLegendContainer) return;

    const activeItems = shapeLegendEntries.filter(e => e.enabled && e.label.trim());
    if (activeItems.length === 0) {
      shapeLegendContainer.style.display = 'none';
      return;
    }

    shapeLegendContainer.style.display = 'flex';
    shapeLegendContainer.innerHTML = '';

    activeItems.forEach(entry => {
      const item = document.createElement('div');
      item.className = 'shape-legend-item';
      item.style.cursor = 'pointer';
      item.style.transition = 'opacity 0.15s';
      
      // Dim if this shape category is filtered out
      if (shapeFilterActive && !activeShapeCategories.has(entry.label)) {
        item.style.opacity = '0.4';
      }

      const icon = document.createElement('span');
      icon.className = 'shape-legend-icon';
      icon.textContent = SHAPE_ICONS[entry.shape] || '〇';

      const label = document.createElement('span');
      label.textContent = entry.label;

      item.appendChild(icon);
      item.appendChild(label);
      
      item.addEventListener('click', () => {
        toggleShapeLegendCategory(entry.label);
        updateShapeLegend();
        render();
      });
      
      shapeLegendContainer.appendChild(item);
    });
  }

  /************************************************************************
   * RENDER
   ************************************************************************/
  function drawGridOverlay() {
    const half = CONFIG.gridUnits / 2; // 30
    ctx.save();
    ctx.lineWidth = 1 / zoomLevel;
    for (let i = -half; i <= half; i++) {
      const isAxis = (i === 0);
      const isMajor = (i % 5 === 0);
      ctx.strokeStyle = isAxis ? 'rgba(0,0,0,0.32)'
        : isMajor ? 'rgba(0,0,0,0.16)'
        : 'rgba(0,0,0,0.06)';
      // vertical line at grid-x = i
      const v1 = gridToPixel(i, -half), v2 = gridToPixel(i, half);
      ctx.beginPath(); ctx.moveTo(v1.x, v1.y); ctx.lineTo(v2.x, v2.y); ctx.stroke();
      // horizontal line at grid-y = i
      const h1 = gridToPixel(-half, i), h2 = gridToPixel(half, i);
      ctx.beginPath(); ctx.moveTo(h1.x, h1.y); ctx.lineTo(h2.x, h2.y); ctx.stroke();
    }
    ctx.restore();
  }

  function render() {
    animationTime = Date.now();
    // Real screen pixels <-> canvas drawing units, for inner node labels.
    const cssW = canvas.clientWidth;
    if (cssW > 0) drawUnitsPerCssPx = (canvas.width / devicePixelRatio) / cssW;
    clearCanvas();
    if (!nodes || nodes.length === 0) return;

    ctx.save();
    applyTransform();

    // Cell boundaries sit behind everything else (titles are drawn last)
    drawCells();

    // Snap-grid overlay (only while dragging a node in the tool)
    if (showGridOverlay) drawGridOverlay();

    // Large graphs drop labels and images while the simulation is running.
    const simLite = simHot && nodes.length > 400;
    // Who is lit this frame: nodes in the current story view (story mode),
    // the selection and its neighbours (when something is selected), and the
    // categories left on by the colour / shape legend filters.
    const storyViewSet = (isStoryMode && sortedViewIds.length > 0)
      ? new Set(viewEntitiesCache.get(sortedViewIds[currentViewIndex]) || [])
      : null;
    const selectionSet = selectedNode
      ? new Set([selectedNode.id, ...(adjacency.get(selectedNode.id) || [])])
      : null;
    const isNodeCategoryActive = (node) => {
      if (colorFilterActive) {
        const nodeCats = getNodeCategories(node);
        if (nodeCats.length === 0 || !nodeCats.some(c => activeCategories.has(c))) return false;
      }
      if (shapeFilterActive) {
        const sc = getNodeShapeCategory(node);
        if (!sc || !activeShapeCategories.has(sc)) return false;
      }
      return true;
    };

    const highlightedNodes = [];
    const unhighlightedNodes = [];
    nodes.forEach(node => {
      const lit = (!storyViewSet || storyViewSet.has(node.id))
        && (!selectionSet || selectionSet.has(node.id))
        && isNodeCategoryActive(node);
      (lit ? highlightedNodes : unhighlightedNodes).push(node);
    });

    // Draw unhighlighted nodes first (dimmed)
    unhighlightedNodes.forEach(n => drawNode(n, CONFIG.unconnectedOpacity, CONFIG.showImages && !simLite, !simLite));

    const highlightedSet = new Set(highlightedNodes.map(n => n.id));

    // In story mode, only show links where BOTH nodes are in the current view
    const visibleLinks = storyViewSet
      ? links.filter(l => storyViewSet.has(l.source.id) && storyViewSet.has(l.target.id))
      : links;

    // Draw links - ONLY draw links between highlighted nodes when there's a selection
    // Sort links by priority: selected & hovered > selected & not hovered > unselected & hovered > unselected & not hovered
    const sortedLinks = visibleLinks.slice().sort((a, b) => {
      const aIsSelected = selectedNode && (a.source === selectedNode || a.target === selectedNode);
