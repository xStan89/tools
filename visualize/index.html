<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Data Visualizer</title>
  <link rel="icon" type="image/png" href="favicon-desmog.png">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap');
    
    /* ── Style guide, LIGHT theme ─────────────────────────────────────────
       Calm, flat UI: no gradients, glows or shadows; yellow is an accent only,
       never a background behind body text. Rubik 400/500/600. */
    :root {
      color-scheme: light;
      --bg: #FBFAF7;            /* page background, warm off-white */
      --surface: #FFFFFF;       /* cards */
      --surface-hover: #FFF8E1; /* card hover */
      --line: #E6E4DE;          /* 1px borders, dividers */
      --text: #020202;          /* primary text */
      --muted: #6B6A66;         /* secondary text */
      --yellow: #FFD241;        /* primary accent */
      --accent: #DEB555;        /* hover border */
      --accent-text: #8A6D1F;   /* small meta text and focus ring */
      --badge-bg: #FFEDB4;
      --badge-text: #020202;

      /* Tool-specific (not in the guide) */
      --error: #dc2626;               /* load / search error messages */
      --scrim: rgba(2, 2, 2, 0.35);   /* behind modal windows */
      --font-family: 'Rubik', Arial, Helvetica, sans-serif;

      --chart-bg: #FFFFFF;            /* chart background: set from Options → Background color */
    }

    /* Rubik is loaded at 400/500/600 only, so "bold" means 600 */
    b, strong { font-weight: 600; }

    /* Focus ring (style guide): 2px accent-text outline, 2px offset */
    :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
    
    html,body {
      width:100%;
      height: 100vh;
      margin:0;
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text);
    }
    html, body {overscroll-behavior: none;}

    #wrap { display:flex; width:100%; height:100%; overflow:hidden; }

    /* GRAPH AREA */
    /* min-width/height 0: let the area shrink below the canvas's current pixel
       size, so the ResizeObserver sees every real size change */
    #graph-area { position:relative; flex:1; min-width:0; min-height:0; background:var(--chart-bg); }
    canvas { width:100%; height:100%; display:block; background:var(--chart-bg); }

    /* LOGO */
    #logo {
      position: absolute;
      bottom: 6px;
      right: 22px;
      z-index: 10;
      opacity: 1;
      pointer-events: none;
    }
    
    #logo img {
      height: 55px;
      width: auto;
    }

    /* Legend styles */
    #legend-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96%;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      z-index: 102;
      transition: opacity 0.15s;
    }

    #legend-container.collapsed {
      max-height: 0;
      padding: 0 12px;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 3px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      line-height: 1.2;
      color: var(--text);
    }

    .legend-item:hover {
      background: var(--surface-hover);
    }

    .legend-item.inactive {
      opacity: 0.4;
    }

    .legend-color-box {
      width: 8px;
      height: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      flex-shrink: 0;
    }

    /* Shape Legend Container */
    #shape-legend-container {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 96%;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      z-index: 100;
    }

    .shape-legend-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      user-select: none;
      line-height: 1.2;
    }

    .shape-legend-icon {
      font-size: 18px;
      flex-shrink: 0;
      line-height: 1;
    }

    #legend-toggle {
      display: none;
      position: absolute;
      justify-content: center;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--line);
      top: 12px;
      right: 12px;
      height: 20px;
      width: 20px;
      background: var(--surface);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      z-index: 101;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
      color: var(--text);
      line-height: 28px;
    }

    #legend-toggle:hover {
      background-color: var(--surface-hover);
      border-color: var(--accent);
    }

    #legend-toggle-icon {
      display: flex;
      transform: rotate(90deg);
    }

    /* Mobile view adjustments */
    @media (max-width: 768px) {
      #legend-toggle {
        display: block;
      }
      
      #legend-container {
        left: auto;
        right: 10px;
        transform: none;
        padding-top: 10px;
        justify-content: flex-start;
      }
      
      #legend-container.collapsed {
        padding-top: 0;
      }
    }

    /* TOP CONTROLS - ZOOM */
    #top-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    #zoom-controls {
      display: flex;
      gap: 8px;
    }
    
    .zoom-btn {
      height: 28px;
      width: 28px;
      border-radius: 999px;
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family);
      border: 1px solid var(--line);
      transition: background 0.15s, border-color 0.15s;
    }
    
    .zoom-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    #share-btn {
      font-size: 12px;
    }

    #chart-title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: -0.3px;
    }

    #chart-subtitle {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      pointer-events: none;
      white-space: nowrap;
    }

    /* INFO PANEL (RIGHT) */
    #info-panel {
      display: none;
      width: clamp(220px, 28vw, 420px);
      min-width: 200px;
      max-width: 420px;
      height: 100vh;
      background: var(--chart-bg);
      color: var(--text);
      padding: clamp(8px, 1.2vw, 16px) clamp(10px, 1.5vw, 20px) clamp(8px, 1.2vw, 16px) clamp(8px, 1vw, 12px);
      box-sizing: border-box;
      flex-direction: column;
      border-left: 1px solid var(--line);
      font-size: clamp(12px, 1.1vw, 15px);
      overflow: hidden;
      position: relative;
    }
    
    #controls { 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      flex-shrink: 0; 
      margin-bottom: 8px;
    }
    #search-box { display: flex; width: 100%; gap: 6px; flex-wrap: wrap; }
    #search-input {
      flex: 1;
      min-width: 0;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      transition: border-color 0.15s;
    }
    #search-btn {
      height: 29px;
      padding: 1px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      flex-shrink: 0;
      font-size: 18px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    #clear-btn {
      height: 29px;
      padding: 6px 6px;
      border-radius: 4px;
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      flex-shrink: 0;
      white-space: nowrap;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    
    #search-btn:hover, #clear-btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }
    
    /* Hide search buttons in story mode */
    .story-mode-hide {
      display: none !important;
    }

    #suggestions {
      background: var(--surface);
      border: 1px solid var(--line);
      max-height: 160px;
      overflow: auto;
      display: none;
      padding: 6px;
      border-radius: 10px;
    }
    .suggestion {
      padding: 6px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }
    .suggestion:hover {
      background: var(--surface-hover);
    }

    #node-info { 
      margin-top: 0px; 
      margin-bottom: 6px; 
      padding-left: 6px; 
      padding-right: 6px; 
      background: var(--chart-bg); 
      border-radius: 6px; 
      flex-shrink: 0;
    }
    #node-title {
      font-weight: 600;
      margin-top: 8px;
      font-size: clamp(13px, 1.1vw, 16px);
    }
    .muted { color: var(--muted); font-weight: 400; font-size: 13px; text-align: center; padding: 16px; border: 1px dashed var(--line); border-radius: 10px; }

    #node-links {
      margin-top: 6px;
      flex-shrink: 0;
    }

    #connections-box {
      margin-top: 4px;
      background: var(--chart-bg);
      border-radius: 10px;
      padding: 6px;
      overflow: auto;
      border: 1px solid var(--line);
      flex: 1;
    }
    .conn-item {
      padding: clamp(4px, 0.5vw, 6px);
      cursor: pointer;
      font-size: clamp(12px, 1vw, 14px);
      color: var(--text);
      border-bottom: 1px solid var(--line);
      transition: background 0.15s;
    }
    .conn-item:last-child { border-bottom: none; }
    .conn-item:hover {
      background: var(--surface-hover);
    }

    #msg { margin-top: 6px; color: var(--error); font-size: 13px; min-height: 18px; }

    /* MOBILE RESPONSIVE - HORIZONTAL BOTTOM PANEL */
    @media (max-width: 700px) {
      #wrap {
        flex-direction: column;
      }
      
      #graph-area {
        flex: 1;
        height: auto;
        max-height: 60vh;
      }
      
      #info-panel {
        width: 100%;
        min-width: 100%;
        max-width: 100%;
        height: 40vh;
        padding: 12px;
        border-left: none;
        border-top: 1px solid var(--line);
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto auto auto auto 1fr auto;
        gap: 2px;
      }
      
      /* Row 1: Controls + Story button */
      #controls {
        grid-column: 1 / 2;
        grid-row: 1;
        margin-bottom: 0;
      }
      
      #search-box {
        display: flex;
        gap: 3px;
      }
      
      #search-input {
        flex: 1;
        min-width: 40px;
        font-size: 12px;
        padding: 4px 6px;
      }
      
      #search-btn {
        height: 29px;
        padding: 0px 6px;
        font-size: 16px;
      }
      
      #clear-btn {
        height: 29px;
        padding: 6px 6px;
        font-size: 11px;
      }
      
      #story-btn {
        height: 29px;
        grid-column: 2;
        grid-row: 1;
        width: auto !important;
        margin: 0 !important;
        padding: 6px 6px !important;
        font-size: 11px !important;
        align-self: start;
      }
      
      /* Row 2: Suggestions */
      #suggestions {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      
      /* Row 3: Story view content */
      #view-content {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      
      /* Row 4: Node info (title/description) */
      #node-info {
        grid-column: 1 / -1;
        grid-row: 3;
      }
      
      #node-title {
        font-size: 13px;
      }
      
      /* Row 5: Node links label */
      #node-links {
        grid-column: 1 / -1;
        grid-row: 4;
      }
      
      /* Row 6: Connections box (flexible/scrollable) */
      #connections-box {
        grid-column: 1 / -1;
        grid-row: 4;
        overflow: auto;
        min-height: 2px;
      }
      
      /* Row 7: Message */
      #msg {
        grid-column: 1 / -1;
        grid-row: 7;
      }
      
      #logo {
        bottom: 12px;
        right: 12px;
      }
      
      #logo img {
        height: 40px;
      }
    }

    /* LOADING OVERLAY */
    #loading-overlay {
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
      z-index: 99999;
      font-size: 13px;
      color: var(--muted);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid var(--line);
      border-left-color: var(--yellow);
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    /* STORY MODE BUTTONS */
    #story-btn {
      height: 29px;
      padding: 6px 6px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      background: var(--text);
      color: var(--surface);
      font-family: var(--font-family);
      font-weight: 500;
      flex-shrink: 0;
      white-space: nowrap;
      margin-bottom: 8px;
      width: 100%;
      display: none;
      transition: opacity 0.15s;
    }
    
    @media (max-width: 768px) {
      #story-btn {
        width: auto;
      }
    }

    #story-btn:hover {
      background: var(--text);
      opacity: 0.85;
    }

    #story-nav-container {
      display: none;
      gap: 4px;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    #story-nav-container.active {
      display: flex;
    }

    .story-nav-btn {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      flex: 1;
      transition: background 0.15s, border-color 0.15s;
    }

    .story-nav-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .story-nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .exit-story-nav-btn {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      font-weight: 500;
      font-size: 13px;
      white-space: nowrap;
      flex: 1;
      transition: background 0.15s, border-color 0.15s;
    }

    .exit-story-nav-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--accent);
    }


    /* ENTITY MODAL IN STORY MODE */
    #entity-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--surface);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
    }

    #entity-modal.active {
      display: flex;
    }

    #entity-modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 1px solid var(--line);
      cursor: pointer;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-family);
      font-weight: 400;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1001;
      transition: background 0.15s, border-color 0.15s;
    }

    #entity-modal-close:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    #entity-modal-content {
      flex: 1;
      overflow: auto;
      margin-top: 8px;
    }

    /* VIEW CONTENT STYLES */
    #view-content {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    #view-content.active {
      display: block;
    }

    .view-title {
      font-size: 22px;
      font-weight: 600;
      margin-top: 12px;
      margin-bottom: 12px;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .view-progress {
      font-size: 11px;
      font-weight: 400;
      color: var(--accent-text);
      margin-top: 4px;
    }

    .view-image {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 12px;
      object-fit: contain;
    }

    .view-text {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 12px;
      min-height: 0;
    }

    /* Story mode MOBILE adjustments */
    @media (max-width: 768px) {
      .view-title {
        font-size: 20px !important;
        margin-top: 6px !important;
        margin-bottom: 6px !important;
      }
      
      .view-text {
        font-size: 14px !important;
        line-height: 1.4 !important;
        padding-bottom: 6px !important;
      }
      
      .view-image {
        display: none !important;
      }
      
      #story-nav-container {
        margin-bottom: 6px !important;
        gap: 3px !important;
      }
      
      .story-nav-btn {
        padding: 6px 7px !important;
        font-size: 11px !important;
      }

      .exit-story-nav-btn {
        padding: 6px 7px !important;
        font-size: 11px !important;
      }
    }

    /* ══════════════════ TABLE TOOL STYLES (scoped to #table-root) ══════════════════ */
    #table-root{
      /* Page */
      --page-bg: var(--bg);
      --text-primary: var(--text);
      /* Borders */
      --border: var(--line);
      --border-strong: var(--line);
      --border-light: var(--line);
      /* Text hierarchy */
      --text-secondary: var(--text);
      --text-muted: var(--muted);
      --text-faint: var(--muted);
      /* Dark accent */
      --accent-dark: var(--text);
      --accent-dark-hover: var(--text);
      /* Danger / error */
      --danger: var(--error);
      /* Warning / filter bar */
      --warning-bg: var(--bg);
      --warning-border: var(--line);
      /* Highlight (hover crosshair) */
      --highlight:       rgba(200, 190, 100, 0.225);
      /* Table cell borders */
      --cell-border: var(--line);
      /* Header borders */
      --th-border:rgba(0,0,0,.12);
      /* Semi-transparent overlays */
      --overlay-border:  rgba(0,0,0,.18);
      --btn-bg:          rgba(255,255,255,.35);
      --btn-bg-hover:    rgba(255,255,255,.7);
      position:fixed;
      inset:0;
      z-index:1;
      display:none;
      flex-direction:column;
      font-family:'Rubik',system-ui,sans-serif;
      background:var(--page-bg);
      color:var(--text-primary);
    }
    #table-root *,#table-root *::before,#table-root *::after{box-sizing:border-box;margin:0;padding:0}
    #table-root #table-app{display:flex;flex-direction:column;height:100vh;overflow:hidden;flex:1}

    /* ── Status bar ── */
    #table-root #status-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:8px 16px;
      background: var(--page-bg);
      border-bottom:1px solid var(--page-bg);
      font-size:12px;
      color:var(--text-muted);
      flex-shrink:0;
      gap:12px;
    }
    #table-root #status-bar .left{display:flex;align-items:center;gap:8px}
    #table-root #status-bar .right{display:flex;align-items:center;gap:8px}
    #table-root .share-btn{
      padding:3px 10px;
      border:1px solid var(--border-strong);
      border-radius:4px;
      background: var(--surface);
      font-family:inherit;
      font-size:11px;
      cursor:pointer;
      color:var(--text-secondary);
      text-decoration:none;
      transition: background 0.15s, border-color 0.15s;
    }
    #table-root .share-btn:hover{ background: var(--surface-hover); border-color: var(--accent); }
    #table-root .source-link{ font-size:11px; color: var(--accent-text); text-decoration:none; cursor:pointer; }
    #table-root .source-link:hover{ text-decoration:underline; color: var(--text); }
    #table-root .source-label{color:var(--text-faint);font-size:11px}

    /* ── Filter bar ── */
    #table-root #filter-bar{
      display:none;align-items:center;padding:5px 16px;background:var(--warning-bg);
      border-bottom:1px solid var(--warning-border);font-size:12px;color:var(--text-muted);flex-shrink:0;gap:8px;
    }
    #table-root #filter-bar.active{display:flex}
    #table-root .clear-filters-btn{
      padding:2px 8px;
      border:1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      font-family:inherit;
      font-size:11px;
      cursor:pointer;

      transition: background 0.15s, border-color 0.15s;

    /* ── Table ── */

    #table-root .sort-btn:focus-visible,#table-root .filter-btn:focus-visible{outline:2px solid currentColor;outline-offset:1px}

    #table-root tbody td{

    /* Toggle button column */

    #table-root .tbtn{
      display:inline-flex;
      align-items:center;

    /* Sticky columns */
    #table-root .col-sticky{position:sticky;z-index:5}

    /* Hover highlight */
    #table-root tbody tr.row-hover td.col-hover{box-shadow:inset 0 0 0 9999px var(--highlight)}

    /* Pagination */
    #table-root #pag-bar{ display:flex; align-items:center; justify-content:center; gap:4px; padding:10px 16px; background: var(--page-bg); border-top:1px solid var(--border); flex-shrink:0; font-size:13px; }
    #table-root .pg{ display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:30px; padding:0 6px; border:1px solid var(--border); border-radius: 4px; background:var(--surface); font-family:inherit; font-size:13px; cursor:pointer; user-select:none; transition: background 0.15s, border-color 0.15s; }
    #table-root .pg:hover:not(:disabled):not(.pga){ background:var(--surface-hover); border-color: var(--accent); }
    #table-root .pga{background:var(--accent-dark);color:var(--surface);border-color:var(--accent-dark)}
    #table-root .pg:disabled{opacity:.3;cursor:default}
    #table-root .pgd{padding:0 4px;color:var(--text-faint)}

    /* Filter dropdown */
    #table-root .filter-dropdown{
      position:absolute;
      z-index:100;
      background:var(--surface);
      border:1px solid var(--border-strong);
      border-radius: 10px;
      width:220px;
      max-height:320px;
      display:flex;
      flex-direction:column;

    }
    #table-root .filter-dropdown .fd-search{padding:8px;border-bottom:1px solid var(--border-light)}
    #table-root .filter-dropdown .fd-search input{

    #table-root .filter-dropdown .fd-search input:focus{ border-color: var(--accent); }

    #table-root .filter-dropdown .fd-item{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer}
    #table-root .filter-dropdown .fd-item:hover{background:var(--surface-hover)}
    #table-root .filter-dropdown .fd-item input[type=checkbox]{margin:0;cursor:pointer}
    #table-root .filter-dropdown .fd-item label{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    #table-root #load-screen{display:flex;align-items:center;justify-content:center;height:100vh;font-size:14px;color:var(--text-muted)}

    @keyframes tbl-sp{to{transform:rotate(360deg)}}
    #table-root #err-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center}
    #table-root #err-screen h2{font-size:17px;margin-bottom:8px;color:var(--danger)}
    #table-root #err-screen p{font-size:13px;color:var(--text-secondary);max-width:500px;line-height:1.6}

    /* ── Search bar ── */
    #table-root #tbl-search-bar{ padding:12px 16px 8px; background: var(--page-bg); flex-shrink:0; }
    #table-root .tbl-search{position:relative;display:flex;align-items:center;max-width:640px}
    #table-root .tbl-search-icon{position:absolute;left:14px;color:var(--text-muted);pointer-events:none}
    #table-root #tbl-search-input{
      width:100%;
      height:44px;
      padding:0 44px 0 44px;
      border: 1px solid var(--line);
      border-radius:10px;

      font-family:inherit;
      font-size:15px;

    }

      position:absolute;

      border-radius:50%;

      cursor:pointer;
      transition: background 0.15s;

    /* ── Button filter bar ── */
    #table-root #btn-filter-bar{
      display:flex;
      align-items:center;

      transition: background 0.15s, border-color 0.15s;

    #table-root .bf-dropdown{
      position:absolute;

      left:0;

    #table-root .bf-dropdown .bfd-search{padding:8px;border-bottom:1px solid var(--border-light)}
    #table-root .bf-dropdown .bfd-search input{
      width:100%;
      padding:5px 8px;

    }
    #table-root .bf-dropdown .bfd-search input:focus{ border-color: var(--accent); }
    #table-root .bf-dropdown .bfd-list{overflow-y:auto;flex:1;padding:4px 0;max-height:180px}
    #table-root .bf-dropdown .bfd-item{display:flex;align-items:center;gap:6px;padding:4px 10px;cursor:pointer}
    #table-root .bf-dropdown .bfd-item:hover{background:var(--surface-hover)}
    #table-root .bf-dropdown .bfd-item input[type=checkbox]{margin:0;cursor:pointer}
    #table-root .bf-dropdown .bfd-item label{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #table-root .bf-dropdown .bfd-actions{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border-light)}
    #table-root .bf-dropdown .bfd-actions button{
      flex:1;
      padding:4px 0;
      border:1px solid var(--border);
      border-radius:4px;
      background:var(--surface);
      font-family:inherit;

      transition: background 0.15s, border-color 0.15s;
    }
    #table-root .bf-dropdown .bfd-actions button:hover{ background:var(--surface-hover); border-color: var(--accent); }
    #table-root .bf-dropdown .bfd-actions button.bfd-apply{background:var(--accent-dark);color:var(--surface);border-color:var(--accent-dark)}
    #table-root .bf-dropdown .bfd-actions button.bfd-apply:hover{ background: var(--text); opacity: 0.85; }

    /* ── Chart area outline ── */
    #table-root #chart-outline{
      border-radius: 10px;

      display:flex;
      flex-direction:column;
      flex:1;
      min-height:0;
      border: 1px solid var(--line);
      margin: 0 16px 16px;
    }
  </style>

<body>
  <div id="wrap">
    <div id="graph-area">
      <canvas id="canvas"></canvas>
      
      <div id="logo">
        <img src="https://i.ibb.co/60z33Lp3/scroller-11.png" alt="Logo">
      </div>
      
      <!-- Shape Legend Container -->
      <div id="shape-legend-container" style="display: none;"></div>

      <div id="top-controls">

      </div>

      <div id="node-info">

      <!-- Entity Modal for Story Mode -->
      <div id="entity-modal">

        </div>

  </div>

    <!-- TABLE TOOL ROOT (hidden unless the Table Tool is active) -->
  <div id="table-root" style="display:none;">
    <div id="table-app"><div id="load-screen"><div class="spin"></div>Loading&hellip;</div></div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script id="html2canvas-script" src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script id="viewer-script">
  /************************************************************************
   * CONFIG
   ************************************************************************/
  const CONFIG = {
    pointOpacity: 1.0,
    unconnectedOpacity: 0.15,
    linkOpacityNoSelection: 0.8,
    linkOpacitySelected: 0.8,
    labelFontSize: 17,
    labelBoxPadding: 4,
    labelOffsetY: 4,
    labelBoxOpacity: 0.6,
    gridUnits: 60,         // 60×60 coordinate grid, -30 to 30
    gridPadding: 50,       // px padding around the grid edges
    baseChartWidth: 900,   // reference laptop chart-area width for UI scaling
    force: {
      velocityDecay: 0.25,
      spread: 1.6,          // multiplier on the area-derived ideal edge length
      stressExactMax: 200,  // at or below this node count, exact all-pairs BFS
      stressPivots: 150,    // pivot count for sparse stress above that
      simTopK: 8,           // similarity relationships kept per node
      simFloor: 0.05,       // minimum Jaccard score worth keeping
      simDegreeCap: 200     // sample, don't enumerate, neighbours of hubs
    },
    showImages: true,
    maxSuggestions: 25,
    zoomMin: 0.2,
    zoomMax: 5.0,
    zoomStep: 0.2,
    /*──────────────────────────────────────────────────────────────
     * GOOGLE SHEETS CSV LINKS — paste your published CSV URLs here
     * (File → Share → Publish to web → select sheet → CSV → Publish)
     *──────────────────────────────────────────────────────────────*/
    entitiesUrl:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vTjOiYDBj-gr1jK1bz45eAu14zfoaCHt897e3_8Jd2eVsNPIep0TNJuTRkT7mFWRXxCCEc1ahyN48Zi/pub?gid=0&single=true&output=csv',  // REQUIRED
    connectionsUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTjOiYDBj-gr1jK1bz45eAu14zfoaCHt897e3_8Jd2eVsNPIep0TNJuTRkT7mFWRXxCCEc1ahyN48Zi/pub?gid=1264353166&single=true&output=csv',  // REQUIRED
    viewsUrl:       'https://docs.google.com/spreadsheets/d/e/2PACX-1vTjOiYDBj-gr1jK1bz45eAu14zfoaCHt897e3_8Jd2eVsNPIep0TNJuTRkT7mFWRXxCCEc1ahyN48Zi/pub?gid=1739742541&single=true&output=csv',  // optional
  };

  const PADDING = 80;

  /*──────────────────────────────────────────────────────────────
   * DATA SOURCE MODE (mapper)
   * 'sheets' → data is fetched live from the Google Sheets links.
   * 'csv'    → data came from uploaded CSV files; the raw text is
   *            kept in memory and embedded into saved HTML files
   *            as a static snapshot.
   *──────────────────────────────────────────────────────────────*/
  let dataSource = 'sheets';
  let csvData = { entities: '', connections: '', views: '' };

  // Demo URL used to pre-fill the Table Tool connect screen.
  const TABLE_DEMO_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQpzCSzDF3ZNRjTpWTkB786-3oLGz8oXcdwdOC70nfoIKPSgCeEtN5X0H9uG1qmzF2wioc3rKZuSZK/pub?gid=0&single=true&output=csv';

  /*──────────────────────────────────────────────────────────────
   * GOOGLE SHEETS URL CONVERSION (shared by mapper + table)
   * Accepts a normal Google Sheets web link OR a published CSV
   * link and returns a URL that serves CSV — the tool works
   * whether or not the pasted link has the &output=csv suffix.
   *──────────────────────────────────────────────────────────────*/
  function toCSVUrl(raw) {
    raw = String(raw || '').trim();
    if (!raw) return raw;
    // "Publish to web" page link → CSV variant of the same link
    raw = raw.replace(/\/pubhtml\b/, '/pub');
    if (/\/pub\b/.test(raw)) {
      if (/output=csv/i.test(raw)) return raw;
      if (/output=[^&#]*/i.test(raw)) return raw.replace(/output=[^&#]*/i, 'output=csv');
      return raw + (raw.includes('?') ? '&' : '?') + 'output=csv';
    }
    if (/\/export\b/.test(raw)) {
      if (!/format=csv/i.test(raw)) {
        raw = raw.replace(/format=[^&#]*/i, 'format=csv');
        if (!/format=csv/i.test(raw)) raw += (raw.includes('?') ? '&' : '?') + 'format=csv';
      }
      return raw;
    }
    // Normal editor link → export URL
    const m = raw.match(/\/spreadsheets\/(?:u\/\d+\/)?d\/([a-zA-Z0-9_-]+)/);
    if (!m) return raw;
    const id = m[1], gid = raw.match(/[#&?]gid=(\d+)/);
    let url = 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv';
    if (gid) url += '&gid=' + gid[1];
    return url;
  }

  // Get the raw CSV text for one of the mapper's data kinds
  // ('entities' | 'connections' | 'views'), from the uploaded CSV
  // snapshot or by fetching the Google Sheet. Returns null when an
  // optional (views) source isn't configured.
  async function getSourceText(kind, bust) {
    if (dataSource === 'csv') {
      const t = csvData[kind] || '';
      if (!t) {
        if (kind === 'views') return null;
        throw new Error('No uploaded CSV for ' + kind + '.');
      }
      return t;
    }
    const url = kind === 'entities' ? CONFIG.entitiesUrl : kind === 'connections' ? CONFIG.connectionsUrl : CONFIG.viewsUrl;
    if (!url) {
      if (kind === 'views') return null;
      throw new Error('Missing ' + kind + ' link.');
    }
    return fetchSheetCSV(url, bust, kind);
  }

  // Fetch a Google Sheet as CSV text (shared by the mapper and the table).
  // label names the sheet in error messages, e.g. "entities"; bust adds a
  // cache-buster because Google caches published CSVs aggressively.
  async function fetchSheetCSV(url, bust, label) {

    if (legendContainer.style.display === 'none') return titlePad + (padding > 0 ? padding + 10 : 0);

  /************************************************************************

   ************************************************************************/
  function resizeCanvas() {
    // Clear inline styles to let CSS percentage sizing work
    canvas.style.width = '';
    canvas.style.height = '';
    
    // Force reflow to get actual available space
    void canvas.offsetHeight;
    
    const rect = canvas.getBoundingClientRect();
    const hiResScale = devicePixelRatio * 1.5;
    canvas.width  = Math.max(600, Math.floor(rect.width  * hiResScale));
    canvas.height = Math.max(400, Math.floor(rect.height * hiResScale));
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  
  resizeCanvas();
  // ONE place that fits the canvas and layout to the space available. It runs
  // whenever the chart area, a legend or a title changes size (window resize,
  // fullscreen, info panel on/off or its width animation, legend collapse,
  // late font loads), coalesced to once per animation frame.
  function relayout() {
    resizeCanvas();
    if (nodes.length > 0) computeGridLayout();
    if (simulation && simulation.force('x')) {
      simulation.force('x').x((canvas.width / devicePixelRatio) / 2);
      simulation.force('y').y((canvas.height / devicePixelRatio) / 2);
    }
    render();
  }
  let relayoutQueued = false;
  function scheduleRelayout() {
    if (relayoutQueued) return;
    relayoutQueued = true;
    requestAnimationFrame(() => { relayoutQueued = false; relayout(); });
  }
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(scheduleRelayout);
    ['graph-area', 'legend-container', 'shape-legend-container', 'chart-title', 'chart-subtitle']
      .forEach(id => { const el = document.getElementById(id); if (el) ro.observe(el); });

  /************************************************************************
   * NODE SIZING
   ************************************************************************/
  function updateNodeSizes() {
    if (nodes.length === 0) return;
    
    const mode = formattingSettings.nodeSizeMode;
    
    if (mode === 'custom') {
      // Fixed size for all nodes
      nodes.forEach(n => {
        n.baseR = formattingSettings.nodeSize;
        n.r = n.baseR;
      });
    } else {
      // Compute the metric for each node based on mode
      let metricValues = [];
      nodes.forEach(n => {
        let val = 0;
        if (mode === 'connections') {
          val = (adjacency.get(n.id) || new Set()).size;
        } else if (mode === 'connectionsOutTotal') {
          val = connectionOutTotals.get(n.id) || 0;
        } else if (mode === 'connectionsInTotal') {
          val = connectionInTotals.get(n.id) || 0;
        }
        n._sizeMetric = val;
        metricValues.push(val);
      });
      
      const maxVal = Math.max(...metricValues, 1);
      const minVal = Math.min(...metricValues, 0);
      
      nodes.forEach(n => {
        const normalized = maxVal > minVal 
          ? (n._sizeMetric - minVal) / (maxVal - minVal)
          : 0.5;
        n.baseR = formattingSettings.minNodeSize + normalized * (formattingSettings.maxNodeSize - formattingSettings.minNodeSize);
        n.r = n.baseR;
      });
    }
  }

  /************************************************************************
   * VALUE FORMATTING
   ************************************************************************/
  function formatValue(value, prefix) {
    if (value == null || isNaN(value)) return '';
    const absVal = Math.abs(value);
    let num, suffix;
    if (absVal >= 1e9) { num = value / 1e9; suffix = 'B'; }
    else if (absVal >= 1e6) { num = value / 1e6; suffix = 'M'; }
    else if (absVal >= 1e3) { num = value / 1e3; suffix = 'k'; }
    else { return (prefix || '') + String(Math.round(value)); }
    let str = num.toFixed(1);
    if (str.endsWith('.0')) str = str.slice(0, -2);
    return (prefix || '') + str + suffix;
  }

  /************************************************************************
   * AUTO-LOAD DATA FROM GOOGLE SHEETS
   ************************************************************************/
  async function autoLoadData() {
    if (dataSource === 'sheets' && (!CONFIG.entitiesUrl || !CONFIG.connectionsUrl)) {
      loadingText.textContent = 'No data source is connected.';
      return;
    }
    if (dataSource === 'csv' && (!csvData.entities || !csvData.connections)) {
      loadingText.textContent = 'No uploaded CSV data found.';
      return;
    }

    loadingOverlay.style.display = 'flex';
    loadingText.textContent = 'Loading data...';

    try {
      // Fetch entities and connections (required) — from Google Sheets or
      // from the uploaded CSV snapshots, depending on dataSource.
      const [entitiesText, connectionsText] = await Promise.all([
        getSourceText('entities', false),
        getSourceText('connections', false)
      ]);

      const entitiesData = Papa.parse(entitiesText, { header: true, skipEmptyLines: true }).data;
      const connectionsData = Papa.parse(connectionsText, { header: true, skipEmptyLines: true }).data;

      // NOTE: formatting is no longer read from a sheet — it is set via the
      // in-tool Options menu and stored in the saved HTML file.

      // Try to load views (optional)
      try {
        const viewsText = await getSourceText('views', false);
        if (viewsText) {
          const viewsDataParsed = Papa.parse(viewsText, { header: true, skipEmptyLines: true }).data;
          parseViewsData(viewsDataParsed);
        }
      } catch (e) {
        // Views source is optional, ignore errors
      }

      loadSession(entitiesData, connectionsData);

    } catch (err) {
      loadingText.textContent = 'Error: ' + err.message;
      setTimeout(() => {
        // Update story button visibility
        updateStoryButtonVisibility();

        loadingOverlay.style.display = 'none';
      }, 3000);
    }
  }

  /************************************************************************
   * REFRESH DATA
   * Re-fetches the live Google Sheets (or re-reads the uploaded CSV
   * snapshots) and rebuilds the chart so it matches the current data:
   * removed entities/connections disappear, new ones appear. Saved node
   * positions for entities that no longer exist are pruned so the
   * exported/saved file stays clean.
   ************************************************************************/
  async function refreshData() {
    if (dataSource === 'sheets' && (!CONFIG.entitiesUrl || !CONFIG.connectionsUrl)) {
      alert('No data source is connected. Use \u201cNew / Load\u201d to connect a chart first.');
      return;
    }
    if (dataSource === 'csv' && (!csvData.entities || !csvData.connections)) {
      alert('No uploaded CSV data found. Use the connection screen to upload CSVs first.');
      return;
    }

    loadingOverlay.style.display = 'flex';
    loadingText.textContent = 'Refreshing data\u2026';

    try {
      // Cache-busted fetch for Google Sheets (Google caches published CSVs
      // aggressively); uploaded CSV snapshots are just re-read from memory.
      const [entitiesText, connectionsText] = await Promise.all([
        getSourceText('entities', true),
        getSourceText('connections', true)
      ]);

      const entitiesData = Papa.parse(entitiesText, { header: true, skipEmptyLines: true }).data;
      const connectionsData = Papa.parse(connectionsText, { header: true, skipEmptyLines: true }).data;

      // Refresh views too, so removed/added views are also reflected. Clear
      // first so a now-empty or unreachable views source doesn't keep stale ones.
      viewsData = [];
      viewsById.clear();
      sortedViewIds = [];
      currentViewIndex = 0;
      try {
        const viewsText = await getSourceText('views', true);
        if (viewsText) {
          const viewsDataParsed = Papa.parse(viewsText, { header: true, skipEmptyLines: true }).data;
          parseViewsData(viewsDataParsed);
        }
      } catch (e) {
        // Views source is optional, ignore errors
      }

      // Rebuild the whole session from the fresh data. Nodes that the user
      // positioned (grid coords stored in savedPositions) keep their spot;
      // brand-new entities are placed by physics.
      loadSession(entitiesData, connectionsData);

      // CLEAN THE SAVED DATA: drop saved positions for entities that no longer
      // exist, so a subsequent "Export saved HTML" reflects only current data.
      // (Entities hidden by the connection filter still exist, so their
      // saved positions are kept.)
      const liveNames = new Set(allNodes.map(n => n.name));
      Array.from(savedPositions.keys()).forEach(k => {
        if (!liveNames.has(k)) savedPositions.delete(k);
      });

      // A previously-selected/hovered node may have been removed or hidden.
      if (selectedNode && !nodeById.has(selectedNode.id)) {
        selectedNode = null;
        if (!isStoryMode) clearInfoPanel();
      }
      hoveredNode = null;
      hoveredConnection = null;

      render();
    } catch (err) {
      loadingText.textContent = 'Refresh failed: ' + err.message;
      setTimeout(() => { loadingOverlay.style.display = 'none'; }, 3000);
    }
  }

  // Trim stray spaces from CSV header names ("Entity Name " -> "Entity Name"),
  // in place, so column lookups by name always match.
  function trimHeaderKeys(rows) {
    rows.forEach(r => {
      Object.keys(r).forEach(k => {
        const t = k.trim();
        if (k !== t) { r[t] = r[k]; delete r[k]; }
      });
    });
  }

  function parseViewsData(data) {
    if (!data || data.length === 0) return;
    
    trimHeaderKeys(data);

    viewsData = data.map(r => ({
      id: String(r['View ID'] || '').trim(),
      title: String(r['View Title'] || '').trim(),
      text: String(r['View Text'] || '').trim(),
      image: String(r['View Image'] || '').trim()
    })).filter(v => v.id);

    // Build views by ID map
    viewsById.clear();
    viewsData.forEach(v => {
      viewsById.set(v.id, v);
    });

    // Sort view IDs numerically
    sortedViewIds = viewsData.map(v => v.id).sort((a, b) => {
      const numA = parseInt(a);
      const numB = parseInt(b);
      if (!isNaN(numA) && !isNaN(numB)) {
        return numA - numB;
      }
      return a.localeCompare(b);
    });
  }

  /************************************************************************
   * LOAD SESSION
   ************************************************************************/
  function loadSession(entitiesData, connectionsData) {
    trimHeaderKeys(entitiesData);
    trimHeaderKeys(connectionsData);

    // Check if Entities.csv has Views column
    if (entitiesData.length > 0) {
      hasViewsColumn = 'Views' in entitiesData[0];
    }

    // Create nodes
    nodes = entitiesData.map((d, i) => createNodeFromData(d, i));
    nodeById = new Map(nodes.map(n => [n.id, n]));

    // Build entity views map if we have views (the per-view entity cache is
    // built by applyConnectionFilter, once the visible set is known)
    if (hasViewsColumn) {
      buildEntityViewsMap(entitiesData);
    }

    // Create links
    processLinksData(connectionsData);

    // Apply any manually-saved node positions (overrides sheet X/Y). Done on
    // the full set so a hidden node keeps its spot for when it's shown again.
    applySavedPositions();

    // Keep the full data, then derive the visible nodes/links from it. This
    // also builds adjacency, connection value totals and the search index.
    allNodes = nodes;
    allLinks = links;
    applyConnectionFilter();

    // Resolve the "Cell" column against the current cell configuration
    normalizeCellSettings();
    updateCellAssignments();

    // Calculate node sizes
    updateNodeSizes();

    // Determine layout: if most nodes have grid coords, use static grid;
    // otherwise let physics handle positioning
    const gridCount = nodes.filter(n => n.hasGridCoords || n.cellIdx != null).length;
    const isStaticLayout = gridCount > nodes.length * 0.5;

    // Show/hide the info panel BEFORE computing layout. The panel is a flex
    // sibling of #graph-area, so it claims width on the right; if we lay out
    // first, nodes get centered across the full window and end up hidden
    // behind the panel. updateInfoPanelVisibility() flips display synchronously,
    // and the synchronous resizeCanvas() that follows reads the (now narrower)
    // graph-area width so computeGridLayout() centers into the visible space.
    updateInfoPanelVisibility();
    resizeCanvas();

    // Compute initial grid layout (positions grid nodes, scales radii)
    computeGridLayout();

    // Load images
    loadAllImages();
    
    // Load background image if enabled
    loadBackgroundImage();

    // Preload all story mode view images immediately
    preloadStoryImages();

    // Start physics (for non-grid nodes)
    updatePhysics();

    // Update story button visibility
    updateStoryButtonVisibility();
    
    // Update UI elements from formatting
    updateLogoFromSettings();
    updateTitleFromSettings();
    updateShareFromSettings();
    // (info panel visibility already applied before the layout above)

    // Update legend after nodes are loaded
    updateCategoryColors();
    updateLegend();
    updateShapeLegend();
    

    loadingOverlay.style.display = 'none';
  }

  /************************************************************************
   * GRID LAYOUT — maps grid coordinates to canvas pixels
   * Grid is 60×60: x ∈ [-30,30], y ∈ [-30,30], (0,0) = centre
   * Positive Y = up (canvas Y is inverted)
   ************************************************************************/
  function computeGridLayout() {
    if (nodes.length === 0) return;

    const cw = canvas.width / devicePixelRatio;
    const ch = canvas.height / devicePixelRatio;
    const legendPad = getLegendPadding();
    const pad = CONFIG.gridPadding;

    const availW = cw - pad * 2;
    const availH = ch - pad * 2 - legendPad;

    // One grid unit = gridScale pixels; fit 60 units into the smaller axis
    gridScale = Math.min(availW, availH) / CONFIG.gridUnits;

    // UI scale: how big things look relative to a ~900px-wide reference
    uiScale = Math.min(availW, availH) / CONFIG.baseChartWidth;

    const centerX = cw / 2;
    const centerY = pad + legendPad + availH / 2;
    gridCenterX = centerX;
    gridCenterY = centerY;

    nodes.forEach(n => {
      // Only reposition nodes that have grid coordinates
      if (n.hasGridCoords) {
        const px = centerX + n.gridX * gridScale;
        const py = centerY - n.gridY * gridScale;   // flip Y
        n.x = px;
        n.y = py;
        n.fx = px;
        n.fy = py;
      }

      // Scale radius for ALL nodes (grid + physics)
      n.r = (n.baseR || formattingSettings.minNodeSize)
            * formattingSettings.sizeScale
            * uiScale;
    });

    // Cell-assigned nodes are positioned last: their slots depend on the
    // radii and grid scale computed just above.
    applyCellLayout();

    // Keep collision radii in step with the new node sizes
    if (simulation && simulation.force('collide')) {
      const pad = effectiveCollisionPadding();
      simulation.force('collide').radius(d => d.r + pad);
    }
  }

  /************************************************************************
   * GRID <-> PIXEL HELPERS + POSITION PERSISTENCE
   ************************************************************************/
  function gridToPixel(gx, gy) {
    return { x: gridCenterX + gx * gridScale, y: gridCenterY - gy * gridScale };
  }
  function pixelToGrid(px, py) {
    if (!gridScale) return { gx: 0, gy: 0 };
    return { gx: (px - gridCenterX) / gridScale, gy: (gridCenterY - py) / gridScale };
  }

  // Freeze every currently-unfixed node at its present position (mode 'freezeAfterInitial')
  function freezeAllNodes() {
    nodes.forEach(n => {
      if (!n.hasGridCoords) {
        const g = pixelToGrid(n.x, n.y);
        n.gridX = g.gx;
        n.gridY = g.gy;
        n.hasGridCoords = true;
        n.fx = n.x;
        n.fy = n.y;
      }
    });
    if (simulation) simulation.stop();
  }

  // Apply manually-saved grid positions (overrides any X/Y from the sheet)
  function applySavedPositions() {
    if (!savedPositions || savedPositions.size === 0) return;
    nodes.forEach(n => {
      if (savedPositions.has(n.name)) {
        const p = savedPositions.get(n.name);
        n.gridX = p.x;
        n.gridY = p.y;
        n.hasGridCoords = true;
      }
    });
  }

  function rebuildShapeCategoryMap() {
    shapeCategoryMap.clear();
    shapeLegendEntries.forEach(e => {
      if (e.enabled && e.label) shapeCategoryMap.set(e.label, e.shape);
    });
  }

  function sanitizeFilename(name) {
    return (String(name || 'chart').trim() || 'chart')
      .replace(/[^a-z0-9\-_ ]/gi, '')
      .replace(/\s+/g, '-')
      .slice(0, 80) || 'chart';
  }

  // Apply a parsed saved-chart data object to the live viewer state.
  // Used by both the standalone boot path and the tool's "load saved chart".
  function applyChartData(data) {
    if (!data) return;
    if (data.settings) {
      Object.assign(formattingSettings, data.settings);
    }
    if (Array.isArray(data.colorLegend)) colorLegendEntries = data.colorLegend;
    if (Array.isArray(data.shapeLegend)) { shapeLegendEntries = data.shapeLegend; rebuildShapeCategoryMap(); }
    if (data.physicsMode) physicsMode = data.physicsMode;
    if (typeof data.physicsDuration === 'number' && isFinite(data.physicsDuration)) {
      physicsDurationSec = Math.min(20, Math.max(1, Math.round(data.physicsDuration)));
    }
    if (data.title) { chartName = data.title; document.title = data.title; }
    if (data.urls) {
      CONFIG.entitiesUrl = data.urls.entities || '';
      CONFIG.connectionsUrl = data.urls.connections || '';
      CONFIG.viewsUrl = data.urls.views || '';
    }
    if (data.source) dataSource = data.source;
    if (data.csv) {
      csvData.entities = data.csv.entities || '';
      csvData.connections = data.csv.connections || '';
      csvData.views = data.csv.views || '';
    }
    if (data.positions) {
      savedPositions = new Map(Object.entries(data.positions).map(([k, v]) => [k, { x: v.x, y: v.y }]));
    }
    if (formattingSettings.backgroundColor) {
      document.documentElement.style.setProperty('--chart-bg', formattingSettings.backgroundColor);
    }
    normalizeCellSettings();
  }

    // "Custom Node Color" column: a hex colour with or without a leading "#".
    // Accepts 3-digit (F60) and 6-digit (FF6600) forms; spaces are ignored.
    // Anything else is treated as blank, so the node falls back to its image
    // or to the default node colour from the Options menu.
    function parseHexColor(v) {
      if (v === undefined || v === null) return null;
      let h = String(v).replace(/\s+/g, '').replace(/^#/, '');
      if (/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(c => c + c).join('');
      return /^[0-9a-fA-F]{6}$/.test(h) ? '#' + h.toUpperCase() : null;
    }

    // "Inner Node Label" column: text drawn inside the node. Line breaks typed
    // in the cell are kept; runs of spaces collapse to one.
    function parseInnerLabel(v) {
      if (v === undefined || v === null) return '';
      return String(v).replace(/\r\n?/g, '\n').split('\n')
        .map(l => l.replace(/[ \t]+/g, ' ').trim())
        .filter(l => l !== '')
        .join('\n');
    }

    function createNodeFromData(d, i) {
        const id = d['Entity Name'] ? String(d['Entity Name']).trim() : `__P_${i}`;
        
        // Optional "Cell" column: a 1-based cell number, blank = unassigned.
        const cellNum = parseInt(String(d['Cell'] === undefined || d['Cell'] === null ? '' : d['Cell']).trim(), 10);
        const cellValue = (isFinite(cellNum) && cellNum > 0) ? cellNum : null;

        // Force all nodes to start without grid coordinates. 
        // Ignores the spreadsheet entirely.
        const hasGridCoords = false;
        const gridX = 0;
        const gridY = 0;

        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        const x = Math.random() * cw;
        const y = Math.random() * ch;
        
        return {
        id, 
        name: id, 
        raw: d, 
        cellValue,
        cellIdx: null,
        manualInCell: false,
        order: i,            // sheet row order, drives spacing order in a cell
        hasGridCoords,
        gridX,
        gridY,
        image: d['Image'] ? d['Image'].trim() : null, 
        imageBitmap: null,
        customColor: parseHexColor(d['Custom Node Color']),
        innerLabel: parseInnerLabel(d['Inner Node Label']),
        x, 
        y,
        fx: null,
        fy: null,
        vx: 0, 
        vy: 0, 
        baseR: formattingSettings.minNodeSize,
        r: formattingSettings.minNodeSize
        };
    }

  // A bare node for a name that appears in Connections but not in Entities:
  // no description, category or image, placed at random for physics.
  function makeLinkOnlyNode(name) {
    return {
      id: name,
      name: name,
      raw: {},
      cellValue: null,
      cellIdx: null,
      manualInCell: false,
      order: 100000 + nodes.length,
      hasGridCoords: false,
      gridX: 0,
      gridY: 0,
      image: null,
      imageBitmap: null,
      x: Math.random() * (canvas.width / devicePixelRatio),
      y: Math.random() * (canvas.height / devicePixelRatio),
      fx: null,
      fy: null,
      vx: 0,
      vy: 0,
      baseR: formattingSettings.minNodeSize,
      r: formattingSettings.minNodeSize
    };
  }

  function processLinksData(connectionsData) {
    _lineSizeRange = null; // Reset line sizing cache
    const tmpLinks = connectionsData.map(r => {
      const rawValue = (r['Value']||'').toString().trim().replace(/[, ]/g, '');
      const parsedValue = parseFloat(rawValue);
      return {
        sourceName: (r['A']||'').toString().trim(),
        targetName: (r['B']||'').toString().trim(),
        connectionValue: !isNaN(parsedValue) ? parsedValue : null,
        source: (r['Source']||'').toString().trim(),
        note: (r['Note']||'').toString().trim(),
        text: (r['Text']||'').toString().trim()
      };
    }).filter(l => l.sourceName && l.targetName);

    // Add missing nodes from links (names in A/B with no Entities row)
    tmpLinks.forEach(l => {
      [l.sourceName, l.targetName].forEach(name => {
        if (nodeById.has(name)) return;
        const n = makeLinkOnlyNode(name);
        nodes.push(n);
        nodeById.set(n.id, n);
      });
    });

    // Build links with references to node objects
    links = tmpLinks.map(l => ({
      source: nodeById.get(l.sourceName),
      target: nodeById.get(l.targetName),
      connectionValue: l.connectionValue,
      sourceUrl: l.source,
      note: l.note,
      text: l.text
    })).filter(l => l.source && l.target);
  }

  function buildEntityViewsMap(entitiesData) {
    entityViewsMap.clear();
    entityHighlightsMap.clear();
    
    entitiesData.forEach(row => {
      const entityName = String(row['Entity Name'] || '').trim();
      const viewsStr = String(row['Views'] || '').trim();
      const highlightStr = String(row['View Highlight'] || '').trim();
      
      if (entityName && viewsStr) {
        const viewIds = viewsStr.split(',').map(id => id.trim()).filter(id => id);
        entityViewsMap.set(entityName, viewIds);
      }
      
      if (entityName && highlightStr) {
        const highlightViewIds = highlightStr.split(',').map(id => id.trim()).filter(id => id);
        entityHighlightsMap.set(entityName, new Set(highlightViewIds));
      }
    });
  }

  function buildViewEntitiesCache() {
    viewEntitiesCache.clear();
    
    // Initialize cache for all views
    sortedViewIds.forEach(viewId => {
      viewEntitiesCache.set(viewId, []);
    });

    // Populate cache
    entityViewsMap.forEach((viewIds, entityId) => {
      // Entities hidden by the connection filter are left out of every view.
      if (!nodeById.has(entityId)) return;
      viewIds.forEach(viewId => {
        // Only add if view exists in viewsById
        if (viewsById.has(viewId)) {
          const entityList = viewEntitiesCache.get(viewId);
          if (entityList) {
            entityList.push(entityId);
          }
        }
      });
    });
  }

  function updateStoryButtonVisibility() {
    const shouldShow = viewsData.length > 0 && hasViewsColumn;
    storyBtn.style.display = shouldShow ? 'block' : 'none';
  }

  /************************************************************************
   * CONNECTION FILTER — "Hide nodes with N or less connections"
   * Connections are counted on the full data (distinct entities linked to,
   * either direction — the same count as the "# of connections" size mode).
   * Entities at or below the threshold are dropped from `nodes`, and every
   * connection touching them is dropped from `links`.
   ************************************************************************/
  function hideConnectionThreshold() {
    const v = formattingSettings.hideMaxConnections;
    if (v === null || v === undefined || String(v).trim() === '') return null;
    const n = Math.floor(Number(v));
    return (isFinite(n) && n >= 0) ? n : null;
  }

  function applyConnectionFilter() {
    const max = hideConnectionThreshold();
    if (max == null) {
      nodes = allNodes.slice();
      links = allLinks.slice();
    } else {
      const nbrs = new Map();
      allLinks.forEach(l => {
        const s = l.source.id, t = l.target.id;
        if (!nbrs.has(s)) nbrs.set(s, new Set());
        if (!nbrs.has(t)) nbrs.set(t, new Set());
        nbrs.get(s).add(t);
        nbrs.get(t).add(s);
      });
      const keep = new Set();
      allNodes.forEach(n => {
        const deg = nbrs.has(n.id) ? nbrs.get(n.id).size : 0;
        if (deg > max) keep.add(n.id);
      });
      nodes = allNodes.filter(n => keep.has(n.id));
      links = allLinks.filter(l => keep.has(l.source.id) && keep.has(l.target.id));
    }
    nodeById = new Map(nodes.map(n => [n.id, n]));
    nameIndex = nodes.map(n => n.name);
    _lineSizeRange = null;
    buildAdjacency();
    computeConnectionValueTotals();
    if (hasViewsColumn) buildViewEntitiesCache();
  }

  // Live change from the Options menu: re-filter and re-lay out in place.
  // Surviving nodes keep their current positions; newly revealed ones are
  // placed by physics (or by their saved position / cell).
  function setHideMaxConnections(v) {
    formattingSettings.hideMaxConnections = v;
    if (!allNodes.length) return;
    applyConnectionFilter();
    if (selectedNode && !nodeById.has(selectedNode.id)) {
      selectedNode = null;
      if (isStoryMode) hideEntityModal(); else clearInfoPanel();
    }
    if (hoveredNode && !nodeById.has(hoveredNode.id)) hoveredNode = null;
    hoveredConnection = null;
    updateNodeSizes();
    updateCategoryColors();
    updateLegend();
    updateShapeLegend();
    updateCellAssignments();
    computeGridLayout();
    updatePhysics();
    if (selectedNode && !isStoryMode) populateInfoPanel(selectedNode);
    render();
  }

  function buildAdjacency() {
    adjacency.clear();
    connectionSources.clear();
    connectionTexts.clear();
    
    links.forEach(l => {
      const sId = l.source.id;
      const tId = l.target.id;
      
      if (!adjacency.has(sId)) adjacency.set(sId, new Set());
      if (!adjacency.has(tId)) adjacency.set(tId, new Set());
      adjacency.get(sId).add(tId);
      adjacency.get(tId).add(sId);
      
      // Track source URLs for connections
      if (l.sourceUrl) {
        if (!connectionSources.has(sId)) connectionSources.set(sId, new Map());
        if (!connectionSources.has(tId)) connectionSources.set(tId, new Map());
        connectionSources.get(sId).set(tId, l.sourceUrl);
        connectionSources.get(tId).set(sId, l.sourceUrl);
      }
      
      // Track text descriptions for connections
      if (l.text) {
        if (!connectionTexts.has(sId)) connectionTexts.set(sId, new Map());
        if (!connectionTexts.has(tId)) connectionTexts.set(tId, new Map());
        connectionTexts.get(sId).set(tId, l.text);
        connectionTexts.get(tId).set(sId, l.text);
      }
    });
  }

  function computeConnectionValueTotals() {
    connectionOutTotals.clear();
    connectionInTotals.clear();
    links.forEach(l => {
      const sId = l.source.id;
      const tId = l.target.id;
      const val = l.connectionValue;
      if (val != null && !isNaN(val)) {
        connectionOutTotals.set(sId, (connectionOutTotals.get(sId) || 0) + val);
        connectionInTotals.set(tId, (connectionInTotals.get(tId) || 0) + val);
      }
    });
  }

  function loadBackgroundImage() {
    if (formattingSettings.backgroundImageEnabled && formattingSettings.backgroundImageUrl) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => { backgroundImageObj = img; render(); };
      img.onerror = () => { backgroundImageObj = null; };
      img.src = formattingSettings.backgroundImageUrl;
    } else {
      backgroundImageObj = null;
    }
  }

  function updateLogoFromSettings() {
    const logoEl = document.getElementById('logo');
    const logoImg = logoEl ? logoEl.querySelector('img') : null;
    if (!formattingSettings.logoEnabled) {
      if (logoEl) logoEl.style.display = 'none';
    } else {
      if (logoEl) logoEl.style.display = 'block';
      if (logoImg && formattingSettings.logoUrl) logoImg.src = formattingSettings.logoUrl;
    }
  }

  function updateTitleFromSettings() {
    const titleEl = document.getElementById('chart-title');
    const subtitleEl = document.getElementById('chart-subtitle');
    if (titleEl) {
      titleEl.style.display = formattingSettings.chartTitleEnabled && formattingSettings.chartTitle ? 'block' : 'none';
      titleEl.textContent = formattingSettings.chartTitle || '';
    }
    if (subtitleEl) {
      subtitleEl.style.display = formattingSettings.chartSubtitleEnabled && formattingSettings.chartSubtitle ? 'block' : 'none';
      subtitleEl.textContent = formattingSettings.chartSubtitle || '';
    }
  }

  function updateShareFromSettings() {
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
      shareBtn.style.display = formattingSettings.sharingEnabled ? 'flex' : 'none';
    }
  }

  function updateInfoPanelVisibility() {
    const panel = document.getElementById('info-panel');
    if (!panel) return;
    if (formattingSettings.infoPanelOn) {
      const isMobile = window.matchMedia('(max-width: 700px)').matches;
      panel.style.display = isMobile ? 'grid' : 'flex';
    } else {
      panel.style.display = 'none';
    }
    // The canvas is refitted by relayout() when the chart area changes size.
  }

  /************************************************************************
   * STORY MODE
   ************************************************************************/
  function enterStoryMode() {
    if (sortedViewIds.length === 0) return;
    
    isStoryMode = true;
    currentViewIndex = 0;
    
    // Clear selection
    selectedNode = null;
    clearInfoPanel();
    
    // Hide normal UI elements
    storyBtn.style.display = 'none';
    nodeInfo.style.display = 'none';
    document.getElementById('node-links').style.display = 'none';
    connectionsBox.style.display = 'none';
    
    // Hide search controls (incl. the Clear button) in story mode
    document.getElementById('controls').classList.add('story-mode-hide');
    
    // Show story UI elements
    storyNavContainer.classList.add('active');
    viewContent.classList.add('active');
    
    // Display current view
    updateStoryModeUI();
    
    // Animate pan & zoom to first view's nodes
    animateToViewNodes();
  }

  function exitStoryMode() {
    isStoryMode = false;
    
    // Clear selection
    selectedNode = null;
    hideEntityModal();
    
    // Reset zoom and pan
    zoomLevel = 1.0;
    panX = 0;
    panY = 0;
    
    // Show normal UI elements
    updateStoryButtonVisibility();
    nodeInfo.style.display = 'block';
    document.getElementById('node-links').style.display = 'block';
    connectionsBox.style.display = 'block';
    
    // Show search controls (incl. the Clear button) when exiting story mode
    document.getElementById('controls').classList.remove('story-mode-hide');
    
    // Hide story UI elements
    storyNavContainer.classList.remove('active');
    viewContent.classList.remove('active');
    
    // Clear info panel
    clearInfoPanel();
    render();
  }

  function navigateView(direction) {
    if (direction === 'prev' && currentViewIndex > 0) {
      currentViewIndex--;
    } else if (direction === 'next' && currentViewIndex < sortedViewIds.length - 1) {
      currentViewIndex++;
    }
    
    // Clear selection and hide modal when navigating
    selectedNode = null;
    hideEntityModal();
    
    updateStoryModeUI();
    
    // Animate pan & zoom to focus on current view nodes
    animateToViewNodes();
  }
  
  function animateToViewNodes() {
    const viewId = sortedViewIds[currentViewIndex];
    const viewEntities = new Set(viewEntitiesCache.get(viewId) || []);
    
    // Filter nodes in current view
    const viewNodes = nodes.filter(n => viewEntities.has(n.id));
    
    if (viewNodes.length === 0) {
      render();
      return;
    }
    
    // Calculate bounding box of view nodes including their radii
    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;
    
    viewNodes.forEach(n => {
      const radius = n.r || 15; // Use actual node radius
      minX = Math.min(minX, n.x - radius);
      maxX = Math.max(maxX, n.x + radius);
      minY = Math.min(minY, n.y - radius);
      maxY = Math.max(maxY, n.y + radius);
    });
    
    const width = maxX - minX;
    const height = maxY - minY;
    const dataCenterX = (minX + maxX) / 2;
    const dataCenterY = (minY + maxY) / 2;
    
    // Calculate target zoom to fit all nodes with padding
    const canvasWidth = canvas.width / devicePixelRatio;
    const canvasHeight = canvas.height / devicePixelRatio;
    const canvasCenterX = canvasWidth / 2;
    
    // In Story Mode, account for legend space at top
    const legendSpace = 50; // Legend height + margin
    const effectiveHeight = canvasHeight - legendSpace;
    const canvasCenterY = legendSpace + (effectiveHeight / 2); // Shift center down
    
    const padding = 70; // padding in pixels
    
    const targetZoomX = width > 0 ? (canvasWidth - padding * 2) / width : 1.5;
    const targetZoomY = height > 0 ? (effectiveHeight - padding * 2) / height : 1.5;
    let targetZoom = Math.min(targetZoomX, targetZoomY);
    
    // Clamp zoom to configured limits
    targetZoom = Math.max(CONFIG.zoomMin, Math.min(CONFIG.zoomMax, targetZoom));
    
    // Calculate target pan to center the nodes
    // Based on the transform: screen = (data - canvasCenter) * zoom + pan + canvasCenter
    // To center data at canvasCenter: pan = -(data - canvasCenter) * zoom
    const targetPanX = -(dataCenterX - canvasCenterX) * targetZoom;
    const targetPanY = -(dataCenterY - canvasCenterY) * targetZoom;
    
    // Store starting values
    const startZoom = zoomLevel;
    const startPanX = panX;
    const startPanY = panY;
    
    // Animation parameters
    const duration = 600; // milliseconds
    const startTime = Date.now();
    
    function animate() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(elapsed / duration, 1);
      
      // Ease-in-out function for smooth animation
      const eased = progress < 0.5 
        ? 2 * progress * progress 
        : 1 - Math.pow(-2 * progress + 2, 2) / 2;
      
      // Interpolate zoom and pan
      zoomLevel = startZoom + (targetZoom - startZoom) * eased;
      panX = startPanX + (targetPanX - startPanX) * eased;
      panY = startPanY + (targetPanY - startPanY) * eased;
      
      render();
      
      if (progress < 1) {
        requestAnimationFrame(animate);
      }
    }
    
    animate();
  }

  function updateStoryModeUI() {
    const viewId = sortedViewIds[currentViewIndex];
    const view = viewsById.get(viewId);
    
    if (!view) return;
    
    // Update progress
    viewProgress.textContent = `Page ${currentViewIndex + 1} of ${sortedViewIds.length}`;
    
    // Update title
    viewTitle.textContent = view.title;
    
    // Update image
    if (view.image) {
      viewImage.src = view.image;
      viewImage.style.display = 'block';
    } else {
      viewImage.style.display = 'none';
    }
    
    // Update text
    viewText.innerHTML = processHtmlLinks(view.text);
    
    // Update navigation buttons
    storyPrevBtn.disabled = currentViewIndex === 0;
    storyNextBtn.disabled = currentViewIndex === sortedViewIds.length - 1;
  }

  function showEntityModal(node) {
    entityModal.classList.add('active');
    populateEntityModal(node);
  }

  function hideEntityModal() {
    entityModal.classList.remove('active');
    selectedNode = null;
  }

  function populateEntityModal(d) {
    const desc = (d.raw && (d.raw['Description'] || '')) || '';
    const colorCat = (d.raw && (d.raw['Color Legend Category'] || '')) || '';

    // Build category/value summary for modal
    let catHtml = '';
    if (formattingSettings.showColorLegendCategoryName && colorCat) {
      const title = formattingSettings.colorLegendCategoryTitle || 'Category';
      catHtml = `<div style="font-size: 16px; font-weight: 600; margin-top: 6px;">${title}: ${colorCat}</div>`;
    }
    
    const valHtml = nodeTotalsHtml(d);

    entityModalTitle.html(`
      <div style="display:flex; align-items:center; gap:8px; font-size:24px; font-weight:600;">
        <span>${d.name}</span>
        ${d.image ? `<img src="${d.image}" style="width:40px; height:40px; object-fit:cover; border-radius:50%;">` : ''}
      </div>
      ${catHtml}
      ${valHtml}
      ${desc ? `<div style="font-size: 14px; font-weight: normal; max-height: 350px; overflow-y: auto; margin-top: 6px;">${processHtmlLinks(desc.replace(/\n/g, '<br>'))}</div>` : ''}

    `);

    // Get current view's entities for filtering connections
    const currentViewId = sortedViewIds[currentViewIndex];
    const currentViewEntities = new Set(viewEntitiesCache.get(currentViewId) || []);

    const conns = Array.from(adjacency.get(d.id) || []).slice();
    
    // Filter connections to only show those in current view
    const filteredConns = conns.filter(name => currentViewEntities.has(name));
    
    filteredConns.sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'}));
    entityModalConnections.innerHTML = '';
    
    if (filteredConns.length === 0) {
      entityModalConnections.innerHTML = '<div class="muted" style="margin-top: 8px;">No connections in this view</div>';
      return;
    }
    
    const connBox = document.createElement('div');
    connBox.style.marginTop = '8px';
    connBox.style.background = 'var(--surface)';
    connBox.style.borderRadius = '10px';
    connBox.style.padding = '6px';
    connBox.style.border = '1px solid var(--line)';
    connBox.style.maxHeight = '300px';
    connBox.style.overflow = 'auto';
    
    connBox.appendChild(buildConnectionItems(d, filteredConns, targetNode => {
      selectedNode = targetNode;
      populateEntityModal(targetNode);
      render();
    }));
    entityModalConnections.appendChild(connBox);
  }

  /************************************************************************
   * IMAGE LOADING
   ************************************************************************/
  function loadAllImages() {
    // A Custom Node Color or Inner Node Label replaces the image inside the
    // node, so those images are never drawn and don't need loading.
    const imgNodes = nodes.filter(n => n.image && CONFIG.showImages && !nodeOverridesImage(n));
    Promise.allSettled(imgNodes.map(n => loadImage(n))).then(() => render());
  }

  function loadImage(node) {
    return new Promise(resolve => {
      // Request a CORS-clean image FIRST. Drawing a non-CORS image onto the
      // canvas taints it and permanently blocks toDataURL()/PNG export, so we
      // only fall back to a plain (tainting) load if the host refuses CORS.
      const corsImg = new Image();
      corsImg.crossOrigin = 'anonymous';
      corsImg.onload = () => {
        node.imageBitmap = corsImg;
        resolve();
      };
      corsImg.onerror = () => {
        // Host didn't allow cross-origin use. Load normally so the image still
        // displays on screen (note: this taints the canvas, disabling PNG export).
        const plainImg = new Image();
        plainImg.onload = () => { node.imageBitmap = plainImg; resolve(); };
        plainImg.onerror = () => { node.imageBitmap = null; resolve(); };
        plainImg.src = node.image;
      };
      corsImg.src = node.image;
    });
  }

  /************************************************************************
   * PRELOAD STORY MODE VIEW IMAGES
   ************************************************************************/
  const storyImageCache = new Map();

  function preloadStoryImages() {
    viewsData.forEach(v => {
      if (v.image && !storyImageCache.has(v.image)) {
        const img = new Image();
        img.src = v.image;
        storyImageCache.set(v.image, img);
      }
    });
  }


  /************************************************************************
   * CELLS
   * Divides the 60x60 chart grid into cells. Nodes carrying a "Cell" value
   * in the Entities sheet are auto-spaced inside their cell with physics
   * off, can be dragged only within that cell, and re-space when one of
   * them is placed manually or released.
   *
   * Cell geometry is always expressed in GRID units (y up, origin centre).
   ************************************************************************/
  const CELL_GRID_HALF = CONFIG.gridUnits / 2;   // 30

  // Configurations available per cell count (mirrors the L Structure sheet).
  const CELL_CONFIGS = {
    1:  [{ label: 'Single cell',                 spec: { type: 'rows',  rows: [1] } }],
    2:  [{ label: '2 across',                    spec: { type: 'rows',  rows: [2] } },
         { label: '2 stacked',                   spec: { type: 'rows',  rows: [1, 1] } },
         { label: 'Inner + outer ring',          spec: { type: 'rings', n: 2 } }],
    3:  [{ label: '3 across',                    spec: { type: 'rows',  rows: [3] } },
         { label: '2 over 1',                    spec: { type: 'rows',  rows: [2, 1] } },
         { label: '1 over 2',                    spec: { type: 'rows',  rows: [1, 2] } },
         { label: 'Inner + middle + outer ring', spec: { type: 'rings', n: 3 } }],
    4:  [{ label: '2 x 2',                       spec: { type: 'rows',  rows: [2, 2] } }],
    5:  [{ label: '3 over 2',                    spec: { type: 'rows',  rows: [3, 2] } },
         { label: '2 over 3',                    spec: { type: 'rows',  rows: [2, 3] } }],
    6:  [{ label: '3 across x 2 rows',           spec: { type: 'rows',  rows: [3, 3] } },
         { label: '2 across x 3 rows',           spec: { type: 'rows',  rows: [2, 2, 2] } }],
    7:  [{ label: '4 over 3',                    spec: { type: 'rows',  rows: [4, 3] } },
