      const bIsSelected = selectedNode && (b.source === selectedNode || b.target === selectedNode);
      const aIsHovered = hoveredNode && (a.source === hoveredNode || a.target === hoveredNode);
      const bIsHovered = hoveredNode && (b.source === hoveredNode || b.target === hoveredNode);
      
      // Calculate priority (higher number = drawn later = appears on top)
      const aPriority = (aIsSelected ? 2 : 0) + (aIsHovered ? 1 : 0);
      const bPriority = (bIsSelected ? 2 : 0) + (bIsHovered ? 1 : 0);
      
      return aPriority - bPriority; // Draw lower priority first
    });
    
    if (selectedNode) {
      sortedLinks.forEach(l => {
        if (highlightedSet.has(l.source.id) && highlightedSet.has(l.target.id)) {
          const bothActive = isNodeCategoryActive(l.source) && isNodeCategoryActive(l.target);
          const opacity = bothActive ? CONFIG.linkOpacitySelected : CONFIG.unconnectedOpacity;
          drawLink(l, opacity);
        }
      });
    } else {
      sortedLinks.forEach(l => {
        const bothActive = isNodeCategoryActive(l.source) && isNodeCategoryActive(l.target);
        const opacity = bothActive ? CONFIG.linkOpacityNoSelection : CONFIG.unconnectedOpacity;
        drawLink(l, opacity);
      });
    }

    // Draw highlighted nodes on top
    highlightedNodes.forEach(n => drawNode(n, CONFIG.pointOpacity, CONFIG.showImages && !simLite, !simLite));

    // Draw labels based on showNodeLabels setting
    if (simLite) {
      // labels are suppressed while the layout is still moving
    } else if (formattingSettings.showNodeLabels === 'always') {
      // A legend filter narrows 'always' down to the categories that are lit:
      // dimmed nodes lose their labels along with their colour. The node under
      // the cursor is still labelled, so dimmed nodes can be identified.
      const legendFiltering = colorFilterActive || shapeFilterActive;
      if (selectedNode) {
        // A selection narrows 'always' down to the selected node and its
        // connections, plus whatever is under the cursor.
        const nbrs = adjacency.get(selectedNode.id) || new Set();
        nodes.forEach(n => {
          if (n !== selectedNode && !nbrs.has(n.id)) return;
          if (legendFiltering && n !== selectedNode && !isNodeCategoryActive(n)) return;
          drawLabel(n);
        });
        if (hoveredNode && hoveredNode !== selectedNode && !nbrs.has(hoveredNode.id)) drawLabel(hoveredNode);
      } else if (legendFiltering) {
        highlightedNodes.forEach(n => drawLabel(n));
        if (hoveredNode && !highlightedSet.has(hoveredNode.id)) drawLabel(hoveredNode);
      } else {
        highlightedNodes.forEach(n => drawLabel(n));
        unhighlightedNodes.forEach(n => drawLabel(n));
      }
    } else {
      // Default 'hover' mode: labels on the selection and its connections,
      // plus the hovered node and its connections. Each label is drawn once.
      const labelled = new Set();
      const labelOnce = n => { if (n && !labelled.has(n)) { labelled.add(n); drawLabel(n); } };

      if (selectedNode) {
        const selNbrs = adjacency.get(selectedNode.id) || new Set();
        highlightedNodes.forEach(n => {
          if (n === selectedNode || selNbrs.has(n.id)) labelOnce(n);
        });
      }

      if (hoveredNode) {
        // Nodes connected to the hovered one. Follows only the lines on
        // screen (story mode narrows these to the current view) and skips
        // nodes dimmed by a selection or a legend filter.
        visibleLinks.forEach(l => {
          const other = l.source === hoveredNode ? l.target
                      : l.target === hoveredNode ? l.source : null;
          if (other && highlightedSet.has(other.id)) labelOnce(other);
        });
        labelOnce(hoveredNode);
      }
    }

    // Cell titles always sit on top of nodes, lines and labels
    drawCellTitles();

    ctx.restore();
    
    // Schedule next animation frame only if a node is selected (for glow animation)
    if (selectedNode && !animationScheduled) {
      animationScheduled = true;
      setTimeout(() => {
        animationScheduled = false;
        requestAnimationFrame(render);
      }, 50); // ~20 FPS for smooth animation with less CPU usage
    }
  }

  /************************************************************************
   * INTERACTION HELPERS
   ************************************************************************/
  function getCanvasPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * (canvas.width / (devicePixelRatio)) / rect.width;
    const y = (evt.clientY - rect.top) * (canvas.height / (devicePixelRatio)) / rect.height;
    
    const centerX = (canvas.width/(devicePixelRatio)) / 2;
    const centerY = (canvas.height/(devicePixelRatio)) / 2;
    
    const transformedX = (x - centerX - panX) / zoomLevel + centerX;
    const transformedY = (y - centerY - panY) / zoomLevel + centerY;
    
    return { x: transformedX, y: transformedY };
  }

  function findNodeAtPos(x, y) {
    if (!nodes || nodes.length === 0) return null;

    if (selectedNode) {
      const activeSet = new Set([selectedNode.id, ...(adjacency.get(selectedNode.id) || [])]);
      const activeNodes = nodes.filter(n => activeSet.has(n.id));
      for (let i = activeNodes.length - 1; i >= 0; i--) {
        const n = activeNodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
      const otherNodes = nodes.filter(n => !activeSet.has(n.id));
      for (let i = otherNodes.length - 1; i >= 0; i--) {
        const n = otherNodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
    } else {
      for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        if (Math.hypot(n.x - x, n.y - y) <= n.r) return n;
      }
    }
    return null;
  }

  function updateCanvasCursor() {
    if (isDragging) {
      canvas.style.cursor = 'grabbing';
    } else if (zoomLevel > 1.0) {
      canvas.style.cursor = 'grab';
    } else {
      canvas.style.cursor = 'default';
    }
  }

  /************************************************************************
   * CANVAS EVENT LISTENERS
   ************************************************************************/
  canvas.addEventListener('mousedown', (evt) => {
    if (evt.button !== 0) return;
    if (AUTH && AUTH.onDown(evt)) return; // authoring drag took over

    didDrag = false;

    if (zoomLevel > 1.0) {
      // Panning canvas
      isDragging = true;
      dragStartX = evt.clientX;
      dragStartY = evt.clientY;
      dragStartPanX = panX;
      dragStartPanY = panY;
      updateCanvasCursor();
      evt.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', (evt) => {
    if (AUTH && AUTH.onMove(evt)) return; // authoring drag took over

    if (isDragging && zoomLevel > 1.0) {
      didDrag = true;
      const deltaX = evt.clientX - dragStartX;
      const deltaY = evt.clientY - dragStartY;
      panX = dragStartPanX + deltaX / zoomLevel;
      panY = dragStartPanY + deltaY / zoomLevel;
      render();
      evt.preventDefault();
    } else {
      // Hover effect
      const pos = getCanvasPos(evt);
      const n = findNodeAtPos(pos.x, pos.y);
      if (n !== hoveredNode) {
        hoveredNode = n;
        render();
      }
      if (AUTH && !isStoryMode) {
        canvas.style.cursor = n ? 'grab' : (zoomLevel > 1.0 ? 'grab' : 'default');
      }
    }
  });

  canvas.addEventListener('mouseup', (evt) => {
    if (AUTH && AUTH.onUp(evt)) return; // authoring drag took over

    if (isDragging) {
      // End the pan. Selecting/deselecting is left to the click handler,
      // which fires next and ignores the click if the pointer dragged.
      isDragging = false;
      updateCanvasCursor();
      evt.preventDefault();
    }
  });

  canvas.addEventListener('click', (evt) => {
    if (didDrag) {
      didDrag = false;
      evt.preventDefault();
      return;
    }
    if (isDragging) return;
    const pos = getCanvasPos(evt);
    const n = findNodeAtPos(pos.x, pos.y);
    if (n) {
      selectedNode = n;
      if (isStoryMode) {
        showEntityModal(n);
      } else {
        populateInfoPanel(n);
      }
      render();
    } else {
      selectedNode = null;
      hoveredConnection = null;
      if (isStoryMode) {
        hideEntityModal();
      } else {
        clearInfoPanel();
      }
      render();
    }
  });

  canvas.addEventListener('mouseleave', (evt) => {
    isDragging = false;
    didDrag = false;
    updateCanvasCursor();
    if (hoveredNode) {
      hoveredNode = null;
      render();
    }
  });

  canvas.addEventListener('wheel', (evt) => {
    evt.preventDefault();
    if (evt.deltaY < 0) {
      zoomIn();
    } else {
      zoomOut();
    }
  });

  /************************************************************************
   * ZOOM CONTROLS
   ************************************************************************/
  function zoomIn() {
    zoomLevel = Math.min(CONFIG.zoomMax, zoomLevel + CONFIG.zoomStep);
    updateCanvasCursor();
    render();
  }
  
  function zoomOut() {
    zoomLevel = Math.max(CONFIG.zoomMin, zoomLevel - CONFIG.zoomStep);
    updateCanvasCursor();
    render();
  }
  
  function resetZoom() {
    zoomLevel = 0.9;
    panX = 0;
    panY = 0;
    relayout();
    updateCanvasCursor();
  }

  zoomInBtn.addEventListener('click', zoomIn);
  zoomOutBtn.addEventListener('click', zoomOut);
  zoomResetBtn.addEventListener('click', resetZoom);

  /************************************************************************
   * FULLSCREEN FUNCTIONALITY
   ************************************************************************/
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      // Enter fullscreen
      const element = document.documentElement; // or document.getElementById('wrap') for just the tool
      if (element.requestFullscreen) {
        element.requestFullscreen().catch(err => {
        });
      } else if (element.webkitRequestFullscreen) { // Safari
        element.webkitRequestFullscreen();
      }
    } else {
      // Exit fullscreen
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) { // Safari
        document.webkitExitFullscreen();
      }
    }
  }

  function updateFullscreenButton() {
    if (document.fullscreenElement) {
      fullscreenBtn.innerHTML = '◱'; // Exit fullscreen icon
      fullscreenBtn.title = 'Exit Fullscreen';
    } else {
      fullscreenBtn.innerHTML = '⌜⌟'; // Enter fullscreen icon
      fullscreenBtn.title = 'Enter Fullscreen';
    }
    // The canvas is refitted by relayout() when the chart area changes size.
  }

  fullscreenBtn.addEventListener('click', toggleFullscreen);

  // Share button - copies sharing URL to clipboard
  const shareBtn = document.getElementById('share-btn');
  shareBtn.addEventListener('click', () => {
    const url = formattingSettings.sharingUrl;
    if (!url) return;
    const fullUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    copyToClipboard(fullUrl, () => {
      const origText = shareBtn.innerHTML;
      shareBtn.innerHTML = '✓';
      setTimeout(() => { shareBtn.innerHTML = origText; }, 1500);
    });
  });

  // Copy text to the clipboard (shared by the mapper and the table), falling
  // back to a hidden textarea where the Clipboard API is missing or refused.
  function copyToClipboard(text, onCopied) {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy');
      document.body.removeChild(ta);
      onCopied();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(onCopied, fallback);
    else fallback();
  }

  
  // Update button when fullscreen state changes (including when user presses ESC)
  document.addEventListener('fullscreenchange', updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButton); // Safari


  /************************************************************************
   * INFO PANEL
   ************************************************************************/
  function normalizeUrl(u) {
    if (!u) return null;
    const s = String(u).trim();
    if (s === '') return null;
    if (/^[a-zA-Z][a-zA-Z0-9+\-.]*:\/\//.test(s)) return s;
    return 'https://' + s.replace(/^[\/]+/, '');
  }

  function processHtmlLinks(html) {
    if (!html) return html;
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const links = temp.querySelectorAll('a');
    links.forEach(link => {
      if (!link.hasAttribute('target')) {
        link.setAttribute('target', '_blank');
      }
      if (!link.hasAttribute('rel')) {
        link.setAttribute('rel', 'noopener');
      }
    });
    return temp.innerHTML;
  }

  // Total IN / OUT lines shared by the info panel and the story-mode modal.
  function nodeTotalsHtml(d) {
    const fs = formattingSettings;
    let html = '';
    const line = (title, total) => `<div style="font-size:14px;margin-top:4px;"><b>${title}:</b> ${formatValue(total, fs.connectionValuePrefix)}</div>`;
    if (fs.showTotalInValue) {
      const totalIn = connectionInTotals.get(d.id) || 0;
      if (totalIn > 0) html += line(fs.totalInTitle, totalIn);
    }
    if (fs.showTotalOutValue) {
      const totalOut = connectionOutTotals.get(d.id) || 0;
      if (totalOut > 0) html += line(fs.totalOutTitle, totalOut);
    }
    return html;
  }

  // Connection rows for node d (one per name in `names`), shared by the info
  // panel and the story-mode modal. Each row shows the connection's Text (or
  // the other node's name), an optional source link, highlights the line on
  // hover, and calls onPick(otherNode) when clicked.
  function buildConnectionItems(d, names, onPick) {
    const frag = document.createDocumentFragment();
    const nodeSourceMap = connectionSources.get(d.id);
    const nodeTextsMap = connectionTexts.get(d.id);
    names.forEach(name => {
      const item = document.createElement('div');
      item.className = 'conn-item';
      item.style.display = 'flex';
      item.style.alignItems = 'center';
      item.style.justifyContent = 'space-between';
      item.style.gap = '8px';

      const nameSpan = document.createElement('span');
      const textDesc = nodeTextsMap ? nodeTextsMap.get(name) : null;
      nameSpan.innerHTML = processHtmlLinks(textDesc || name);
      nameSpan.style.flex = '1';
      nameSpan.style.cursor = 'pointer';
      nameSpan.addEventListener('click', () => {
        const targetNode = nodeById.get(name);
        if (targetNode) onPick(targetNode);
      });
      item.appendChild(nameSpan);

      const sourceUrl = nodeSourceMap ? nodeSourceMap.get(name) : null;
      if (sourceUrl) {
        const sourceIcon = document.createElement('a');
        sourceIcon.href = normalizeUrl(sourceUrl) || '#';
        sourceIcon.target = '_blank';
        sourceIcon.rel = 'noopener';
        sourceIcon.innerHTML = '➜]';
        sourceIcon.style.fontSize = '16px';
        sourceIcon.style.textDecoration = 'none';
        sourceIcon.style.cursor = 'pointer';
        sourceIcon.style.flexShrink = '0';
        sourceIcon.title = 'Source';
        sourceIcon.addEventListener('click', (e) => e.stopPropagation());
        item.appendChild(sourceIcon);
      }

      // Highlight the connection in the chart while hovered
      item.addEventListener('mouseenter', () => {
        hoveredConnection = { source: d.id, target: name };
        render();
      });
      item.addEventListener('mouseleave', () => {
        hoveredConnection = null;
        render();
      });
      frag.appendChild(item);
    });
    return frag;
  }

  function populateInfoPanel(d) {

        sumCells[c] = hasActiveFilters() ? 'FILTER APPLIED' : 'ALL';
      } else {
        const uniqueCount = new Set(groupRows.map(r => String(r[c]).trim())).size;
        sumCells[c] = hasActiveFilters() ? `FILTERED (${uniqueCount})` : `ALL (${uniqueCount})`;
      }
    });
    ni.forEach(c => {
      const vs = groupRows.map(r => parseNum(r[c])).filter(v => !isNaN(v));
      if (vs.length) {
        const agg = S.aggregationMode === 'AVG' ? vs.reduce((a, b) => a + b, 0) / vs.length : vs.reduce((a, b) => a + b, 0);
        aggValues[c] = agg;
        const sample = groupRows.find(r => r[c] && r[c].trim() !== '');
        sumCells[c] = formatAgg(agg, sample ? sample[c] : '');
      }
    });

    return { key, groupRows, expanded, sumCells, aggValues };
  });

  // 3. Sort groups by sortStack
  const collSet = new Set(ci);
  if (sortStack.length) {
    groups.sort((a, b) => {
      for (const s of sortStack) {
        let cmp = 0;
        if (s.col in a.aggValues || s.col in b.aggValues) {
          const av = a.aggValues[s.col] ?? 0, bv = b.aggValues[s.col] ?? 0;
          cmp = av - bv;
        } else if (collSet.has(s.col) && !numCols.has(s.col)) {
          const extract = v => { const m = String(v).match(/\((\d+)\)$/); return m ? parseInt(m[1]) : 0 };
          cmp = extract(a.sumCells[s.col]) - extract(b.sumCells[s.col]);
        } else {
          cmp = cmpCells(s.col, a.sumCells[s.col], b.sumCells[s.col]);
        }
        if (cmp !== 0) return s.dir === 'asc' ? cmp : -cmp;
      }
      return 0;
    });
  }

  // 4. Build output: each group's summary, then sorted detail rows
  const hasNumeric = ni.length > 0;
  const out = [];
  groups.forEach(g => {
    if (!g.expanded || hasNumeric) {
      out.push({ cells: g.sumCells, type: 'summary', groupKey: g.key, expanded: g.expanded });
    }
    if (g.expanded) {
      // Rows that match on every visible collapsible column (e.g. they only
      // differed in a hidden column) are combined, with numbers re-aggregated.
      const subMap = new Map(), subOrder = [];
      g.groupRows.forEach(row => {
        const k = ci.map(c => row[c] ?? '').join('|||');
        if (!subMap.has(k)) { subMap.set(k, []); subOrder.push(k) }
        subMap.get(k).push(row);
      });
      const combined = subOrder.map(k => {
        const rows = subMap.get(k);
        if (rows.length === 1 || !hasNumeric) return [...rows[0]];
        const cells = [...rows[0]];
        ni.forEach(c => {
          const vs = rows.map(r => parseNum(r[c])).filter(v => !isNaN(v));
          if (!vs.length) { cells[c] = ''; return; }
          const agg = S.aggregationMode === 'AVG' ? vs.reduce((a, b) => a + b, 0) / vs.length : vs.reduce((a, b) => a + b, 0);
          const sample = rows.find(r => r[c] && r[c].trim() !== '');
          cells[c] = formatAgg(agg, sample ? sample[c] : '');
        });
        return cells;
      });
      let first = true;
      sortRows(combined).forEach(cells => {
        const entry = { cells, type: 'detail', groupKey: g.key };
        if (!hasNumeric && first) { entry.needsToggle = true; first = false }
        out.push(entry);
      });
    }
  });
  return out;
}

// Format an aggregated number mimicking the source column's format
function formatAgg(num, sampleVal) {
  const s = String(sampleVal);
  const prefixMatch = s.match(/^([€$£¥₹₽₩])/);
  const prefix = prefixMatch ? prefixMatch[1] : '';
  const dotMatch = s.replace(/[^0-9.]/g, '').match(/\.(\d+)$/);
  const decimals = dotMatch ? dotMatch[1].length : 0;
  const formatted = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  const sign = num < 0 ? '-' : '';
  const label = S.aggregationMode === 'AVG' ? ' (Avg)' : ' (Total)';
  return sign + prefix + formatted + label;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SUPPRESSION & MERGE SPANS
// ═══════════════════════════════════════════════════════════════════════════════

function isAllCell(v) { const s = String(v); return s === 'ALL' || s.startsWith('ALL (') || s === 'FILTER APPLIED' || s.startsWith('FILTERED (') }

function isSuppressed(rows, ri, ci, prevCols) {
  if (ri === 0) return false;
  if (numCols.has(ci)) return false;
  const cur = rows[ri].cells[ci], prev = rows[ri - 1].cells[ci];
  if (isAllCell(cur)) return false;
  if (cur !== prev) return false;
  for (const c of prevCols) { if (rows[ri].cells[c] !== rows[ri - 1].cells[c]) return false }
  return true;
}

function computeMerges(pageRows) {
  const map = pageRows.map(() => headers.map(() => ({ span: 1 })));
  const vis = visibleColIndices();
  for (let vi = 0; vi < vis.length; vi++) {
    const ci = vis[vi];
    if (numCols.has(ci)) continue;
    const prevCols = vis.slice(0, vi);
    let mergeStart = 0;
    for (let ri = 1; ri < pageRows.length; ri++) {
      if (isSuppressed(pageRows, ri, ci, prevCols)) {
        map[ri][ci] = { skip: true };
        map[mergeStart][ci].span++;
      } else {
        mergeStart = ri;
      }
    }
  }
  return map;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════════════════

function renderTable() {
  const app = appEl();
  if (!app) return;
  if (!headers.length) return;
  const rpp = rowsPerPage();
  const allRows = buildView();
  const total = allRows.length;
  const pages = Math.max(1, Math.ceil(total / rpp));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * rpp;
  const end = Math.min(start + rpp, total);
  const pageRows = allRows.slice(start, end);

  const hc = hasColl();
  const hBg = S.headerColor, hTx = txtClr(hBg);
  const tBg = S.tableColor;
  const aBg = S.alternateRowColors ? darken(tBg, .08) : tBg;
  const visCols = visibleColIndices();
  const colCount = visCols.length;
  const toggleW = 32;
  const minColW = 100;
  const totalMinW = (colCount * minColW) + (hc ? toggleW : 0);

  const merges = computeMerges(pageRows);

  let o = '';

  // ── Search bar ──
  o += '<div id="tbl-search-bar">';
  o += '<div class="tbl-search">';
  o += '<svg class="tbl-search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  o += `<input id="tbl-search-input" type="search" placeholder="Search the table…" aria-label="Search the table" autocomplete="off" value="${esc(searchTerm)}" oninput="TBL.onSearch(this.value)" onkeydown="if(event.key==='Escape'){TBL.clearSearch()}">`;
  if (searchTerm) o += '<button class="tbl-search-clear" onclick="TBL.clearSearch()" title="Clear search" aria-label="Clear search">&times;</button>';
  o += '</div></div>';

  // ── Status bar ──
  o += '<div id="status-bar">';
  o += '<div class="left">';
  if (hc) {
    o += '<button class="share-btn" onclick="TBL.expandAll()">Expand all</button>';
    o += '<button class="share-btn" onclick="TBL.collapseAll()">Collapse all</button>';
  }
  const filteredTotal = filterRows(rawRows).length;
  const showing = hasActiveFilters() ? `${filteredTotal.toLocaleString()} of ${rawRows.length.toLocaleString()} rows` :
    `${rawRows.length.toLocaleString()} row${rawRows.length !== 1 ? 's' : ''}`;
  o += `<span>${showing}`;
  if (hc) { const ec = Object.values(groupExpanded).filter(Boolean).length; o += ` &middot; ${ec} group${ec !== 1 ? 's' : ''} expanded` }
  o += '</span></div>';

  o += '<div class="right">';
  const rightParts = [];
  if (S.shareLink) rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.copyShare(this)" title="Copy link to clipboard">Share</a>`);
  rightParts.push(`<a class="source-link" href="javascript:void(0)" onclick="TBL.downloadCSV()">Download data</a>`);
  if (S.sourceText) {
    let src = '<span class="source-label">Source:</span>';
    if (S.sourceLink) src += `<a class="source-link" href="${esc(S.sourceLink)}" target="_blank" rel="noopener">${esc(S.sourceText)}</a>`;
    else src += `<span class="source-link">${esc(S.sourceText)}</span>`;
    rightParts.push(src);
  }
  o += rightParts.join('<span class="source-label">&nbsp;&middot;&nbsp;</span>');
  o += '</div></div>';

  // ── Filter bar ──
  o += `<div id="filter-bar" class="${hasActiveFilters() ? 'active' : ''}">`;
  o += '<span>Filters active</span>';
  o += '<button class="clear-filters-btn" onclick="TBL.clearAllFilters()">Clear all filters</button>';
  o += '</div>';

  // ── Button filter bar ──
  const bfCols = activeBtnFilterCols();
  if (bfCols.length > 0) {
    o += '<div id="btn-filter-bar">';
    // Dropdown-style columns first (they sit side by side), then each
    // button-style column on its own line of pills.
    const ddCols = bfCols.filter(h => bfMode(h) === 'dropdown');
    const pillCols = bfCols.filter(h => bfMode(h) === 'buttons');
    ddCols.forEach(hdrName => {
      const bf = btnFilters[hdrName];
      const isActive = bf && bf.size > 0;
      const uniqueCount = btnFilterUniqueVals(hdrName).length;
      const label = isActive ? `${hdrName} (${bf.size}/${uniqueCount})` : hdrName;
      o += `<div class="bf-group" data-bf-hdr="${esc(hdrName)}">`;
      o += `<button class="bf-btn ${isActive ? 'bf-active' : ''}" onclick="TBL.toggleBtnFilter(event,'${esc(hdrName)}')">${esc(label)} <span class="bf-arrow">▼</span></button>`;
      o += `</div>`;
    });
    const pillOnBg = S.headerColor, pillOnTx = txtClr(pillOnBg);
    pillCols.forEach(hdrName => {
      const hci = headers.indexOf(hdrName);
      const vals = btnFilterUniqueVals(hdrName);
      const sel = btnFilters[hdrName];
      const anySel = !!(sel && sel.size);
      const onSty = `background:${pillOnBg};border-color:${pillOnBg};color:${pillOnTx};`;
      const offSty = `background:color-mix(in srgb, ${pillOnBg} 14%, var(--surface));border-color:color-mix(in srgb, ${pillOnBg} 55%, var(--surface));`;
      o += `<div class="bf-pills" role="group" aria-label="${esc(hdrName)}">`;
      o += `<span class="bf-pill-label">${esc(hdrName)}</span>`;
      o += `<button class="bf-pill bf-pill-all ${anySel ? '' : 'on'}" aria-pressed="${!anySel}" style="${anySel ? offSty : onSty}" onclick="TBL.clearPills(${hci})">All</button>`;
      vals.forEach((v, vi) => {
        const on = anySel && sel.has(v);
        o += `<button class="bf-pill ${on ? 'on' : ''}" aria-pressed="${on}" style="${on ? onSty : offSty}" onclick="TBL.togglePill(${hci},${vi})">${esc(v || '(empty)')}</button>`;
      });
      o += `</div>`;
    });
    o += '</div>';
  }

  // ── Chart area outline ──
  o += '<div id="chart-outline">';

  // ── Table ──
  o += '<div id="table-wrapper">';
  o += `<table id="data-table" style="width:100%;min-width:${totalMinW}px;">`;

  o += '<colgroup>';
  if (hc) o += `<col style="width:${toggleW}px;">`;
  for (let i = 0; i < colCount; i++) o += '<col>';
  o += '</colgroup>';

  // ── THEAD ──
  o += `<thead style="font-size:${S.headerFontSize}px;"><tr>`;
  if (hc) o += `<th class="tcol col-sticky" style="background:${hBg};color:${hTx};left:0;"></th>`;

  visCols.forEach((ci) => {
    const hdr = headers[ci];
    let cls = '';
    let sty = `background:${hBg};color:${hTx};`;
    if (S.lockFirstColumn && ci === visCols[0]) { cls += ' col-sticky'; sty += `left:${hc ? toggleW : 0}px;` }

    o += `<th class="${cls}" data-ci="${ci}" style="${sty}">`;
    o += '<div class="th-content">';
    o += `<span class="th-label">${esc(hdr)}</span>`;
    o += '<span class="th-btns">';

    if (S.userCanFilterColumns && !numCols.has(ci) && !btnFilterColSet().has(hdr)) {
      const fActive = filters[ci] && filters[ci].size > 0;
      o += `<button class="filter-btn ${fActive ? 'active-filter' : ''}" onclick="TBL.toggleFilter(event,${ci})" title="Filter this column" aria-label="Filter ${esc(hdr)}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button>`;
    }

    if (S.userCanSortColumns) {
      const si = sortStack.findIndex(s => s.col === ci);
      const active = si >= 0;
      const dir = active ? sortStack[si].dir : null;
      // Two stacked arrowheads; the active direction is solid, the other faint
      const upOp = dir === 'desc' ? .3 : 1, dnOp = dir === 'asc' ? .3 : 1;
      const arrow = `<svg viewBox="0 0 16 20" width="13" height="16" aria-hidden="true"><path d="M8 1.5 L14 8.5 H2 Z" fill="currentColor" opacity="${upOp}"/><path d="M8 18.5 L14 11.5 H2 Z" fill="currentColor" opacity="${dnOp}"/></svg>`;
      const badge = active && sortStack.length > 1 ? `<span class="sort-badge">${si + 1}</span>` : '';
      const sortLbl = dir === 'asc' ? 'Sorted ascending — click for descending' : dir === 'desc' ? 'Sorted descending — click to clear' : 'Sort';
      o += `<button class="sort-btn ${active ? 'active-sort' : ''}" onclick="TBL.cycleSort(${ci})" title="${sortLbl}" aria-label="${sortLbl}: ${esc(hdr)}">${arrow}${badge}</button>`;
    }

    o += '</span></div></th>';
  });
  o += '</tr></thead>';

  // ── TBODY ──
  toggleGroupSets = [];
  const toggleSetMap = {};
  if (hc) {
    for (let ri = 0; ri < pageRows.length; ri++) {
      const m = merges[ri][visCols[0] ?? 0];
      if (!m.skip) {
        const keys = [];
        for (let r = ri; r < ri + m.span && r < pageRows.length; r++) {
          if (pageRows[r].type === 'summary' || pageRows[r].needsToggle) keys.push(pageRows[r].groupKey);
        }
        if (keys.length) {
          toggleSetMap[ri] = toggleGroupSets.length;
          toggleGroupSets.push(keys);
        }
      }
    }
  }

  o += `<tbody style="font-size:${S.tableFontSize}px;">`;
  pageRows.forEach((row, ri) => {
    const even = ri % 2 === 1;
    const bg = even ? aBg : tBg;
    const tc = txtClr(bg);
    const isSummary = row.type === 'summary';

    o += `<tr data-ri="${ri}" style="background:${bg};color:${tc};">`;

    if (hc) {
      const toggleMerge = merges[ri][visCols[0] ?? 0];
      if (toggleMerge.skip) {
        // merged into the row above
      } else {
        let btn = '';
        if ((isSummary || row.needsToggle) && toggleSetMap[ri] != null) {
          const setIdx = toggleSetMap[ri];
          const setKeys = toggleGroupSets[setIdx];
          const anyExpanded = setKeys.some(k => !!groupExpanded[k]);
          const icon = anyExpanded ? '−' : '+';
          btn = `<button class="tbtn" style="color:${tc};border-color:${tc === C.textLight ? C.overlayBorderLight : C.overlayBorder};" onclick="TBL.toggleGroupSet(${setIdx})">${icon}</button>`;
        }
        const tSpan = toggleMerge.span > 1 ? ` rowspan="${toggleMerge.span}"` : '';
        o += `<td class="tcol col-sticky" data-ci="-1"${tSpan} style="left:0;background:${bg};">${btn}</td>`;
      }
    }

    visCols.forEach((ci) => {
      const m = merges[ri][ci];
      if (m.skip) return;

      const val = row.cells[ci] ?? '';
      const isN = numCols.has(ci);
      const isAgg = isSummary && isN && String(val).includes('(');
      const isAll = isAllCell(val);

      let cls = [];
      if (isAgg) cls.push('agg-cell');
      else if (isN) cls.push('num-cell');
      if (isAll) cls.push('all-cell');

      let sty = '';
      if (m.span > 1) { sty += `background:${bg};`; }

      if (S.lockFirstColumn && ci === visCols[0]) {
        cls.push('col-sticky');
        sty += `left:${hc ? toggleW : 0}px;`;
        if (m.span <= 1) sty += `background:${bg};`;
      }

      const rowspanAttr = m.span > 1 ? ` rowspan="${m.span}"` : '';

      let display = '';
      if (isAgg || isAll) { display = esc(String(val)) }
      else { display = esc(String(val)).replace(/\n/g, '<br>') }

      o += `<td class="${cls.join(' ')}" data-ci="${ci}"${rowspanAttr} style="${sty}">${display}</td>`;
    });

    o += '</tr>';
  });
  o += '</tbody></table></div>';

  // ── Pagination ──
  if (pages > 1) {
    o += '<div id="pag-bar">';
    o += `<button class="pg" ${currentPage === 1 ? 'disabled' : ''} onclick="TBL.goPage(${currentPage - 1})">&#8249;</button>`;
    pagRange(currentPage, pages).forEach(p => {
      if (p === '...') o += '<span class="pgd">&hellip;</span>';
      else o += `<button class="pg ${p === currentPage ? 'pga' : ''}" onclick="TBL.goPage(${p})">${p}</button>`;
    });
    o += `<button class="pg" ${currentPage === pages ? 'disabled' : ''} onclick="TBL.goPage(${currentPage + 1})">&#8250;</button>`;
    o += '</div>';
  }

  o += '</div>'; // close #chart-outline

  const prevSearch = document.getElementById('tbl-search-input');
  const hadFocus = prevSearch && document.activeElement === prevSearch;
  const selStart = hadFocus ? prevSearch.selectionStart : null, selEnd = hadFocus ? prevSearch.selectionEnd : null;
  app.innerHTML = o;
  if (hadFocus) {
    const si = document.getElementById('tbl-search-input');
    if (si) { si.focus(); try { si.setSelectionRange(selStart, selEnd) } catch (e) {} }
  }
  setupHover();
}

function pagRange(cur, tot) {
  if (tot <= 7) return Array.from({ length: tot }, (_, i) => i + 1);
  const p = [1];
  if (cur > 3) p.push('...');
  for (let i = Math.max(2, cur - 1); i <= Math.min(tot - 1, cur + 1); i++) p.push(i);
  if (cur < tot - 2) p.push('...');
  p.push(tot);
  return p;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  HOVER
// ═══════════════════════════════════════════════════════════════════════════════

function setupHover() {
  const table = document.getElementById('data-table');
  if (!table) return;
  let lastRI = null, lastCI = null;

  table.addEventListener('mouseover', e => {
    const td = e.target.closest('td,th');
    if (!td) return;
    const ci = td.getAttribute('data-ci');
    const tr = td.closest('tr');
    const ri = tr ? tr.getAttribute('data-ri') : null;
    if (ci === lastCI && ri === lastRI) return;

    clearHover(table);
    lastRI = ri; lastCI = ci;
    if (ci == null || ci === '-1' || ri == null) return;

    const row = table.querySelector(`tbody tr[data-ri="${ri}"]`);
    if (row) row.classList.add('row-hover');
    table.querySelectorAll(`tbody td[data-ci="${ci}"]`).forEach(c => c.classList.add('col-hover'));
    const th = table.querySelector(`thead th[data-ci="${ci}"]`);
    if (th) th.classList.add('col-hover');
  });

  table.addEventListener('mouseleave', () => { clearHover(table); lastRI = null; lastCI = null });
}

function clearHover(table) {
  table.querySelectorAll('.row-hover').forEach(el => el.classList.remove('row-hover'));
  table.querySelectorAll('.col-hover').forEach(el => el.classList.remove('col-hover'));
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SORT
// ═══════════════════════════════════════════════════════════════════════════════

function cycleSort(ci) {
  const existing = sortStack.findIndex(s => s.col === ci);
  if (existing < 0) {
    sortStack.unshift({ col: ci, dir: 'asc' });
  } else {
    const cur = sortStack[existing];
    if (cur.dir === 'asc') {
      cur.dir = 'desc';
      sortStack.splice(existing, 1);
      sortStack.unshift(cur);
    } else {
      sortStack.splice(existing, 1);
    }
  }
  currentPage = 1;
  renderTable();
}

// ═══════════════════════════════════════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════════════════════════════════════

// ─── Shared checkbox dropdown ───────────────────────────────────────────────
// Used by the column-header filters (id 'filter-dd', class prefix 'fd') and
// the dropdown-style filter buttons (id 'bf-filter-dd', prefix 'bfd'). Ticks
// are kept on the element and only committed when Apply is pressed.
// applyCall is the start of the inline handler, e.g. "TBL.applyFilter(3,".
function buildValueDropdown(id, cls, p, uniqueVals, current, applyCall) {
  const dd = document.createElement('div');
  dd.className = cls;
  dd.id = id;
  const tempSelected = current.size > 0 ? new Set(current) : new Set(uniqueVals);

  function renderList(searchTerm) {
    const filtered = searchTerm ? uniqueVals.filter(v => v.toLowerCase().includes(searchTerm.toLowerCase())) : uniqueVals;
    const listEl = dd.querySelector('.' + p + '-list');
    listEl.innerHTML = '';
    filtered.forEach(v => {
      const checked = tempSelected.has(v);
      const item = document.createElement('div');
      item.className = p + '-item';
      item.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''} data-val="${esc(v)}"><label>${esc(v || '(empty)')}</label>`;
      item.querySelector('input').addEventListener('change', e => {
        if (e.target.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      item.querySelector('label').addEventListener('click', () => {
        const cb = item.querySelector('input');
        cb.checked = !cb.checked;
        if (cb.checked) tempSelected.add(v); else tempSelected.delete(v);
      });
      listEl.appendChild(item);
    });
  }

  dd.innerHTML = `
    <div class="${p}-search"><input type="text" placeholder="Search values…"></div>
    <div class="${p}-list"></div>
    <div class="${p}-actions">
      <button onclick="${applyCall}'select-all')">Select All</button>
      <button onclick="${applyCall}'clear-all')">Clear All</button>
      <button class="${p}-apply" onclick="${applyCall}'apply')">Apply</button>
    </div>
  `;
  dd._tempSelected = tempSelected;
  dd._uniqueVals = uniqueVals;
  dd._renderList = renderList;
  return dd;
}

// Fill the list and focus the search box, once the dropdown is in the page.
function openValueDropdown(dd, p) {
  dd._renderList('');
  const searchInput = dd.querySelector('.' + p + '-search input');
  searchInput.addEventListener('input', e => dd._renderList(e.target.value));
  searchInput.focus();
}

// Select All / Clear All redraw the list. Apply passes commit() the chosen
// values, or null when everything or nothing is ticked (= no filter).
function runDropdownAction(id, p, action, commit) {
  const dd = document.getElementById(id);
  if (!dd) return;
  if (action === 'select-all' || action === 'clear-all') {
    dd._tempSelected.clear();
    if (action === 'select-all') dd._uniqueVals.forEach(v => dd._tempSelected.add(v));
    dd._renderList(dd.querySelector('.' + p + '-search input').value);
    return;
  }
  if (action === 'apply') {
    const sel = dd._tempSelected;
    commit((sel.size === dd._uniqueVals.length || sel.size === 0) ? null : new Set(sel));
    currentPage = 1;
    renderTable();
  }
}

function toggleFilter(event, ci) {
  event.stopPropagation();
  if (openFilter === ci) { closeFilterDropdown(); return }
  closeFilterDropdown();
  closeBtnFilterDropdown();
  openFilter = ci;

  const btn = event.target.closest('.filter-btn');
  const rect = btn.getBoundingClientRect();
  const wrapper = document.getElementById('table-wrapper');
  const wrapRect = wrapper.getBoundingClientRect();

  const dd = buildValueDropdown('filter-dd', 'filter-dropdown', 'fd', uniqueColVals(ci), filters[ci] || new Set(), `TBL.applyFilter(${ci},`);
  let left = rect.left - wrapRect.left + wrapper.scrollLeft;
  let top = rect.bottom - wrapRect.top + wrapper.scrollTop + 4;
  if (left + 220 > wrapRect.width + wrapper.scrollLeft) left = rect.right - 220 - wrapRect.left + wrapper.scrollLeft;
  dd.style.left = left + 'px';
  dd.style.top = top + 'px';

  wrapper.appendChild(dd);
  openValueDropdown(dd, 'fd');

  setTimeout(() => {
    document.addEventListener('click', closeFilterOnOutside);
  }, 0);
}

function closeFilterOnOutside(e) {
  const dd = document.getElementById('filter-dd');
  if (dd && !dd.contains(e.target) && !e.target.closest('.filter-btn')) {
    closeFilterDropdown();
  }
}

function closeFilterDropdown() {
  openFilter = null;
  const dd = document.getElementById('filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeFilterOnOutside);
}

function applyFilter(ci, action) {
  runDropdownAction('filter-dd', 'fd', action, sel => {
    if (sel) filters[ci] = sel; else delete filters[ci];
    closeFilterDropdown();
  });
}

function onSearch(v) {
  searchTerm = v;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; renderTable(); }, 150);
}
function clearSearch() {
  clearTimeout(searchTimer);
  searchTerm = '';
  currentPage = 1;
  renderTable();
  const si = document.getElementById('tbl-search-input');
  if (si) si.focus();
}

function clearAllFilters() {
  clearTimeout(searchTimer);

  btnFilters = {};

}

// ═══════════════════════════════════════════════════════════════════════════════
//  BUTTON FILTERS
// ═══════════════════════════════════════════════════════════════════════════════

// Button-style filter: each click adds/removes one value. Nothing selected = everything shown.
function togglePill(ci, vi) {
  const hdrName = headers[ci];
  if (hdrName == null) return;
  const vals = btnFilterUniqueVals(hdrName);
  const v = vals[vi];
  if (v === undefined) return;
  const set = btnFilters[hdrName] ? new Set(btnFilters[hdrName]) : new Set();
  if (set.has(v)) set.delete(v); else set.add(v);
  if (set.size === 0 || set.size === vals.length) delete btnFilters[hdrName];
  else btnFilters[hdrName] = set;
  currentPage = 1;
  renderTable();
}
function clearPills(ci) {
  const hdrName = headers[ci];
  if (hdrName == null) return;
  delete btnFilters[hdrName];
  currentPage = 1;
  renderTable();
}

function toggleBtnFilter(event, hdrName) {
  event.stopPropagation();
  if (openBtnFilter === hdrName) { closeBtnFilterDropdown(); return }
  closeBtnFilterDropdown();
  closeFilterDropdown();
  openBtnFilter = hdrName;

  const group = event.target.closest('.bf-btn').closest('.bf-group');
  const dd = buildValueDropdown('bf-filter-dd', 'bf-dropdown', 'bfd', btnFilterUniqueVals(hdrName), btnFilters[hdrName] || new Set(), `TBL.applyBtnFilter('${esc(hdrName)}',`);
  group.appendChild(dd);
  openValueDropdown(dd, 'bfd');

  setTimeout(() => {
    document.addEventListener('click', closeBtnFilterOnOutside);
  }, 0);
}

function closeBtnFilterOnOutside(e) {
  const dd = document.getElementById('bf-filter-dd');
  if (dd && !dd.contains(e.target) && !e.target.closest('.bf-btn')) {
    closeBtnFilterDropdown();
  }
}

function closeBtnFilterDropdown() {
  openBtnFilter = null;
  const dd = document.getElementById('bf-filter-dd');
  if (dd) dd.remove();
  document.removeEventListener('click', closeBtnFilterOnOutside);
}

function applyBtnFilter(hdrName, action) {
  runDropdownAction('bf-filter-dd', 'bfd', action, sel => {
    if (sel) btnFilters[hdrName] = sel; else delete btnFilters[hdrName];
    closeBtnFilterDropdown();
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
//  EVENT HANDLERS
// ═══════════════════════════════════════════════════════════════════════════════

function toggleGroupSet(setIdx) {
  const keys = toggleGroupSets[setIdx];
  if (!keys || !keys.length) return;
  const anyExpanded = keys.some(k => !!groupExpanded[k]);
  keys.forEach(k => { groupExpanded[k] = !anyExpanded });
  renderTable();
}
function expandAll() {
  if (!hasColl()) return;
  const gi = groupKeyIdx();
  filterRows(rawRows).forEach(row => {
    const key = gi.map(i => row[i] ?? '').join('|||');
    groupExpanded[key] = true;
  });
  currentPage = 1; renderTable();
}
function collapseAll() { groupExpanded = {}; currentPage = 1; renderTable() }

function copyShare(btn) {
  copyToClipboard(S.shareLink, () => {
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = orig }, 1500);
  });
}

function downloadCSV() {
  const csvEsc = v => { const s = String(v); return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g, '""') + '"' : s };
  const keep = headers.map((_, i) => i).filter(i => !isHiddenCi(i));
  const lines = [keep.map(i => csvEsc(headers[i])).join(',')];
  rawRows.forEach(r => { lines.push(keep.map(i => csvEsc(r[i] ?? '')).join(',')) });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sanitizeFilename(state.name || 'data') + '.csv'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function goPage(p) {
  const allRows = buildView();
  const tot = Math.max(1, Math.ceil(allRows.length / rowsPerPage()));
  if (p < 1 || p > tot) return;
  currentPage = p; renderTable();
  const tw = document.getElementById('table-wrapper'); if (tw) tw.scrollTop = 0;
}

// ═══════════════════════════════════════════════════════════════════════════════
//  LOAD / REFRESH / SHOW-HIDE / BOOT
// ═══════════════════════════════════════════════════════════════════════════════

function showError(t, m) { const app = appEl(); if (app) app.innerHTML = `<div id="err-screen"><h2>${t}</h2><p>${m}</p></div>` }
function showLoading() { const app = appEl(); if (app) app.innerHTML = '<div id="load-screen"><div class="spin"></div>Loading&hellip;</div>' }

// Ingest raw CSV text: parse, detect columns and render. If the column
// headers changed, volatile UI state (filters/sorts/expansion) is reset.
function ingest(text) {
  lastCSVText = text;
  const parsed = parseCSV(text);
  const newHeaders = (parsed.headers || []).map(h => h.trim());
  const sameHeaders = headers.length > 0 && newHeaders.length === headers.length && newHeaders.every((h, i) => h === headers[i]);
  headers = newHeaders;
  rawRows = parsed.rows;
  if (!headers.length || !rawRows.length) { showError('Empty Data', 'The data source returned no rows.'); return }
  detectNumCols();
  if (!sameHeaders) { filters = {}; btnFilters = {}; searchTerm = ''; sortStack = []; groupExpanded = {}; applyBtnDefaults(); }
  currentPage = 1;
  if (!sameHeaders && !S.defaultToCollapsedColumns && hasColl()) {
    const gi = groupKeyIdx();
    rawRows.forEach(row => {
      const key = gi.map(i => row[i] ?? '').join('|||');
      groupExpanded[key] = true;
    });
  }
  renderTable();
  if (typeof window.__onTableDataLoaded === 'function') window.__onTableDataLoaded();
}

// The connected data as CSV text: the uploaded snapshot, or a fresh
// (cache-busted) fetch of the Google Sheet.
async function readSourceText() {
  if (state.source === 'csv') {
    if (!state.csvText) throw new Error('No uploaded CSV data. Use the connection screen to upload a CSV.');
    return state.csvText;
  }
  if (!state.url) throw new Error('No Google Sheet connected.');
  return fetchSheetCSV(state.url, true);
}

// Full (re)load from the current connection (sheet fetch or CSV snapshot).
async function load() {
  showLoading();
  try {
    ingest(await readSourceText());
  } catch (err) {
    console.error(err);
    showError('Failed to Load', `Error: <em>${esc(err.message)}</em><br><br>Check the connection and sharing settings.`);
  }
}

// Refresh the live Google Sheets connection (CSV mode just reloads).
// Unlike load(), a failure keeps the current table on screen.
async function refresh() {
  if (state.source !== 'sheets') { await load(); return; }
  try {
    ingest(await readSourceText());
  } catch (err) {
    alert('Refresh failed: ' + err.message);
  }
}

// Show/hide the table component (swaps with the mapper's #wrap).
function show() {
  const w = document.getElementById('wrap'); if (w) w.style.display = 'none';
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'flex';
}
function hide() {
  const tr = document.getElementById('table-root'); if (tr) tr.style.display = 'none';
  const w = document.getElementById('wrap'); if (w) w.style.display = 'flex';
}

// Boot from a saved-file data object ({tool:'table', ...}).
function bootEmbedded(data) {
  if (!data) return;
  if (data.settings) Object.assign(S, data.settings);
  state.source = data.source || 'sheets';
  state.url = data.url || '';
  state.csvText = data.csv || '';
  state.name = data.title || 'Table';
  document.title = state.name;
  show();
  load();
}

// Standalone table export: viewer boot stored the embedded data on window.
if (window.__embeddedChartData && window.__embeddedChartData.tool === 'table') {
  bootEmbedded(window.__embeddedChartData);
}

return {
  S, state,
  headers: () => headers.slice(),
  hasData: () => headers.length > 0,
  rerender: renderTable,
  load, refresh, show, hide, bootEmbedded,
  // inline onclick handlers
  expandAll, collapseAll, copyShare, downloadCSV, clearAllFilters,
  toggleBtnFilter, togglePill, clearPills, onSearch, clearSearch,
  uniqueVals: btnFilterUniqueVals,
  csvSnapshot: () => lastCSVText,
  applyBtnDefault: (h) => { applyBtnDefaults(h); currentPage = 1; renderTable(); }, toggleFilter, cycleSort, toggleGroupSet, goPage,
  applyFilter, applyBtnFilter,
};
})();

    /* Header: 36px DeSmog icon + title, 12px gap (the line divider is the h1's border).

    .start-card h1::before, .dh-card h1::before, #options-head h2::before {

  document.body.appendChild(overlay);

  const screens = overlay.querySelectorAll('.start-screen');

  /* ---------- start-up connect screen fields ---------- */
  // Read the picked CSV file into store[key] (null when cleared or unreadable).
  function readFileInto(input, store, key, errEl) {
    const file = input.files && input.files[0];
    if (!file) { store[key] = null; return; }
    const reader = new FileReader();
    reader.onload = () => { store[key] = String(reader.result || ''); };
    reader.onerror = () => { store[key] = null; if (errEl) errEl.textContent = 'Could not read ' + file.name + '.'; };

  function fieldUrl(id, label, opt, val) {

      try {
        const doc = new DOMParser().parseFromString(reader.result, 'text/html');
        const el = doc.getElementById('leo-chart-data');
        if (!el) throw new Error('This file has no saved chart data.');
        const data = JSON.parse(el.textContent);

          currentTool = 'table';
          overlay.style.display = 'none';
          buildOptionsForm();

      csvData.views = pendingCsv.views || '';

    }

    physicsMode = (chosenPhysics === 'cells') ? 'keepOn' : chosenPhysics;
    if (chosenPhysics !== 'cells') { formattingSettings.cellCount = 1; formattingSettings.cellOption = 1; }

  function finishStartMapper() {

  /* ---------- create: table ---------- */

    buildOptionsForm();
    optionsPanel.classList.add('collapsed');

  function ensureLegendArrays() {
    while (colorLegendEntries.length < 12) colorLegendEntries.push({ enabled: false, label: '', color: '#888888' });

    if (shapeLegendEntries.length < 4) {
      const have = new Set(shapeLegendEntries.map(e => e.shape));
      shapeDefs.forEach(([, key]) => { if (!have.has(key)) shapeLegendEntries.push({ enabled: false, label: '', shape: key }); });
    }
  }

  /* ---------- "Change connection" modal (both tools, both sources) ---------- */

  connOverlay.className = 'authoring-only';
  connOverlay.style.display = 'none';
  document.body.appendChild(connOverlay);

  let modalSrc = 'sheets';
  const modalCsv = { entities: null, connections: null, views: null, table: null };

  function openConnModal(forceSrc) {
    modalSrc = forceSrc || (coreTool() ? coreTool().state.source : dataSource) || 'sheets';
    modalCsv.entities = modalCsv.connections = modalCsv.views = modalCsv.table = null;
    buildConnModal();
    connOverlay.style.display = 'flex';
  }
  function closeConnModal() { connOverlay.style.display = 'none'; }

  function buildConnModal() {
    let fields = '';
    if (currentTool === 'mapper') {
      if (modalSrc === 'sheets') {
        fields =
          fieldUrl('cc-ent', 'Entities', '(required)', CONFIG.entitiesUrl) +
          fieldUrl('cc-conn', 'Connections', '(required)', CONFIG.connectionsUrl) +
          fieldUrl('cc-views', 'Views', '(optional — enables Story mode)', CONFIG.viewsUrl);
      } else {
        fields =
          '<div class="auth-hint">Leave a file empty to keep its current data.</div>' +
          fieldFile('cc-f-ent', 'Entities CSV', dataSource === 'csv' ? '(optional — replaces current)' : '(required)') +
          fieldFile('cc-f-conn', 'Connections CSV', dataSource === 'csv' ? '(optional — replaces current)' : '(required)') +
          fieldFile('cc-f-views', 'Views CSV', '(optional)');
      }
    } else {
      const core = coreTool();
      if (modalSrc === 'sheets') {
        fields = fieldUrl('cc-turl', 'Data sheet', '(required)', core.state.url);
      } else {
        fields = fieldFile('cc-f-table', 'Data CSV', (core.state.source === 'csv' && core.state.csvText) ? '(optional — replaces current)' : '(required)');
      }
    }
    connOverlay.innerHTML = `
      <div class="start-card">
        <h1>Change connection</h1>
        <p class="sub">Connect to Google Sheets (web link or CSV link, both work) or upload CSV files.</p>
        <div class="src-tabs">
          <button class="src-tab ${modalSrc === 'sheets' ? 'selected' : ''}" data-msrc="sheets">Google Sheets</button>
          <button class="src-tab ${modalSrc === 'csv' ? 'selected' : ''}" data-msrc="csv">Upload CSVs</button>
        </div>
        ${fields}
        <div class="auth-err" id="cc-err"></div>
        <div class="auth-row-btns">
          <button class="auth-btn secondary" id="cc-cancel">Cancel</button>
          <button class="auth-btn" id="cc-apply">Apply &amp; reconnect</button>
        </div>
      </div>`;

    const err = connOverlay.querySelector('#cc-err');
    connOverlay.querySelectorAll('.src-tab').forEach(t => {
      t.addEventListener('click', () => { modalSrc = t.dataset.msrc; buildConnModal(); });
    });
    ['cc-f-ent|entities', 'cc-f-conn|connections', 'cc-f-views|views', 'cc-f-table|table'].forEach(pair => {
      const [id, key] = pair.split('|');
      const inp = connOverlay.querySelector('#' + id);
      if (inp) inp.addEventListener('change', e => readFileInto(e.target, modalCsv, key, err));
    });
    connOverlay.querySelector('#cc-cancel').addEventListener('click', closeConnModal);
    connOverlay.querySelector('#cc-apply').addEventListener('click', applyConnModal);
  }

  connOverlay.addEventListener('click', (e) => { if (e.target === connOverlay) closeConnModal(); });

  async function applyConnModal() {
    const err = connOverlay.querySelector('#cc-err');
    const applyBtn = connOverlay.querySelector('#cc-apply');
    err.textContent = '';

    if (currentTool === 'mapper') {
      if (modalSrc === 'sheets') {
        const ent = connOverlay.querySelector('#cc-ent').value.trim();
        const conn = connOverlay.querySelector('#cc-conn').value.trim();
        const views = connOverlay.querySelector('#cc-views').value.trim();
        if (!ent || !conn) { err.textContent = 'Entities and Connections links are both required.'; return; }
        CONFIG.entitiesUrl = ent; CONFIG.connectionsUrl = conn; CONFIG.viewsUrl = views;
        dataSource = 'sheets';
      } else {
        // Merge newly-uploaded files over the current snapshots
        if (modalCsv.entities !== null) csvData.entities = modalCsv.entities;
        if (modalCsv.connections !== null) csvData.connections = modalCsv.connections;
        if (modalCsv.views !== null) csvData.views = modalCsv.views;
        if (!csvData.entities || !csvData.connections) { err.textContent = 'Entities and Connections CSVs are required (upload them, or keep existing ones).'; return; }
        dataSource = 'csv';
      }
      applyBtn.disabled = true;
      const orig = applyBtn.textContent;
      applyBtn.textContent = 'Reconnecting…';
      try { await refreshData(); closeConnModal(); buildOptionsForm(); }
      catch (e2) { err.textContent = 'Could not load the new data. Check the connection and try again.'; }
      finally { applyBtn.disabled = false; applyBtn.textContent = orig; }
    } else {
      const core = coreTool();
      if (modalSrc === 'sheets') {
        const turl = connOverlay.querySelector('#cc-turl').value.trim();
        if (!turl) { err.textContent = 'The data sheet link is required.'; return; }
        core.state.url = turl; core.state.source = 'sheets';
      } else {
        if (modalCsv.table !== null) { core.state.csvText = modalCsv.table; }
        else if (!(core.state.source === 'csv' && core.state.csvText)) { err.textContent = 'Choose a CSV file to upload.'; return; }
        core.state.source = 'csv'; core.state.url = '';
      }
      applyBtn.disabled = true;
      const orig = applyBtn.textContent;
      applyBtn.textContent = 'Reconnecting…';
      try { await core.load(); closeConnModal(); buildOptionsForm(); }
      finally { applyBtn.disabled = false; applyBtn.textContent = orig; }
    }
  }

  /* ---------- options panel DOM ---------- */
  const optionsPanel = document.createElement('div');
  optionsPanel.id = 'options-panel';
  optionsPanel.className = 'authoring-only collapsed';
  optionsPanel.innerHTML = `
    <div id="options-head">
      <h2>Options</h2>
      <div class="opt-head-btns">
        <button class="auth-btn secondary" id="opt-newload" style="padding:6px 10px;font-size:12px;">New / Load</button>
        <button class="auth-btn" id="opt-collapse" style="padding:6px 10px;font-size:13px;">‹ Hide</button>
      </div>
    </div>
    <div id="options-body"></div>`;
  document.body.appendChild(optionsPanel);

  const optionsToggle = document.createElement('button');
  optionsToggle.id = 'options-toggle';
  optionsToggle.className = 'authoring-only';
  optionsToggle.innerHTML = '\u203A';          // slim edge tab with an arrow
  optionsToggle.title = 'Options';
  optionsToggle.setAttribute('aria-label', 'Options');
  document.body.appendChild(optionsToggle);

  optionsToggle.addEventListener('click', () => {
    optionsPanel.classList.remove('collapsed');
    setTimeout(() => { if (currentTool === 'mapper' && nodes.length) { computeGridLayout(); render(); } }, 300);
  });
  optionsPanel.querySelector('#opt-collapse').addEventListener('click', () => {
    optionsPanel.classList.add('collapsed');
    setTimeout(() => { if (currentTool === 'mapper' && nodes.length) { computeGridLayout(); render(); } }, 300);
  });
  optionsPanel.querySelector('#opt-newload').addEventListener('click', () => {
    overlay.style.display = 'flex';
    showScreen('home');
  });

  /* ---------- apply mapper settings live ---------- */
  function applyAndRender(restartPhysics) {
    document.documentElement.style.setProperty('--chart-bg', formattingSettings.backgroundColor || '#FFFFFF');
    rebuildShapeCategoryMap();
    updateNodeSizes();
    updateLogoFromSettings();
    updateTitleFromSettings();
    updateShareFromSettings();
    updateInfoPanelVisibility();
    loadBackgroundImage();
    updateCategoryColors();
    updateLegend();
    updateShapeLegend();
    updateCellAssignments();
    computeGridLayout();
    if (restartPhysics && physicsMode === 'keepOn' && nodes.length) updatePhysics();
    if (selectedNode && !isStoryMode) {
      populateInfoPanel(selectedNode);
    }
    render();
  }

  /* ---------- cells: confirm modal + config changes ---------- */
  const cellOverlay = document.createElement('div');
  cellOverlay.className = 'authoring-only';
  cellOverlay.style.cssText =
    'position:fixed;inset:0;z-index:100001;background:var(--scrim);' +
    'display:none;align-items:center;justify-content:center;' +
    'font-family:var(--font-family);color:var(--text);';
  document.body.appendChild(cellOverlay);

  function showCellConfirm(msg, onYes, onNo) {
    cellOverlay.innerHTML =
      '<div class="start-card" style="width:min(430px,92vw);">' +
        '<h1>Change cell configuration?</h1>' +
        '<p class="sub" style="margin-bottom:18px;">' + msg + '</p>' +
        '<div class="auth-row-btns">' +
          '<button class="auth-btn secondary" id="cellc-no">No</button>' +
          '<button class="auth-btn" id="cellc-yes">Yes</button>' +
        '</div>' +
      '</div>';
    cellOverlay.style.display = 'flex';
    const close = () => { cellOverlay.style.display = 'none'; cellOverlay.innerHTML = ''; };
    cellOverlay.querySelector('#cellc-no').addEventListener('click', () => { close(); if (onNo) onNo(); });
    cellOverlay.querySelector('#cellc-yes').addEventListener('click', () => { close(); onYes(); });
  }

  // Only warn when something would actually be lost.
  function confirmCellChange(onYes, onNo) {
    const hasManual = allNodes.some(n => n.cellValue != null && savedPositions.has(n.name));
    if (!hasManual) { onYes(); return; }
    showCellConfirm('All manually placed nodes will re-space.', onYes, onNo);
  }

  // Changing the count or the configuration drops manual placements.
  function applyCellConfigChange() {
    invalidateCells();
    allNodes.forEach(n => { if (n.cellValue != null) { savedPositions.delete(n.name); n.manualInCell = false; } });
    normalizeCellSettings();
    updateCellAssignments();
    computeGridLayout();
    if (physicsMode === 'keepOn' && nodes.length) updatePhysics();
    buildOptionsForm();
    render();
  }

  /* ---------- form builder (generic helpers) ---------- */
  const body = optionsPanel.querySelector('#options-body');

  // Fold state is remembered per section title. Every section starts
  // collapsed, and rebuilding the form (e.g. after a cell change) restores
  // exactly what the user had open rather than resetting it.
  const sectionFoldState = new Map();

  function section(title) {
    const isFolded = sectionFoldState.has(title) ? sectionFoldState.get(title) : true;
    const sec = document.createElement('div');
    sec.className = 'opt-section' + (isFolded ? ' folded' : '');
    const h = document.createElement('h3'); h.textContent = title;
    const rows = document.createElement('div'); rows.className = 'opt-rows';
    h.addEventListener('click', () => {
      sec.classList.toggle('folded');
      sectionFoldState.set(title, sec.classList.contains('folded'));
    });
    sec.appendChild(h); sec.appendChild(rows);
    body.appendChild(sec);
    return rows;
  }
  function rowEl(labelText) {
    const r = document.createElement('div'); r.className = 'opt-row';
    if (labelText) { const l = document.createElement('label'); l.className = 'cap'; l.textContent = labelText; r.appendChild(l); }
    return r;
  }
  function checkboxRow(parent, labelText, obj, key, onChange) {
    const r = rowEl(labelText);
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!obj[key];
    c.addEventListener('change', () => { obj[key] = c.checked; onChange(); });
    r.insertBefore(c, r.firstChild); parent.appendChild(r); return c;
  }
  function textRow(parent, labelText, obj, key, onChange) {
    const r = rowEl(labelText);
    const t = document.createElement('input'); t.type = 'text'; t.value = obj[key] || '';
    t.addEventListener('input', () => { obj[key] = t.value; onChange(); });
    r.appendChild(t); parent.appendChild(r); return t;
  }
  function numberRow(parent, labelText, obj, key, step, onChange) {
    const r = rowEl(labelText);
    const n = document.createElement('input'); n.type = 'number'; if (step) n.step = step; n.value = obj[key];
    n.addEventListener('input', () => { const v = parseFloat(n.value); if (!isNaN(v)) { obj[key] = v; onChange(); } });
    r.appendChild(n); parent.appendChild(r); return n;
  }
  function colorRow(parent, labelText, obj, key, onChange) {
    const r = rowEl(labelText);
    const c = document.createElement('input'); c.type = 'color'; c.value = (obj[key] && String(obj[key]).startsWith('#')) ? obj[key] : '#000000';
    c.addEventListener('input', () => { obj[key] = c.value; onChange(); });
    r.appendChild(c); parent.appendChild(r); return c;
  }
  function selectRow(parent, labelText, obj, key, options, onChange) {
    const r = rowEl(labelText);
    const s = document.createElement('select');
    options.forEach(([val, lab]) => { const o = document.createElement('option'); o.value = val; o.textContent = lab; s.appendChild(o); });
    s.value = obj[key];
    s.addEventListener('change', () => { obj[key] = s.value; onChange(); });
    r.appendChild(s); parent.appendChild(r); return s;
  }
  function numberSelectRow(parent, labelText, obj, key, options, onChange) {
    const r = rowEl(labelText);
    const s = document.createElement('select');
    options.forEach(([val, lab]) => { const o = document.createElement('option'); o.value = String(val); o.textContent = lab; s.appendChild(o); });
    s.value = String(obj[key]);
    s.addEventListener('change', () => { obj[key] = Number(s.value); onChange(); });
    r.appendChild(s); parent.appendChild(r); return s;
  }
  function hintEl(parent, text) {
    const h = document.createElement('div'); h.className = 'opt-hint'; h.textContent = text;
    parent.appendChild(h); return h;
  }
  function buttonEl(parent, label, secondary, onClick) {
    const wrap = document.createElement('div'); wrap.className = 'opt-export';
    const b = document.createElement('button'); b.className = 'auth-btn block' + (secondary ? ' secondary' : ''); b.textContent = label;
    b.addEventListener('click', onClick);
    wrap.appendChild(b); parent.appendChild(wrap); return b;
  }

  // 0-100 strength slider. Fires onChange on release only, so dragging it
  // doesn't restart the simulation on every pixel of travel.
  function sliderRow(parent, labelText, obj, key, onChange) {
    const r = rowEl(labelText);
    const w = document.createElement('div');
    w.style.cssText = 'display:flex;align-items:center;gap:8px;flex:1;';
    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = '0'; sl.max = '100'; sl.step = '1';
    sl.value = String(obj[key]); sl.style.flex = '1';
    const v = document.createElement('span');
    v.className = 'cap';
    v.style.cssText = 'flex:0 0 auto;min-width:28px;text-align:right;';
    v.textContent = String(obj[key]);
    sl.addEventListener('input', () => { obj[key] = parseInt(sl.value, 10) || 0; v.textContent = sl.value; });
    sl.addEventListener('change', () => onChange());
    w.appendChild(sl); w.appendChild(v); r.appendChild(w); parent.appendChild(r); return sl;
  }

  /* ---------- shared Data section ---------- */
  function buildDataSection() {
    const s = section('Data');
    const isSheets = (coreTool() ? coreTool().state.source : dataSource) === 'sheets';
    if (isSheets) {
      hintEl(s, 'Reloads the connected Google Sheets. Usually works within 5 sec. of a change to a sheet, but may not refresh recent changes for up to 30 sec.');
      buttonEl(s, '↻ Refresh data', false, async function () {
        const b = this; b.disabled = true; const orig = b.textContent; b.textContent = 'Refreshing…';
        try { const core = coreTool(); if (core) await core.refresh(); else await refreshData(); }
        finally { b.disabled = false; b.textContent = orig; }
      });
    } else {
      hintEl(s, 'This chart uses uploaded CSV files (a static snapshot). Upload new files to update the data.');
      buttonEl(s, '⤴ Re-upload CSVs', false, () => openConnModal('csv'));
    }
    buttonEl(s, 'Change connection', true, () => openConnModal());
  }

  /* ---------- mapper options form ---------- */
  function buildMapperOptionsForm() {
    ensureLegendArrays();
    body.innerHTML = '';
    const fs = formattingSettings;
    const ar = () => applyAndRender(false);
    const arR = () => applyAndRender(true);

    buildDataSection();

    // Title
    let s = section('Title');
    checkboxRow(s, 'Show chart title', fs, 'chartTitleEnabled', ar);
    textRow(s, 'Chart title', fs, 'chartTitle', ar);
    checkboxRow(s, 'Show subtitle', fs, 'chartSubtitleEnabled', ar);
    textRow(s, 'Subtitle', fs, 'chartSubtitle', ar);

    // Nodes
    s = section('Nodes');
    selectRow(s, 'Size mode', fs, 'nodeSizeMode', [
      ['connections', '# of connections'], ['custom', 'Fixed size'],
      ['connectionsOutTotal', 'Connections out total'], ['connectionsInTotal', 'Connections in total']
    ], ar);
    numberRow(s, 'Fixed node size', fs, 'nodeSize', null, ar);
    numberRow(s, 'Min node size', fs, 'minNodeSize', null, ar);
    numberRow(s, 'Max node size', fs, 'maxNodeSize', null, ar);
    numberRow(s, 'Scale node size', fs, 'sizeScale', '0.1', ar);
    {
      const r = document.createElement('div'); r.className = 'opt-row';
      const l1 = document.createElement('label'); l1.className = 'cap';
      l1.style.flex = '0 0 auto'; l1.textContent = 'Hide nodes with';
      const inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.step = '1'; inp.placeholder = '\u2014';
      inp.style.width = '64px';
      inp.value = (fs.hideMaxConnections == null) ? '' : String(fs.hideMaxConnections);
      const l2 = document.createElement('label'); l2.className = 'cap';
      l2.textContent = 'or less connections';
      let t = null;
      const commit = () => {
        clearTimeout(t); t = null;
        const raw = inp.value.trim();
        let v = null;
        if (raw !== '') {
          const n = Math.floor(Number(raw));
          if (isFinite(n) && n >= 0) v = n;
        }
        if (v === (fs.hideMaxConnections == null ? null : fs.hideMaxConnections)) return;
        setHideMaxConnections(v);
      };
      inp.addEventListener('input', () => { clearTimeout(t); t = setTimeout(commit, 400); });
      inp.addEventListener('change', commit);
      inp.addEventListener('blur', () => {
        inp.value = (fs.hideMaxConnections == null) ? '' : String(fs.hideMaxConnections);
      });
      r.appendChild(l1); r.appendChild(inp); r.appendChild(l2); s.appendChild(r);
    }
    hintEl(s, 'Leave blank to show every node. Entities with this many connections or fewer are removed completely, along with their connections. The map then works as if they weren\u2019t in the data. Connections are counted on the full data.');
    selectRow(s, 'Default shape', fs, 'nodeShape', [['circle', 'Circle'], ['square', 'Square'], ['diamond', 'Diamond'], ['triangle', 'Triangle']], ar);
    colorRow(s, 'Node color', fs, 'nodeColor', ar);
    hintEl(s, 'Default fill. A "Custom Node Color" in the Entities sheet replaces it for that row, and replaces the node\u2019s image too.');
    colorRow(s, 'Node hover color', fs, 'nodeHoverColor', ar);
    hintEl(s, 'Applies to every node while hovered, including custom-colored ones.');
    colorRow(s, 'Outline color', fs, 'outlineColor', ar);
    colorRow(s, 'Outline hover color', fs, 'outlineHoverColor', ar);
    numberRow(s, 'Outline thickness', fs, 'outlineThickness', null, ar);
    hintEl(s, 'Outlines are never changed by Custom Node Color: they still follow the color legend, or the outline color above.');

    // Lines
    s = section('Lines');
    selectRow(s, 'Line size mode', fs, 'lineSizeMode', [['fixed', 'Fixed size'], ['connectionValue', 'Connection value']], ar);
    numberRow(s, 'Line thickness', fs, 'lineThickness', null, ar);
    colorRow(s, 'Line color', fs, 'lineColor', ar);
    colorRow(s, 'Line hover color', fs, 'lineHoverColor', ar);

    // Cells
    s = section('Cells');
    normalizeCellSettings();
    hintEl(s, 'Divide the chart into cells, then put a cell number in a "Cell" column in the Entities sheet. Assigned nodes space out evenly inside their cell, ignore physics, and can only be dragged within that cell. Blank means the node keeps using physics; a number outside the range hides the node.');

    const cellCountRow = rowEl('Number of cells');
    const cellCountSel = document.createElement('select');
    for (let i = 1; i <= 10; i++) {
      const o = document.createElement('option');
      o.value = String(i); o.textContent = (i === 1) ? '1 (cells off)' : String(i);
      cellCountSel.appendChild(o);
    }
    cellCountSel.value = String(fs.cellCount);
    cellCountSel.addEventListener('change', () => {
      const prevCount = fs.cellCount;
      confirmCellChange(
        () => { fs.cellCount = Number(cellCountSel.value); fs.cellOption = 1; applyCellConfigChange(); },
        () => { cellCountSel.value = String(prevCount); }
      );
    });
    cellCountRow.appendChild(cellCountSel); s.appendChild(cellCountRow);

    const cellOpts = cellOptionsFor(Number(fs.cellCount) || 1);
    const cellOptRow = rowEl('Configuration');
    const cellOptSel = document.createElement('select');
    cellOpts.forEach((o, i) => {
      const el = document.createElement('option');
      el.value = String(i + 1); el.textContent = o.label;
      cellOptSel.appendChild(el);
    });
    cellOptSel.value = String(fs.cellOption);
    cellOptSel.disabled = (cellOpts.length < 2);
    cellOptSel.addEventListener('change', () => {
      const prevOpt = fs.cellOption;
      confirmCellChange(
        () => { fs.cellOption = Number(cellOptSel.value); applyCellConfigChange(); },
        () => { cellOptSel.value = String(prevOpt); }
      );
    });
    cellOptRow.appendChild(cellOptSel); s.appendChild(cellOptRow);

    if (cellsActive()) {
      const prevWrap = document.createElement('div');
      prevWrap.innerHTML = cellPreviewSVG();
      s.appendChild(prevWrap);
      hintEl(s, 'Cell numbers — use these values in the "Cell" column.');

      numberSelectRow(s, 'Cell title size', fs, 'cellTitleSize',
        [[12, 'Smallest'], [14, 'Small'], [16, 'Normal'], [20, 'Big'], [24, 'Biggest']], ar);

      ensureCellTitles();
      currentCells().forEach((c, i) => {
        const r = rowEl('Cell ' + (i + 1) + (c.kind === 'ring' ? ' (ring)' : '') + ' title');
        const t = document.createElement('input');
        t.type = 'text'; t.placeholder = '(no title)';
        t.value = fs.cellTitles[i] || '';
        t.addEventListener('input', () => { ensureCellTitles(); fs.cellTitles[i] = t.value; ar(); });
        r.appendChild(t); s.appendChild(r);
      });
    }

    // Auto-position
    s = section('Auto-position (physics)');
    const pmRow = rowEl('Physics mode');
    const pmSel = document.createElement('select');
    [['keepOn', 'Keep physics on for unfixed nodes'], ['freezeAfterInitial', 'Freeze after initial placement']]
      .forEach(([val, lab]) => { const o = document.createElement('option'); o.value = val; o.textContent = lab; pmSel.appendChild(o); });
    pmSel.value = physicsMode;
    pmSel.addEventListener('change', () => { physicsMode = pmSel.value; if (nodes.length) updatePhysics(); });
    pmRow.appendChild(pmSel); s.appendChild(pmRow);
    hintEl(s, 'Drag a node to fix it in place. Double-click a fixed node to unfix it and hand it back to physics (keep-on mode), or to return a node in a cell to automatic spacing.');
    const durRow = rowEl('Physics run time');
    const durWrap = document.createElement('div');
    durWrap.style.cssText = 'display:flex;align-items:center;gap:8px;flex:1;';
    const durSlider = document.createElement('input');
    durSlider.type = 'range';
    durSlider.min = '1'; durSlider.max = '20'; durSlider.step = '1';
    durSlider.value = String(physicsDurationSec);
    durSlider.style.flex = '1';
    const durVal = document.createElement('span');
    durVal.className = 'cap';
    durVal.style.cssText = 'flex:0 0 auto;min-width:46px;text-align:right;';
    durVal.textContent = physicsDurationSec + ' sec';
    durSlider.addEventListener('input', () => {
      physicsDurationSec = parseInt(durSlider.value, 10) || 6;
      durVal.textContent = physicsDurationSec + ' sec';
    });
    durSlider.addEventListener('change', () => { if (nodes.length) updatePhysics(); });
    durWrap.appendChild(durSlider); durWrap.appendChild(durVal);
    durRow.appendChild(durWrap); s.appendChild(durRow);
    sliderRow(s, 'Force-directed physics', fs, 'forceStrength', arR);
    hintEl(s, 'Attraction along real connections plus general repulsion between all nodes.');
    sliderRow(s, 'Global structure (stress)', fs, 'stressStrength', arR);
    hintEl(s, 'Keeps nodes a few connections apart closer than nodes many connections apart.');
    sliderRow(s, 'Neighbourhood similarity', fs, 'similarityStrength', arR);
    hintEl(s, 'Pulls together nodes that share connections, even when they aren\'t connected to each other.');
    sliderRow(s, 'Collision / spacing', fs, 'collisionStrength', arR);
    hintEl(s, 'Stops nodes overlapping, and sets the padding around each one.');
    selectRow(s, 'Node bounds', fs, 'boundMode',
      [['inside', 'Force nodes inside default zoom area'], ['outside', 'Allow nodes outside default zoom area']], arR);

    // Labels
    s = section('Labels');

    checkboxRow(s, 'Logo on', fs, 'logoEnabled', ar);
    textRow(s, 'Logo URL', fs, 'logoUrl', ar);

    // Info panel

    textRow(s, 'Color category title', fs, 'colorLegendCategoryTitle', ar);
    checkboxRow(s, 'Show shape legend category name', fs, 'showShapeLegendCategoryName', ar);
    textRow(s, 'Shape category title', fs, 'shapeLegendCategoryTitle', ar);
    checkboxRow(s, 'Show total IN value', fs, 'showTotalInValue', ar);
    textRow(s, 'Total IN title', fs, 'totalInTitle', ar);
    checkboxRow(s, 'Show total OUT value', fs, 'showTotalOutValue', ar);
    textRow(s, 'Total OUT title', fs, 'totalOutTitle', ar);
    checkboxRow(s, 'Show connections box title', fs, 'showConnectionsBoxTitle', ar);
    textRow(s, 'Connections box title', fs, 'connectionsBoxTitle', ar);

    // Color legend (12)
    s = section('Color legend');

    hintEl(s, 'On: clicking legend labels adds and removes categories, so several can be highlighted at once. Off: each click highlights one category on its own. Applies to the shape legend too.');
    colorLegendEntries.forEach((entry, i) => {

    bHtml.addEventListener('click', exportHTML);
