  /* ---------- table options form ---------- */
  function buildTableOptionsForm() {
    body.innerHTML = '';
    const ts = TBL.S;
    const rr = () => TBL.rerender();

    buildDataSection();

    // Table style
    let s = section('Table style');
    colorRow(s, 'Header color', ts, 'headerColor', rr);
    colorRow(s, 'Table color', ts, 'tableColor', rr);
    checkboxRow(s, 'Alternate row colors', ts, 'alternateRowColors', rr);
    numberRow(s, 'Header font size', ts, 'headerFontSize', null, rr);
    numberRow(s, 'Table font size', ts, 'tableFontSize', null, rr);
    numberRow(s, 'Rows per page', ts, 'rowsPerPage', null, rr);
    checkboxRow(s, 'Lock first column', ts, 'lockFirstColumn', rr);

    // Behaviour
    s = section('Behaviour');
    checkboxRow(s, 'Users can sort columns', ts, 'userCanSortColumns', rr);

    checkboxRow(s, 'Start with groups collapsed', ts, 'defaultToCollapsedColumns', rr);

    textRow(s, 'Source link', ts, 'sourceLink', rr);
    textRow(s, 'Share link', ts, 'shareLink', rr);

    // Export
    s = section('Export');
    hintEl(s, 'Saved HTML shows just the table, works on its own, and reopens here to keep editing.');
    buttonEl(s, 'Export saved HTML (live sheet link)', false, () => exportHTML());
    buttonEl(s, 'Export saved HTML (data built in)', true, () => exportHTML({ embedData: true }));
    hintEl(s, 'Live sheet link: the file loads the latest data from your Google Sheet each time it opens. Data built in: a copy of the data as it is right now is stored inside the file and the sheet link is removed \u2014 nothing is fetched, so it works in any iframe, but it won\u2019t pick up later changes to the sheet. If the sheet has changed, use Data \u2192 Refresh data first.');
  }

  // Builds the three column-picker sections (they rebuild whenever the
  // connected data / headers change, via window.__onTableDataLoaded).
  function buildColumnPickers() {
    columnCheckGroup('Hide columns', 'hiddenColumns',
      'Ticked columns are left out of the table completely. Groups and totals are recalculated as if the column wasn\u2019t there.');
    columnCheckGroup('Collapsible columns', 'collapsibleColumns',
      'Values in these columns collapse into a summary row per group, with numeric columns aggregated.');
    filterButtonGroup();
    columnCheckGroup('Comma-separated columns', 'commaSeparatedColumns',
      'Cells in these columns are treated as comma-separated lists when filtering.');
  }
  // Filter button columns: tick a column, then choose how its filter looks.
  function filterButtonGroup() {
    const s = section('Filter button columns');
    hintEl(s, 'Ticked columns are shown as filters above the table. Buttons: every value as a clickable pill. Dropdown: one menu with checkboxes. Default value: what is selected when the table first loads.');
    const hs = TBL.headers();
    if (!hs.length) { hintEl(s, 'Connect data first — column names appear here once loaded.'); return; }
    const ts = TBL.S;
    if (!ts.filterButtonModes) ts.filterButtonModes = {};
    if (!ts.filterButtonDefaults) ts.filterButtonDefaults = {};
    if (!ts.filterButtonShowInTable) ts.filterButtonShowInTable = [];
    const list = document.createElement('div'); list.className = 'opt-col-list';
    list.style.maxHeight = '320px';
    const boxes = [];
    const small = 'font-size:11px;padding:1px 4px;height:22px;width:auto;max-width:150px;flex:0 1 auto;';
    hs.forEach(h => {
      const wrap = document.createElement('div');
      const r = document.createElement('div'); r.className = 'opt-row';
      const c = document.createElement('input'); c.type = 'checkbox';
      c.checked = (ts.filterButtonColumns || []).includes(h);
      const l = document.createElement('label'); l.className = 'cap'; l.textContent = h;
      l.style.cursor = 'pointer';
      r.appendChild(c); r.appendChild(l); wrap.appendChild(r);

      // sub-options, shown while the column is ticked
      const sub = document.createElement('div');
      sub.style.cssText = 'margin:0 0 8px 24px;display:flex;flex-direction:column;gap:4px;font-size:11px;';
      const line = (txt, el) => {
        const d = document.createElement('div'); d.style.cssText = 'display:flex;align-items:center;gap:6px;';
        const t = document.createElement('span'); t.textContent = txt; t.style.cssText = 'width:52px;color:var(--muted);';
        el.style.cssText += small;
        d.appendChild(t); d.appendChild(el); sub.appendChild(d);
      };
      const mode = document.createElement('select');
      [['buttons', 'Buttons'], ['dropdown', 'Dropdown']].forEach(([v, t]) => {
        const o = document.createElement('option'); o.value = v; o.textContent = t; mode.appendChild(o);
      });
      mode.value = ts.filterButtonModes[h] === 'dropdown' ? 'dropdown' : 'buttons';
      mode.setAttribute('aria-label', 'Filter style for ' + h);
      mode.addEventListener('change', () => {
        if (mode.value === 'dropdown') ts.filterButtonModes[h] = 'dropdown';
        else delete ts.filterButtonModes[h];
        TBL.rerender();
      });
      line('Style', mode);

      const def = document.createElement('select');
      const optAll = document.createElement('option'); optAll.value = ''; optAll.textContent = 'All'; def.appendChild(optAll);
      TBL.uniqueVals(h).forEach(v => {
        const o = document.createElement('option'); o.value = v; o.textContent = v || '(empty)'; def.appendChild(o);
      });
      def.value = ts.filterButtonDefaults[h] != null && TBL.uniqueVals(h).includes(ts.filterButtonDefaults[h]) ? ts.filterButtonDefaults[h] : '';
      def.setAttribute('aria-label', 'Default value for ' + h);
      def.addEventListener('change', () => {
        if (def.value === '') delete ts.filterButtonDefaults[h];
        else ts.filterButtonDefaults[h] = def.value;
        TBL.applyBtnDefault(h);
      });
      line('Default', def);

      const showRow = document.createElement('label');
      showRow.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;';
      const show = document.createElement('input'); show.type = 'checkbox';
      show.checked = ts.filterButtonShowInTable.includes(h);
      show.addEventListener('change', () => {
        const set = new Set(ts.filterButtonShowInTable);
        if (show.checked) set.add(h); else set.delete(h);
        ts.filterButtonShowInTable = hs.filter(x => set.has(x));
        TBL.rerender();
      });
      showRow.appendChild(show); showRow.appendChild(document.createTextNode('Also show in table'));
      sub.appendChild(showRow);
      sub.style.display = c.checked ? 'flex' : 'none';
      wrap.appendChild(sub);

      const apply = () => {
        const checked = new Set();
        boxes.forEach((cb, i) => { if (cb.checked) checked.add(hs[i]); });
        ts.filterButtonColumns = hs.filter(x => checked.has(x));
        sub.style.display = c.checked ? 'flex' : 'none';
        if (c.checked) TBL.applyBtnDefault(h); else TBL.rerender();
      };
      c.addEventListener('change', apply);
      l.addEventListener('click', () => { c.checked = !c.checked; apply(); });
      boxes.push(c);
      list.appendChild(wrap);
    });
    s.appendChild(list);
  }
  function columnCheckGroup(title, key, hint) {
    const s = section(title);
    hintEl(s, hint);
    const hs = TBL.headers();
    if (!hs.length) { hintEl(s, 'Connect data first — column names appear here once loaded.'); return; }
    const list = document.createElement('div'); list.className = 'opt-col-list';
    hs.forEach(h => {
      const r = document.createElement('div'); r.className = 'opt-row';
      const c = document.createElement('input'); c.type = 'checkbox';
      c.checked = (TBL.S[key] || []).includes(h);
      const l = document.createElement('label'); l.className = 'cap'; l.textContent = h;
      l.style.cursor = 'pointer';
      const apply = () => {
        const checked = new Set();
        list.querySelectorAll('input[type=checkbox]').forEach((cb, i) => { if (cb.checked) checked.add(hs[i]); });
        TBL.S[key] = hs.filter(x => checked.has(x));
        TBL.rerender();
      };
      c.addEventListener('change', apply);
      l.addEventListener('click', () => { c.checked = !c.checked; apply(); });
      r.appendChild(c); r.appendChild(l); list.appendChild(r);
    });
    s.appendChild(list);
  }

  /* ---------- "How to format your data" instructions ---------- */
  // A plain text link pinned to the very top of the Options menu. The modal
  // it opens documents what the connected sheet can contain for whichever
  // tool is open: column names, and the cell formatting the viewer reads.
  const dataHelpOverlay = document.createElement('div');
  dataHelpOverlay.id = 'datahelp-overlay';
  dataHelpOverlay.className = 'authoring-only';
  document.body.appendChild(dataHelpOverlay);

  function closeDataHelp() {
    dataHelpOverlay.classList.remove('show');
    dataHelpOverlay.innerHTML = '';
  }
  function openDataHelp() {
    dataHelpOverlay.innerHTML =
      '<div class="dh-card">' +
        '<button id="dh-close" type="button" aria-label="Close">\u2715</button>' +
        dataHelpHTML() +
      '</div>';
    dataHelpOverlay.classList.add('show');
  }
  // Click the backdrop or the X to dismiss; Escape works too.
  dataHelpOverlay.addEventListener('click', (e) => {
    if (e.target === dataHelpOverlay || e.target.closest('#dh-close')) closeDataHelp();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && dataHelpOverlay.classList.contains('show')) closeDataHelp();
  });

  function dataHelpLink() {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt-datahelp';
    b.textContent = 'How to format your data';
    b.addEventListener('click', openDataHelp);
    return b;
  }

  function dataHelpHTML() {
    if (currentTool === 'table') return DH_TABLE;
    return DH_MAPPER;
  }

  const DH_MAPPER = `
    <h1>How to format your data</h1>
    <p class="sub">What the Mapper Tool reads from your connected sheets. Everything else &mdash; default colors, sizes, shapes, titles, legend labels, node positions &mdash; is set here in Options, not in the sheet. Per-node colors and inner labels are the exception: they come from the Custom Node Color and Inner Node Label columns.</p>

    <h2>The basics</h2>
    <ul>
      <li>Row 1 of each tab is the header row. Column names must match the spelling below exactly, including capital letters and spaces.</li>
      <li>Column order doesn&rsquo;t matter, and any column not listed here is ignored &mdash; so working notes can live in the same tab.</li>
      <li>Entities and Connections each need their own link (<b>File &rarr; Share &rarr; Publish to web</b>, pick the tab, copy the link). Blank rows are skipped.</li>
      <li>Every column except <code>Entity Name</code>, <code>A</code> and <code>B</code> is optional &mdash; leave out the ones you don&rsquo;t need.</li>
    </ul>

    <h2>Entities tab &mdash; one row per node</h2>
    <table class="dh-table">
      <tr><th>Column</th><th>What it does</th></tr>
      <tr><td>Entity Name<span class="opt">required</span></td><td>The node&rsquo;s label, and the name the Connections tab has to match. Two rows with the same name become one node.</td></tr>
      <tr><td>Description</td><td>Shown in the info panel when the node is selected. Line breaks are kept, and basic HTML works &mdash; including <code>&lt;a href="..."&gt;links&lt;/a&gt;</code>, which open in a new tab.</td></tr>
      <tr><td>Color Legend Category</td><td>One category per row. To get a colour, the value has to match a label under <b>Options &rarr; Color legend</b> exactly. Those matching categories are also what viewers click to filter the chart.</td></tr>
      <tr><td>Shape Legend Category</td><td>Same idea, matched against <b>Options &rarr; Shape legend</b>. Sets the node&rsquo;s shape and gives viewers a second filter.</td></tr>
      <tr><td>Image</td><td>A direct image link (one ending in .jpg, .png and so on). Drawn inside the node and beside the name in the info panel. A Custom Node Color or Inner Node Label on the same row replaces it inside the node; it still shows in the info panel.</td></tr>
      <tr><td>Custom Node Color</td><td>A hex color for this node&rsquo;s fill, with or without the <code>#</code>: <code>#C0392B</code>, <code>C0392B</code> or short <code>F60</code>. Replaces both the image and the default <b>Options &rarr; Nodes &rarr; Node color</b> for this row. The node still turns the hover color while hovered, and its outline still follows the color legend or the outline color. Anything that isn&rsquo;t a valid hex color is ignored.</td></tr>
      <tr><td>Inner Node Label</td><td>Short text written inside the node, replacing its image. It is fitted to the node&rsquo;s shape at 10&ndash;18px on screen, on up to 3 lines, wrapping at spaces (a long word is split only when it can&rsquo;t fit a line by itself). Line breaks typed in the cell are kept. If it still doesn&rsquo;t fit at 10px it ends in &ldquo;...&rdquo;, and if not even 3 characters fit it isn&rsquo;t shown &mdash; zooming in reveals more. Text is white, or black when the node&rsquo;s color (custom or default) is too light for white; it doesn&rsquo;t change when the node is hovered. Separate from the name label below the node, which still comes from Entity Name and <b>Options &rarr; Labels</b>.</td></tr>
      <tr><td>Cell</td><td>Only used when cells are switched on. A cell number, starting at 1. Blank means physics places the node; a number above the cell count hides it.</td></tr>
      <tr><td>Views</td><td>Only used with a Views tab. Comma-separated View IDs &mdash; the story steps this node appears in. The <b>Start Story</b> button only shows when this column exists.</td></tr>
      <tr><td>View Highlight</td><td>Comma-separated View IDs where this node should be highlighted rather than just present.</td></tr>
    </table>

    <h2>Connections tab &mdash; one row per line</h2>
    <table class="dh-table">
      <tr><th>Column</th><th>What it does</th></tr>
      <tr><td>A<span class="opt">required</span></td><td>The Entity Name the connection runs from.</td></tr>
      <tr><td>B<span class="opt">required</span></td><td>The Entity Name it runs to.</td></tr>
      <tr><td>Value</td><td>A number. Drives line thickness (Line size mode = Connection value), node size (Size mode = Connections in/out total) and the Total in / Total out figures in the info panel. Commas and spaces are fine; currency symbols are not &mdash; write <code>1,200,000</code>, not <code>$1,200,000</code>, and add the symbol under <b>Options &rarr; Labels &rarr; Connection value prefix</b>.</td></tr>
      <tr><td>Text</td><td>Replaces the other node&rsquo;s name in the connections list in the info panel. HTML links work here too.</td></tr>

    <p class="dh-note">A name in A or B that isn&rsquo;t in the Entities tab still gets a node &mdash; an empty one, with no description, category or image. Stray spaces and two spellings of the same organization are the usual cause of duplicate or orphaned nodes.</p>

    <h2>Views tab &mdash; optional, turns on Story mode</h2>
    <table class="dh-table">
      <tr><th>Column</th><th>What it does</th></tr>

      <tr><td>View Text</td><td>Body text for the step. HTML links work.</td></tr>

  `;

  const DH_TABLE = `
    <h1>How to format your data</h1>
    <p class="sub">What the Table Tool reads from your connected sheet. Colours, fonts, page size and which columns group or filter are all set here in Options &mdash; the sheet only supplies the data.</p>

    <h2>The basics</h2>
    <ul>
      <li>Row 1 is the header row. Those names become the column titles, and they&rsquo;re what the column pickers in this menu list &mdash; rename a header in the sheet and you&rsquo;ll need to re-tick it here.</li>
      <li>Up to 30 columns are read; anything past the 30th is dropped. Blank rows are skipped.</li>
      <li>Cells show as plain text. Line breaks are kept, but HTML and links don&rsquo;t render.</li>
    </ul>

    <h2>Number columns</h2>
    <ul>
      <li>A column counts as numeric when at least 9 in 10 of its filled cells read as numbers. Numeric columns are totalled or averaged in collapsed rows, and don&rsquo;t get a filter menu.</li>
      <li>The currency symbol and decimal places used in those totals are copied from the first filled cell in the column, so keep a column consistent: <code>$1,200.00</code> all the way down, rather than mixing it with <code>1200</code>.</li>
      <li>Symbols recognized: $ &euro; &pound; &yen; &#8377; &#8381; &#8361;.</li>
      <li>IDs and postal codes will be treated as numbers too &mdash; worth knowing before you make such a column collapsible.</li>
    </ul>

    <h2>Date columns</h2>
    <ul>
      <li>Dates are treated as text, never added up or averaged. A column counts as dates when at least 9 in 10 of its filled cells look like a date: <code>2024-01-15</code>, <code>15/01/2024</code>, <code>Jan 15, 2024</code>, <code>15 Jan 2024</code>, <code>Jan 2024</code>, <code>Q1 2024</code>, <code>FY2024</code>.</li>
      <li>A column of plain years (<code>2023</code>, <code>2024</code>) is treated as dates when its header contains Year, Date, FY, Month, Period or Quarter.</li>
      <li>Date columns get a filter menu like any text column, and sort in date order.</li>
    </ul>

    <h2>Grouping &mdash; Collapsible columns</h2>
    <ul>
      <li>Tick the columns whose values should tuck away inside a summary row. Every remaining column that isn&rsquo;t numeric and isn&rsquo;t a filter button becomes the grouping key: rows with identical values across all of those columns collapse together.</li>
      <li>That match is exact, so a trailing space or a second spelling splits one group into two. Sorting the sheet by those columns makes the odd ones out easy to spot.</li>
      <li>Numeric columns in a group are summed or averaged (<b>Behaviour &rarr; Aggregation mode</b>); other collapsible columns show as <code>ALL (3)</code>.</li>
    </ul>

    <h2>Filtering</h2>
    <ul>
      <li><b>Filter button columns</b> are shown as filters above the table. Best for a column with a handful of repeated values &mdash; region, type, year. Each one can be <b>Buttons</b> (the default: every value as a pill &mdash; click to select, click again to unselect, <b>All</b> to reset) or a <b>Dropdown</b> (a checkbox menu).</li>
      <li>Give a filter column a <b>Default</b> value and the table opens with just that value selected instead of All. <i>Clear all filters</i> still goes back to All.</li>
      <li>Filter columns are taken out of the table unless you tick <b>Also show in table</b>; then the column shows normally too (and counts towards grouping and search).</li>
      <li>The <b>search bar</b> above the table shows only rows where the term appears in at least one of the table&rsquo;s visible columns. Filter-button columns (unless also shown in the table) and hidden columns aren&rsquo;t searched. <i>Clear all filters</i> (or the &times; in the box, or Esc) clears it.</li>
      <li><b>Hide columns</b> removes a column from the table entirely. It stops counting towards grouping, so rows that only differed in that column fold together and their totals are recalculated. It&rsquo;s also left out of <i>Download data</i>.</li>
      <li><b>Comma-separated columns</b> treat a cell like <code>oil, gas, coal</code> as three separate values when filtering, so each one gets its own filter entry. Separate with commas only.</li>
      <li>The filter menus in the column headers appear on text columns only, and can be switched off under Behaviour.</li>
    </ul>
  `;

  function buildOptionsForm() {
    const scroll = body.scrollTop;
    if (currentTool === 'table') buildTableOptionsForm();
    else buildMapperOptionsForm();
    body.insertBefore(dataHelpLink(), body.firstChild);  // always the first thing in the menu
    body.scrollTop = scroll;   // keep the user where they were
  }

  // Rebuild the table form when data (and therefore the header list) changes.
  window.__onTableDataLoaded = () => { if (currentTool === 'table') buildOptionsForm(); };

  /* ---------- node drag / snap / double-click unfix (mapper tool only) ---------- */
  let dragNode = null, dragStartClient = null, dragOffset = null, dragMoved = false;
  AUTH = {
    onDown(evt) {
      if (isStoryMode) return false;
      const pos = getCanvasPos(evt);
      const n = findNodeAtPos(pos.x, pos.y);
      if (!n) return false;
      dragNode = n;
      dragStartClient = { x: evt.clientX, y: evt.clientY };
      dragOffset = { x: pos.x - n.x, y: pos.y - n.y };
      dragMoved = false;
      showGridOverlay = true;
      canvas.style.cursor = 'grabbing';
      evt.preventDefault();
      render();
      return true;
    },
    onMove(evt) {
      if (!dragNode) return false;
      const pos = getCanvasPos(evt);
      let nx = pos.x - dragOffset.x, ny = pos.y - dragOffset.y;
      // A cell-assigned node can never leave its cell.
      if (cellsActive() && dragNode.cellIdx != null && gridScale) {
        const cell = currentCells()[dragNode.cellIdx];
        if (cell) {
          const g = pixelToGrid(nx, ny);
          const p = clampToCell(cell, g.gx, g.gy, (dragNode.r || 0) / gridScale, cellTitlePadGrid(dragNode.cellIdx));
          const px = gridToPixel(p.gx, p.gy);
          nx = px.x; ny = px.y;
        }
      }
      dragNode.x = nx; dragNode.y = ny; dragNode.fx = nx; dragNode.fy = ny;
      if (Math.hypot(evt.clientX - dragStartClient.x, evt.clientY - dragStartClient.y) > 4) dragMoved = true;
      render();
      evt.preventDefault();
      return true;
    },
    onUp(evt) {
      if (!dragNode) return false;
      const n = dragNode;
      dragNode = null; showGridOverlay = false; didDrag = true;
      canvas.style.cursor = 'grab';
      if (!dragMoved) {
        selectedNode = n;
        if (isStoryMode) showEntityModal(n); else populateInfoPanel(n);
        render();
        return true;
      }
      const inCell = cellsActive() && n.cellIdx != null;
      if (inCell) {
        // Manual placement within the cell; other nodes take the free slots.
        const cell = currentCells()[n.cellIdx];
        const g = pixelToGrid(n.x, n.y);
        const p = clampToCell(cell,
          Math.round(g.gx / SNAP_UNITS) * SNAP_UNITS,
          Math.round(g.gy / SNAP_UNITS) * SNAP_UNITS,
          (n.r || 0) / gridScale, cellTitlePadGrid(n.cellIdx));
        n.gridX = p.gx; n.gridY = p.gy; n.hasGridCoords = true;
        savedPositions.set(n.name, { x: n.gridX, y: n.gridY });
        n.manualInCell = true;
        applyCellLayout();
      } else {
        const g = pixelToGrid(n.x, n.y);
        n.gridX = Math.round(g.gx / SNAP_UNITS) * SNAP_UNITS;
        n.gridY = Math.round(g.gy / SNAP_UNITS) * SNAP_UNITS;
        n.hasGridCoords = true;
        const px = gridToPixel(n.gridX, n.gridY);
        n.x = px.x; n.y = px.y; n.fx = px.x; n.fy = px.y;
        savedPositions.set(n.name, { x: n.gridX, y: n.gridY });
        if (physicsMode === 'keepOn' && simulation) simulation.alpha(0.5).restart();
      }
      render();
      return true;
    }
  };

  // Double-click a fixed node to unfix it. Works the same with a mouse,
  // trackpad (tap or click) or touch, because it relies on the browser's own
  // double-click detection rather than on pointer movement.
  //  - Physics mode "keep on": the node is released back to physics.
  //  - A node placed by hand inside a cell goes back to automatic spacing,
  //    and the rest of its cell re-spaces around it.
  //  - "Freeze after initial placement": nothing to release into, so no-op.
  canvas.addEventListener('dblclick', (evt) => {
    if (currentTool !== 'mapper' || isStoryMode) return;
    const pos = getCanvasPos(evt);
    const n = findNodeAtPos(pos.x, pos.y);
    if (!n) return;
    evt.preventDefault();
    const inCell = cellsActive() && n.cellIdx != null;
    if (inCell) {
      if (!n.manualInCell) return;            // already auto-spaced
      savedPositions.delete(n.name);
      n.manualInCell = false;
      applyCellLayout();
    } else {
      if (physicsMode !== 'keepOn' || !n.hasGridCoords) return;  // not fixed
      n.hasGridCoords = false; n.fx = null; n.fy = null;
      savedPositions.delete(n.name);
      if (simulation) { simHot = true; simulation.alpha(0.7).restart(); }
      else updatePhysics();
    }
    render();
  });

  /* ---------- export: saved HTML (both tools) ---------- */
  function gatherPositions() {
    const positions = {};
    // allNodes, so a node hidden by the connection filter keeps its position.
    allNodes.forEach(n => {
      // Auto-spaced cell nodes are recomputed on load, so don't freeze them.
      if (n.cellIdx != null && !n.manualInCell) return;
      if (n.hasGridCoords && isFinite(n.gridX) && isFinite(n.gridY)) {
        positions[n.name] = { x: +(+n.gridX).toFixed(4), y: +(+n.gridY).toFixed(4) };
      }
    });
    return positions;
  }

  // opts.embedData (table only): bake the current data into the file as CSV
  // and drop the sheet link, so the saved file never fetches anything.
  function exportHTML(opts) {
    const embed = !!(opts && opts.embedData === true);
    let data;
    if (currentTool === 'table') {
      if (embed) {
        const snap = TBL.csvSnapshot() || TBL.state.csvText;
        if (!snap) { alert('No data loaded yet — connect a sheet or upload a CSV first.'); return; }
        data = {
          v: 1,
          tool: 'table',
          title: TBL.state.name || 'table',
          source: 'csv',
          url: '',
          csv: snap,
          settings: TBL.S
        };
      } else {
        data = {
          v: 1,
          tool: 'table',
          title: TBL.state.name || 'table',
          source: TBL.state.source,
          url: TBL.state.source === 'sheets' ? TBL.state.url : '',
          csv: TBL.state.source === 'csv' ? TBL.state.csvText : '',
          settings: TBL.S
        };
      }
    } else {
      data = {
        v: 1,
        tool: 'mapper',
        title: chartName || 'chart',
        source: dataSource,
        urls: { entities: CONFIG.entitiesUrl, connections: CONFIG.connectionsUrl, views: CONFIG.viewsUrl },
        csv: dataSource === 'csv' ? { entities: csvData.entities, connections: csvData.connections, views: csvData.views } : null,
        physicsMode: physicsMode,
        physicsDuration: physicsDurationSec,
        settings: formattingSettings,
        colorLegend: colorLegendEntries,
        shapeLegend: shapeLegendEntries,
        positions: gatherPositions()
      };
    }
    const clone = document.documentElement.cloneNode(true);
    clone.querySelectorAll('.authoring-only').forEach(el => el.remove());
    clone.querySelectorAll('#authoring-script, #html2canvas-script').forEach(el => el.remove());
    clone.querySelectorAll('#leo-chart-data').forEach(el => el.remove());
    clone.querySelectorAll('#filter-dd, #bf-filter-dd').forEach(el => el.remove());
    // Reset the table area — the exported file re-renders it at boot.
    const ta = clone.querySelector('#table-app');
    if (ta) ta.innerHTML = '<div id="load-screen"><div class="spin"></div>Loading&hellip;</div>';
    // Reset root visibility — the boot logic decides which component shows.
    const w = clone.querySelector('#wrap'); if (w) w.style.display = '';
    const tr = clone.querySelector('#table-root'); if (tr) tr.style.display = 'none';
    const head = clone.querySelector('head');
    const dataScript = document.createElement('script');
    dataScript.id = 'leo-chart-data';
    dataScript.type = 'application/json';
    // Escape "</" so CSV snapshots can never terminate the script block.
    dataScript.textContent = JSON.stringify(data).replace(/<\//g, '<\\/');
    head.appendChild(dataScript);
    const html = '<!doctype html>\n' + clone.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = sanitizeFilename(data.title) + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* ---------- export: high-res PNG (mapper only) ---------- */
  async function exportPNG() {
    if (typeof html2canvas === 'undefined') { alert('PNG library not loaded — check your connection and try again.'); return; }
    const savedSel = selectedNode, savedHover = hoveredNode, savedHoverConn = hoveredConnection;
    selectedNode = null; hoveredNode = null; hoveredConnection = null;
    const wasCollapsed = optionsPanel.classList.contains('collapsed');
    optionsPanel.classList.add('collapsed');
    const topControls = document.getElementById('top-controls');
    const tcDisplay = topControls ? topControls.style.display : '';
    if (topControls) topControls.style.display = 'none';
    const legToggle = document.getElementById('legend-toggle');
    const ltDisplay = legToggle ? legToggle.style.display : '';
    if (legToggle) legToggle.style.display = 'none';
    const ga = document.getElementById('graph-area');

    const simWasRunning = simulation && simulation.alpha() > simulation.alphaMin();
    if (simulation) simulation.stop();

    const restoreUI = () => {
      if (topControls) topControls.style.display = tcDisplay;
      if (legToggle) legToggle.style.display = ltDisplay;
      if (!wasCollapsed) optionsPanel.classList.remove('collapsed');
      selectedNode = savedSel; hoveredNode = savedHover; hoveredConnection = savedHoverConn;
      if (simWasRunning && simulation) simulation.alpha(0.1).restart();
      render();
    };

    let chartDataUrl;
    try {
      render();
      chartDataUrl = canvas.toDataURL('image/png');
    } catch (e) {
      alert('PNG export blocked: a node/background image is hosted somewhere that does not allow cross-origin use, which taints the canvas. Re-host those images on a CORS-enabled service (e.g. ImgBB / most CDNs) and reload. Details: ' + e.message);
      restoreUI();
      return;
    }

    const rect = ga.getBoundingClientRect();
    const scale = 4000 / rect.width;
    const outW = Math.round(rect.width * scale);
    const outH = Math.round(rect.height * scale);

    // The legends and titles are centred with transform: translateX(-50%).
    // html2canvas applies a scrolling box's clip before its transform, so the
    // left part of each legend (the half that the translate shifts left) was
    // cut off in the PNG. Record where each one really sits on screen and pin
    // the copy that html2canvas renders to that exact spot, untransformed.
    const pinned = ['legend-container', 'shape-legend-container', 'chart-title', 'chart-subtitle']
      .map(id => {
        const el = document.getElementById(id);
        if (!el || getComputedStyle(el).display === 'none') return null;
        const r = el.getBoundingClientRect();
        return { id, left: r.left - rect.left, top: r.top - rect.top, width: r.width };
      })
      .filter(Boolean);

    try {
      const overlayCap = await html2canvas(ga, {
        scale: scale,
        backgroundColor: null,
        useCORS: true,
        logging: false,
        ignoreElements: (el) => el.classList && el.classList.contains('authoring-only'),
        onclone: (doc) => {
          pinned.forEach(p => {
            const el = doc.getElementById(p.id);
            if (!el) return;
            el.style.transform = 'none';
            el.style.transition = 'none';
            el.style.left = p.left + 'px';
            el.style.right = 'auto';
            el.style.top = p.top + 'px';
            el.style.width = Math.ceil(p.width) + 'px';
            el.style.maxWidth = 'none';
            el.style.boxSizing = 'border-box';
          });
          const c = doc.querySelector('#graph-area canvas') || doc.querySelector('canvas');
          if (c) c.style.visibility = 'hidden';
          const gaClone = doc.getElementById('graph-area');
          if (gaClone) gaClone.style.background = 'transparent';
          if (doc.body) doc.body.style.background = 'transparent';
          if (doc.documentElement) doc.documentElement.style.background = 'transparent';
        }
      });

      const chartImg = new Image();
      await new Promise((res, rej) => {
        chartImg.onload = res;
        chartImg.onerror = () => rej(new Error('chart snapshot failed to load'));
        chartImg.src = chartDataUrl;
      });

      const outCanvas = document.createElement('canvas');
      outCanvas.width = outW;
      outCanvas.height = outH;
      const octx = outCanvas.getContext('2d');
      octx.fillStyle = formattingSettings.backgroundColor || '#ffffff';
      octx.fillRect(0, 0, outW, outH);
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(chartImg, 0, 0, outW, outH);
      octx.drawImage(overlayCap, 0, 0, outW, outH);

      const a = document.createElement('a');
      a.href = outCanvas.toDataURL('image/png');
      a.download = sanitizeFilename(chartName || 'chart') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (err) {
      alert('PNG export failed: ' + err.message);
    } finally {
      restoreUI();
    }
  }

  /* ---------- init: tool starts on the start page ---------- */
  const lo = document.getElementById('loading-overlay');
  if (lo) lo.style.display = 'none';   // hide spinner until a load actually begins
  showScreen('home');
  overlay.style.display = 'flex';
})();

</script>
